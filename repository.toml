# Adash repository metadata.
#
# The package inventory: what exists, which subsystem owns it, and whether it
# is part of a public API or an implementation detail. This file is not
# documentation about the code -- it is checked against the code. adash_check
# verifies both directions: every spec named here exists, and every spec that
# exists is named here. A package added without an entry has no recorded
# owner, and ownership is what the architecture is made of.
#
# `version` must agree with alire.toml. Two files record it because they
# answer different questions, and a release that ships them disagreeing is a
# release nobody can identify afterwards.

version = "0.1.0-dev"
schema = 1

[project]
name = "adash"
crate = "adash"
test_crate = "adash_tests"
language = "Ada 2022"

# The crates that own capabilities Adash may not implement for itself. Listed
# here so the rule has a machine-readable form and not only a paragraph in
# AI.md.
[providers]
platform = "hostkit"
messages = "messages"
styling = "terminal_styles"
tooling = "project_tools"
tests = "aunit"
# Not yet in the dependency graph. jsonlib and tomllib do not exist and are to
# be created as sibling crates. Until
# then no Adash source may parse JSON or TOML, and none does.
json = "jsonlib"
toml = "tomllib"

# ---------------------------------------------------------------------------
# Package inventory.
#
# status is one of: complete, in_progress, planned. Only `complete` packages
# may be depended on by another subsystem.
# ---------------------------------------------------------------------------

