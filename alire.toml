name = "adash"
description = "A shell whose command language is a defined subset of Ada"
version = "0.1.0"

authors = ["Bent Bracke"]
maintainers = ["Bent Bracke <bent@bracke.dk>"]
maintainers-logins = ["bracke"]
licenses = "MIT"
website = "https://github.com/bracke/adash"
long-description = "Adash is a shell whose command language is a defined subset of Ada rather than a POSIX-derived syntax. Interactive input and scripts pass through one language pipeline -- lexer, parser, semantic analysis, evaluator -- and one execution engine, so a line typed at the prompt and a line in a script mean the same thing. Platform services come from hostkit, user-visible text from message catalogs, terminal styling from terminal_styles; Adash itself owns the language, the execution policy and the shell's own semantics."
tags = ["shell", "ada", "interpreter", "cli"]
project-files = ["adash.gpr"]
executables = ["adash"]

[[depends-on]]
gnat_native = "=15.2.1"

[[depends-on]]
terminal_styles = "=0.1.0-dev"

[[depends-on]]
messages = "~0.1.0"

[[depends-on]]
hostkit = "*"

[[depends-on]]

[[depends-on]]
jsonlib = "*"

[[depends-on]]
tomllib = "*"

[[pins]]
terminal_styles = { path = "../terminal_styles" }

[[pins]]
messages = { path = "../messages" }

[[pins]]
hostkit = { path = "../hostkit" }

# JSON and TOML. Adash parses neither for itself: jsonlib is the exclusive
# provider of one and tomllib of the other, and a hand-rolled reader for either
# inside this crate would be a second implementation to keep correct.
[[pins]]
jsonlib = { path = "../jsonlib" }

[[pins]]
tomllib = { path = "../tomllib" }


# Adash needs none of the following itself. They arrive because `messages`
# pins `i18n`, whose pre-build tooling regenerates CLDR and tzdb data over
# HTTPS and so builds `httpclient`, whose TLS backend is `ssllib`. Alire
# honours pins only in the root crate, so every root that builds this graph
# has to name them, exactly as model_runner and versionlib do.
[[pins]]
httpclient = { path = "../httpclient" }

[[pins]]
ssllib = { path = "../ssllib" }

[[pins]]
cryptolib = { path = "../cryptolib" }

[[pins]]
truststores = { path = "../truststores" }

[[pins]]
zlib = { path = "../zlib" }

# i18n's CLDR tooling parses upstream data through an in-process AWK
# interpreter, so awklib and its regexp dependency are in this graph too.
# Named here for the same reason as the crates above: Alire honours pins only
# in the root crate, and a run that found them anyway was relying on a cache.
[[pins]]
awklib = { path = "../awklib" }

[[pins]]
regexp = { path = "../regexp" }

# The same tooling untars what it downloads. tarlib was the one crate of that
# graph nobody named here, and it went unnoticed because i18n's regeneration
# was silently doing nothing: once it ran, a build of adash stopped at
# "Pin path is not a valid directory: .../Ada/tarlib" on all three hosts.
[[pins]]
tarlib = { path = "../tarlib" }

# Build dependencies in the development profile (-Og) too, not the default
# release (-O3). Keeping every root on the same profile lets them share object
# files instead of forcing a rebuild whenever a different root is built.
# Development is what you build during development; release is for a release.
[build-profiles]
"*" = "development"

[[actions]]
type = "test"
command = ["sh", "-c", "cd adash_tests && alr -n build && ./bin/adash_tests"]
