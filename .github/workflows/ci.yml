# Continuous integration.
#
# This file is an entry point, not a build system. Every decision it could make
# -- what to check, in what order, what counts as a failure -- lives in the Ada
# tools instead, so that a maintainer runs locally exactly what CI runs and
# gets the same answer. The rule against non-Ada repository tooling is why this
# file only ever invokes `alr` and the programs in adash_tests.
#
# Adash is developed alongside its sibling crates, which Alire finds through
# path pins. CI has to reproduce that layout before it can resolve anything.
#
# Three hosts, and that is the point rather than a nicety. Adash depends on
# hostkit, whose whole reason to exist is that operating systems differ:
# Windows has no process groups and no pseudo-terminals, macOS answers some
# questions differently from Linux, and a change validated on one of them has
# not been validated.
#
# macOS must be the x86_64 image: the pinned gnat_native ships no
# aarch64-darwin binary. Never reduce the matrix to make a run green.
#
# Every conformance case runs on every host. The cases that need a program to
# run name `{emit}` or `{upcase}` -- companions adash_tests builds -- rather
# than `cat` or `true`, so capturing a program's output, redirection,
# pipelines and job states are checked on Windows too. A case may still gate
# itself with a `platforms` key, and none does; if one appears, it is a gap
# rather than a solution.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suffix: ""
          - os: macos-15-intel
            suffix: ""
          - os: windows-latest
            suffix: ".exe"


    runs-on: ${{ matrix.os }}

    # One shell on every host, so a step reads the same way everywhere and a
    # path written with forward slashes keeps working. Windows runners carry
    # bash; using it is cheaper than three spellings of every step.
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out adash
        uses: actions/checkout@v4
        with:
          path: Ada/adash

      # The pinned graph. adash pins these by relative path, and Alire honours
      # pins only in the root crate, so every one of them has to be present --
      # a resolve that succeeds without them was reading a cache.
      - name: Check out sibling crates
        run: |
          set -eu
          cd Ada

          # Three tries each. A clone that dies halfway -- "RPC failed; curl 56
          # Recv failure", which is a runner's network and not this repository
          # -- failed the whole job and read like a real failure until somebody
          # opened the log. Fourteen clones in a row is fourteen chances of
          # that, and the answer to a transient fault is to try it again rather
          # than to make a person do it.
          #
          # The partial clone goes before each retry: git will not clone into a
          # directory that is already there, so a second attempt on top of a
          # first would fail for a reason that has nothing to do with the
          # network.
          for crate in hostkit messages terminal_styles project_tools \
                       jsonlib tomllib i18n httpclient ssllib cryptolib \
                       truststores zlib awklib regexp tarlib; do
            for attempt in 1 2 3; do
              if git clone --depth 1 \
                   "https://github.com/bracke/${crate}.git" "${crate}"; then
                break
              fi

              if [ "${attempt}" = 3 ]; then
                echo "could not clone ${crate} after three attempts"
                exit 1
              fi

              echo "cloning ${crate} failed; trying again"
              rm -rf "${crate}"
              sleep 5
            done
          done

      - name: Install Alire
        uses: alire-project/setup-alire@v4
        with:
          version: 2.1.0

      - name: Build adash
        working-directory: Ada/adash
        shell: bash
        run: |
          set -o pipefail

          #  A clean build says nothing, and until now nobody was checking
          #  that here: `alr build` exits 0 with warnings on its output, so a
          #  (style) complaint or an unused `use` clause reached the
          #  repository and stayed. It survived locally too, because an
          #  incremental build does not recompile the file that carries it --
          #  which is exactly why a fresh runner is the right place to ask.
          #
          #  This crate's own units only. `alr build` compiles the path
          #  dependencies as well, and what one of those has to say about its
          #  own sources belongs to its own repository -- not to a run that
          #  cannot fix it.
          alr -n build 2>&1 | tee "${RUNNER_TEMP:-/tmp}/build-output.txt"
          if grep -Eq "^adash[a-z0-9_.-]*\\.(ad[bs]|c|h):[0-9]+:[0-9]+: " \
             "${RUNNER_TEMP:-/tmp}/build-output.txt"
          then
            echo "The build said something. A clean build says nothing:"
            grep -E "^adash[a-z0-9_.-]*\\.(ad[bs]|c|h):[0-9]+:[0-9]+: " \
              "${RUNNER_TEMP:-/tmp}/build-output.txt"
            exit 1
          fi

      # Alire fetches AUnit from GitHub the first time this crate is built,
      # and a runner's network is not this repository -- the same reasoning as
      # the three tries on the clones above. One run failed on two hosts in the
      # same minute: `curl ... exited with code 6` on macOS, and on Ubuntu a
      # release integrity test that expected one sha512 and got another, which
      # is what a download that arrived truncated looks like. Both read like a
      # real failure of the commit under test, and neither was one.
      #
      # Fetching first also keeps the build step's output about the build: a
      # download's progress bar in the middle of it is one more thing between a
      # reader and the compiler's own words.
      - name: Fetch the test crate's dependencies
        working-directory: Ada/adash/adash_tests
        shell: bash
        run: |
          set -u

          for try in 1 2 3; do
            if alr -n update; then
              exit 0
            fi

            echo "alr update did not finish (try ${try})"
            sleep $((try * 10))
          done

          echo "alr update failed three times; this is the runner's network"
          exit 1

      - name: Build the test crate
        working-directory: Ada/adash/adash_tests
        shell: bash
        run: |
          set -o pipefail

          #  A clean build says nothing, and until now nobody was checking
          #  that here: `alr build` exits 0 with warnings on its output, so a
          #  (style) complaint or an unused `use` clause reached the
          #  repository and stayed. It survived locally too, because an
          #  incremental build does not recompile the file that carries it --
          #  which is exactly why a fresh runner is the right place to ask.
          #
          #  This crate's own units only. `alr build` compiles the path
          #  dependencies as well, and what one of those has to say about its
          #  own sources belongs to its own repository -- not to a run that
          #  cannot fix it.
          alr -n build 2>&1 | tee "${RUNNER_TEMP:-/tmp}/build-output.txt"
          if grep -Eq "^adash[a-z0-9_.-]*\\.(ad[bs]|c|h):[0-9]+:[0-9]+: " \
             "${RUNNER_TEMP:-/tmp}/build-output.txt"
          then
            echo "The build said something. A clean build says nothing:"
            grep -E "^adash[a-z0-9_.-]*\\.(ad[bs]|c|h):[0-9]+:[0-9]+: " \
              "${RUNNER_TEMP:-/tmp}/build-output.txt"
            exit 1
          fi

      # The suite runs the conformance cases and the examples as routines of
      # its own, so this one command covers all three. The separate runs below
      # exist because a per-case report is what a failure needs, and because a
      # check that only ever runs inside another is one nobody reads the output
      # of.
      # The suffix rather than bash's own guess: MSYS will often find
      # `foo.exe` for `./foo`, and a step that depends on it is a step that
      # breaks when somebody changes the shell.
      #  Before the suites: does the shell work at all on this host when
      #  nothing of ours is between it and the terminal? The conformance runner
      #  spawns it with a replaced environment and three pipes, and on Windows
      #  628 of 629 cases came back with exit status 1 and not a word on either
      #  stream. That is either the shell or the way the suite starts it, and
      #  running it plainly is what tells the two apart.
      - name: Ask the shell directly
        working-directory: Ada/adash
        run: |
          set -x
          ./bin/adash${{ matrix.suffix }} --version
          echo 'put_line ("spoken to directly");' | ./bin/adash${{ matrix.suffix }}
          printf 'put_line ("from a file");\n' > /tmp/direct.adash
          ./bin/adash${{ matrix.suffix }} /tmp/direct.adash

      - name: Run the AUnit suite
        working-directory: Ada/adash/adash_tests
        run: |
          set -eu
          # A watchdog, because eight of these cases drive the shell through a
          # terminal and a case that waits for a byte that never comes would
          # otherwise hold the job until the six-hour limit -- with no output,
          # since a killed job prints nothing. Killed here instead, the step
          # fails, the log survives, and the last test AUnit printed names the
          # one that did not finish. Written out rather than `timeout`, which
          # macOS does not have.
          #
          # Twenty-five minutes rather than ten. Each terminal case waits
          # patiently for a shell that may be slow to start on a loaded runner,
          # and there are more of them than there were; the macOS job now takes
          # about half an hour in total. The bound is here to turn a hang into
          # a report, not to police how long a healthy run takes -- and a bound
          # that a healthy run approaches will one day kill one, which reads as
          # a hang and sends somebody looking in the wrong place.
          ./bin/adash_tests${{ matrix.suffix }} &
          suite=$!

          for _ in $(seq 1 1500); do
            kill -0 "$suite" 2>/dev/null || break
            sleep 1
          done

          if kill -0 "$suite" 2>/dev/null; then
            echo "the suite was still running after twenty-five minutes; killing it"
            kill -9 "$suite" 2>/dev/null || true
            wait "$suite" 2>/dev/null || true
            exit 1
          fi

          wait "$suite"

      - name: Run the conformance suite
        working-directory: Ada/adash/adash_tests
        run: ./bin/adash_conformance${{ matrix.suffix }}

      - name: Check the repository invariants
        working-directory: Ada/adash/adash_tests
        run: ./bin/adash_check${{ matrix.suffix }}

      # Benchmarks, and they can fail the job.
      #
      # For as long as this tool existed it only reported, and its numbers were
      # refreshed by hand in benchmarks/README.md and compared by whoever
      # thought to look -- which is how the one performance regression this
      # project has had went unnoticed for weeks. Every figure has a ceiling in
      # benchmarks/ceilings.toml now, and a figure over its ceiling exits
      # non-zero.
      #
      # Runnable here because those ceilings are an order of magnitude above
      # what the operations take. A shared runner under an unknown load is not
      # comparable with a developer machine and the bounds do not pretend
      # otherwise; what they still catch is an operation that became ten times
      # slower because of what it now does, which is the shape of every
      # performance defect this project has actually had.
      #
      # Fewer repetitions than the default, because a median of fifty separates
      # that from noise as well as a median of two hundred does and this runs
      # three times per push.
      - name: Run the benchmarks against their ceilings
        working-directory: Ada/adash/adash_tests
        run: ./bin/adash_bench${{ matrix.suffix }} 50

  # The profile a user would build.
  #
  # `alr build` is the development profile: -Og, every check, every warning.
  # What anybody installing this would get is `--release`: -O3 and inlining.
  # Until 2026-08-20 the conformance suite could not even run against one --
  # three cases had `profile=development` written into what they expected --
  # so the shipped build had never been through it. It passes now, and this
  # job is what keeps that true.
  #
  # One host, deliberately. What the profile changes is optimization, not the
  # platform bodies; those are what the matrix above is for, and running four
  # jobs where one answers the question would buy nothing. If a release-only
  # defect ever turns out to be host-specific, this is the comment that was
  # wrong and the job that should become a matrix.
  release-and-validation:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out adash
        uses: actions/checkout@v4
        with:
          path: Ada/adash

      # The pinned graph. adash pins these by relative path, and Alire honours
      # pins only in the root crate, so every one of them has to be present --
      # a resolve that succeeds without them was reading a cache.
      - name: Check out sibling crates
        run: |
          set -eu
          cd Ada

          # Three tries each. A clone that dies halfway -- "RPC failed; curl 56
          # Recv failure", which is a runner's network and not this repository
          # -- failed the whole job and read like a real failure until somebody
          # opened the log. Fourteen clones in a row is fourteen chances of
          # that, and the answer to a transient fault is to try it again rather
          # than to make a person do it.
          #
          # The partial clone goes before each retry: git will not clone into a
          # directory that is already there, so a second attempt on top of a
          # first would fail for a reason that has nothing to do with the
          # network.
          for crate in hostkit messages terminal_styles project_tools \
                       jsonlib tomllib i18n httpclient ssllib cryptolib \
                       truststores zlib awklib regexp tarlib; do
            for attempt in 1 2 3; do
              if git clone --depth 1 \
                   "https://github.com/bracke/${crate}.git" "${crate}"; then
                break
              fi

              if [ "${attempt}" = 3 ]; then
                echo "could not clone ${crate} after three attempts"
                exit 1
              fi

              echo "cloning ${crate} failed; trying again"
              rm -rf "${crate}"
              sleep 5
            done
          done

      - name: Install Alire
        uses: alire-project/setup-alire@v4
        with:
          version: 2.1.0

      - name: Build adash at the release profile
        working-directory: Ada/adash
        run: alr -n build --release

      # Alire fetches AUnit from GitHub the first time this crate is built,
      # and a runner's network is not this repository -- the same reasoning as
      # the three tries on the clones above. One run failed on two hosts in the
      # same minute: `curl ... exited with code 6` on macOS, and on Ubuntu a
      # release integrity test that expected one sha512 and got another, which
      # is what a download that arrived truncated looks like. Both read like a
      # real failure of the commit under test, and neither was one.
      #
      # Fetching first also keeps the build step's output about the build: a
      # download's progress bar in the middle of it is one more thing between a
      # reader and the compiler's own words.
      - name: Fetch the test crate's dependencies
        working-directory: Ada/adash/adash_tests
        shell: bash
        run: |
          set -u

          for try in 1 2 3; do
            if alr -n update; then
              exit 0
            fi

            echo "alr update did not finish (try ${try})"
            sleep $((try * 10))
          done

          echo "alr update failed three times; this is the runner's network"
          exit 1

      - name: Build the test crate at the release profile
        working-directory: Ada/adash/adash_tests
        run: alr -n build --release

      # Built again, because building the test crate rebuilds its path
      # dependency -- including the shell in bin -- at whatever profile that
      # build chose. The suite runs `bin/adash`, so the last word on what is in
      # `bin` has to be this one.
      - name: Put the release shell back in bin
        working-directory: Ada/adash
        run: |
          alr -n build --release
          ./bin/adash --version

      - name: Run the conformance suite against it
        working-directory: Ada/adash/adash_tests
        run: ./bin/adash_conformance

      - name: Run the AUnit suite against it
        working-directory: Ada/adash/adash_tests
        run: |
          set -eu

          # The same watchdog as the matrix job's: eight cases drive the shell
          # through a terminal, and one waiting for a byte that never comes
          # would otherwise hold the job until the six-hour limit.
          ./bin/adash_tests &
          suite=$!
          ( sleep 900; kill -9 "${suite}" 2>/dev/null || true ) &
          watchdog=$!
          wait "${suite}"
          status=$?
          kill "${watchdog}" 2>/dev/null || true
          exit "${status}"

      # And the third profile, last, which is a build rather than a run.
      #
      # Validation compiles with `-gnatwe`, so every warning is an error there
      # -- the same rule the build steps above enforce by reading their own
      # output, said by the compiler instead, and it costs a build rather than
      # a suite. Last because building it replaces `bin/adash`, and everything
      # above this line is meant to be running the *release* shell: put here
      # in the middle, the AUnit suite would have been testing a binary the
      # job never claims to test.
      - name: Build at the validation profile, where warnings are errors
        working-directory: Ada/adash
        run: alr -n build --validation

      - name: Build the test crate at the validation profile
        working-directory: Ada/adash/adash_tests
        run: alr -n build --validation
