# Continuous integration.
#
# This file is an entry point, not a build system. Every decision it could make
# -- what to check, in what order, what counts as a failure -- lives in the Ada
# tools instead, so that a maintainer runs locally exactly what CI runs and
# gets the same answer. The rule against non-Ada repository tooling is why this
# file only ever invokes `alr` and the programs in adash_tests.
#
# Adash is developed alongside its sibling crates, which Alire finds through
# path pins. CI has to reproduce that layout before it can resolve anything.
#
# Three hosts, and that is the point rather than a nicety. Adash depends on
# hostkit, whose whole reason to exist is that operating systems differ:
# Windows has no process groups and no pseudo-terminals, macOS answers some
# questions differently from Linux, and a change validated on one of them has
# not been validated.
#
# macOS must be the x86_64 image: the pinned gnat_native ships no
# aarch64-darwin binary. Never reduce the matrix to make a run green.
#
# Every conformance case runs on every host. The cases that need a program to
# run name `{emit}` or `{upcase}` -- companions adash_tests builds -- rather
# than `cat` or `true`, so capturing a program's output, redirection,
# pipelines and job states are checked on Windows too. A case may still gate
# itself with a `platforms` key, and none does; if one appears, it is a gap
# rather than a solution.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suffix: ""
          - os: macos-15-intel
            suffix: ""
          - os: windows-latest
            suffix: ".exe"


    runs-on: ${{ matrix.os }}

    # One shell on every host, so a step reads the same way everywhere and a
    # path written with forward slashes keeps working. Windows runners carry
    # bash; using it is cheaper than three spellings of every step.
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out adash
        uses: actions/checkout@v4
        with:
          path: Ada/adash

      # The pinned graph. adash pins these by relative path, and Alire honours
      # pins only in the root crate, so every one of them has to be present --
      # a resolve that succeeds without them was reading a cache.
      - name: Check out sibling crates
        run: |
          set -eu
          cd Ada

          # Three tries each. A clone that dies halfway -- "RPC failed; curl 56
          # Recv failure", which is a runner's network and not this repository
          # -- failed the whole job and read like a real failure until somebody
          # opened the log. Fourteen clones in a row is fourteen chances of
          # that, and the answer to a transient fault is to try it again rather
          # than to make a person do it.
          #
          # The partial clone goes before each retry: git will not clone into a
          # directory that is already there, so a second attempt on top of a
          # first would fail for a reason that has nothing to do with the
          # network.
          for crate in hostkit messages terminal_styles project_tools \
                       jsonlib tomllib i18n httpclient ssllib cryptolib \
                       truststores zlib awklib regexp; do
            for attempt in 1 2 3; do
              if git clone --depth 1 \
                   "https://github.com/bracke/${crate}.git" "${crate}"; then
                break
              fi

              if [ "${attempt}" = 3 ]; then
                echo "could not clone ${crate} after three attempts"
                exit 1
              fi

              echo "cloning ${crate} failed; trying again"
              rm -rf "${crate}"
              sleep 5
            done
          done

      - name: Install Alire
        uses: alire-project/setup-alire@v4
        with:
          version: 2.1.0

      - name: Build adash
        working-directory: Ada/adash
        run: alr -n build

      - name: Build the test crate
        working-directory: Ada/adash/adash_tests
        run: alr -n build

      # The suite runs the conformance cases and the examples as routines of
      # its own, so this one command covers all three. The separate runs below
      # exist because a per-case report is what a failure needs, and because a
      # check that only ever runs inside another is one nobody reads the output
      # of.
      # The suffix rather than bash's own guess: MSYS will often find
      # `foo.exe` for `./foo`, and a step that depends on it is a step that
      # breaks when somebody changes the shell.
      #  Before the suites: does the shell work at all on this host when
      #  nothing of ours is between it and the terminal? The conformance runner
      #  spawns it with a replaced environment and three pipes, and on Windows
      #  628 of 629 cases came back with exit status 1 and not a word on either
      #  stream. That is either the shell or the way the suite starts it, and
      #  running it plainly is what tells the two apart.
      - name: Ask the shell directly
        working-directory: Ada/adash
        run: |
          set -x
          ./bin/adash${{ matrix.suffix }} --version
          echo 'put_line ("spoken to directly");' | ./bin/adash${{ matrix.suffix }}
          printf 'put_line ("from a file");\n' > /tmp/direct.adash
          ./bin/adash${{ matrix.suffix }} /tmp/direct.adash

      - name: Run the AUnit suite
        working-directory: Ada/adash/adash_tests
        run: |
          set -eu
          # A watchdog, because five of these cases drive the shell through a
          # terminal and a case that waits for a byte that never comes would
          # otherwise hold the job until the six-hour limit -- with no output,
          # since a killed job prints nothing. Killed here instead, the step
          # fails, the log survives, and the last test AUnit printed names the
          # one that did not finish. Written out rather than `timeout`, which
          # macOS does not have.
          ./bin/adash_tests${{ matrix.suffix }} &
          suite=$!

          for _ in $(seq 1 600); do
            kill -0 "$suite" 2>/dev/null || break
            sleep 1
          done

          if kill -0 "$suite" 2>/dev/null; then
            echo "the suite was still running after ten minutes; killing it"
            kill -9 "$suite" 2>/dev/null || true
            wait "$suite" 2>/dev/null || true
            exit 1
          fi

          wait "$suite"

      - name: Run the conformance suite
        working-directory: Ada/adash/adash_tests
        run: ./bin/adash_conformance${{ matrix.suffix }}

      - name: Check the repository invariants
        working-directory: Ada/adash/adash_tests
        run: ./bin/adash_check${{ matrix.suffix }}

      # Benchmarks, and they can fail the job.
      #
      # For as long as this tool existed it only reported, and its numbers were
      # refreshed by hand in benchmarks/README.md and compared by whoever
      # thought to look -- which is how the one performance regression this
      # project has had went unnoticed for weeks. Every figure has a ceiling in
      # benchmarks/ceilings.toml now, and a figure over its ceiling exits
      # non-zero.
      #
      # Runnable here because those ceilings are an order of magnitude above
      # what the operations take. A shared runner under an unknown load is not
      # comparable with a developer machine and the bounds do not pretend
      # otherwise; what they still catch is an operation that became ten times
      # slower because of what it now does, which is the shape of every
      # performance defect this project has actually had.
      #
      # Fewer repetitions than the default, because a median of fifty separates
      # that from noise as well as a median of two hundred does and this runs
      # three times per push.
      - name: Run the benchmarks against their ceilings
        working-directory: Ada/adash/adash_tests
        run: ./bin/adash_bench${{ matrix.suffix }} 50
