# What a measured operation may not exceed, in microseconds.
#
# `adash_bench` reported and nothing read it. A number in benchmarks/README.md
# is refreshed by hand and compared by a person who thought to look, which
# means a regression is found when somebody happens to be looking at
# performance -- and the one regression this project has had was found that
# way, weeks after it landed.
#
# So every figure the benchmark prints has a ceiling here, and a figure over
# its ceiling fails the run. That is what lets CI run it.
#
# **These are deliberately an order of magnitude above what the operations
# take.** A benchmark gate that fails on noise is a gate that gets disabled,
# and the machines this runs on are not comparable: a shared CI runner under
# an unknown load, a laptop on battery, three operating systems, two build
# profiles. None of those differences is a defect, and a bound tight enough to
# notice them would report them all as one.
#
# What a bound this loose can still catch is the thing worth catching: an
# operation that became ten times slower because of what it now does -- a scan
# added inside a loop, a cache that stopped being used, a file read per
# keystroke. That is the shape of every performance defect this project has
# actually had.
#
# A figure with no ceiling here fails the run as well. A new measurement
# without a bound is a measurement no run can fail on, and adding one is the
# moment to think about what it should be.
#
# Recorded against a development build (`-Og`), which is the slower of the two
# profiles and therefore the one a ceiling has to accommodate.

[ceiling]

# The language pipeline, per typed line. Everything here is small, and the
# floor of 100 is the clock's resolution rather than a claim about the work.
utf8 = 100
lex = 500
parse = 600

# Analysis is the largest figure in the pipeline and the one that has moved
# before: it checks every declaration a submission carries, and the regression
# that made this project measure at all was 87 of them where there had been a
# few.
analyse = 10000

# The same line analysed beside 128 declarations the session is still carrying.
#
# Not a bound on the analyser: it is a bound on the shape. A submission is
# analysed together with everything earlier submissions declared, so the work
# grows with what the user has typed -- 2.9 ms for a line on its own against
# 84 ms for the same line beside 128 declarations here, and a session carries
# up to 256. That is the design and it is written down in the language
# reference; what this figure is for is noticing the day it stops being linear
# in the count.
analyse_carried = 900000

run = 200
highlight = 500

# The interactive frontend, per tab and per keystroke.
complete = 1000

# Completing a program name lists every directory on PATH and asks the host
# whether the matching names can be run. What that costs is a fact about the
# machine's PATH -- a CI runner carries a much longer one than a laptop -- so
# this ceiling is looser than the rest on purpose.
#
# Raised from 60000 by the first CI run that used it. The three hosts do not
# differ by a little here: 2.6 ms on Linux and macOS, 38.9 ms on the Windows
# runner, whose PATH is long and whose "can this be run" question is a
# filesystem call per candidate. A bound with half a host's measurement of
# headroom is a bound that fails on a busy day and teaches everybody to ignore
# it, so this one sits an order of magnitude above the slowest host rather than
# above the fastest.
complete_program = 400000

history = 100

# Reading a log of eight thousand lines and keeping the last thousand. This
# was 1.8 seconds when the excess was dropped one line at a time; it is a few
# hundred microseconds of file reading and JSON now. The bound is set well
# above the slowest host for the same reason `complete_program`'s is: it reads
# a file, and a busy runner's filesystem is not this shell's doing.
history_load = 40000

# Start-up, once per session. Nobody types while these run, but they are what
# stands between pressing return on `adash` and seeing a prompt.
config = 400
session = 2500

# When a figure is slower than itself.
#
# adash_bench prints the median *and* the fastest run because the gap between
# them is a shape a median alone hides: an operation that starts fast and gets
# slower as it repeats -- a cache filling with entries nothing evicts, a list
# that is rescanned from the start, a file handle opened once per call and
# never closed -- shows here as a fastest run far below the median. The tool
# has said so in its own report since it was written, and nothing failed on it.
#
# `ratio` is how many times the fastest run the median may be. Measured on the
# three CI hosts, the worst honest gap is 1.6 (Windows completing a program
# name, where the work itself varies with what is on PATH); everything else is
# within a few percent. Four leaves room for a runner that stalls for part of a
# run without leaving room for an operation that degrades.
#
# `floor` is the median below which the ratio is not applied, in microseconds.
# The smallest figures here are a fraction of a microsecond, where the ratio is
# measuring the clock's resolution rather than the operation.
[drift]
ratio = 4
floor = 20
