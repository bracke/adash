# The exit-status model, which is the one thing every caller of a shell reads.

suite = "exit-status"

[[case]]
id = "exit.quit-default"
requirement = "quit with no argument ends the session successfully."
script = "quit;"
exit_status = 0

[[case]]
id = "exit.quit-explicit"
requirement = "quit ends the session with the status it was given."
script = "quit (7);"
exit_status = 7

[[case]]
id = "exit.quit-zero"
requirement = "An explicit zero is success, and is not confused with no argument."
script = "quit (0);"
exit_status = 0

[[case]]
id = "exit.end-of-input"
requirement = "A session ended by end of input, rather than by asking, has succeeded."
script = ""
exit_status = 0

[[case]]
id = "exit.after-failure"
requirement = "A failed submission does not by itself set the session's exit status; quit does. A shell that exited non-zero because something earlier in the session failed would be one no script could use."
script = """
zzz;
quit (0);"""
exit_status = 0
output = []
diagnostics = [
  "!error.name_undeclared{name=zzz}!",
]

[[case]]
id = "status.zero-before-anything-ran"
requirement = "Nothing has failed yet, so the status a program reads is the one that means success."
script = "put_line (Status); quit (0);"
exit_status = 0
output = ["0"]
diagnostics = []

[[case]]
id = "status.reports-what-the-program-returned"
requirement = """
A program can tell whether what it ran succeeded. Commands are procedures --
`run (\"false\");` produces no value -- so a program that could not ask
afterwards could not act on a failure at all, which is most of what a shell
script does. Every shell has this and spells it `$?`.
"""
script = "run (\"false\"); put_line (Status); run (\"true\"); put_line (Status); quit (0);"
exit_status = 0
output = ["1", "0"]
diagnostics = []
platforms = ["linux", "macos"]

[[case]]
id = "status.names-a-program-that-was-not-found"
requirement = """
127 for a program that was not found, which is the one exit-status model
`Adash.Execution` documents. Every start failure used to answer 1 -- one number
for not found, not executable and a host that refused -- and nothing could
observe the difference until a program could read the status.
"""
script = "run (\"adash-no-such-program-anywhere\"); put_line (Status); quit (0);"
exit_status = 0
output = ["127"]
diagnostics = [
  "!error.command_not_found{command=adash-no-such-program-anywhere}!",
]

[[case]]
id = "status.survives-the-submission-that-set-it"
requirement = "It is session state, like a variable: what ran on one line is readable on the next."
script = """
run ("false");
put_line (Status);
quit (0);"""
exit_status = 0
output = ["1"]
diagnostics = []

[[case]]
id = "status.readable-inside-a-body"
requirement = "A subprogram can run something and answer whether it worked, which is what makes it composable."
script = "function Ran (What : String) return Boolean is begin run (What); return Status = 0; end Ran; if Ran (\"true\") then put_line (\"worked\"); end if; if not Ran (\"false\") then put_line (\"did not\"); end if; quit (0);"
exit_status = 0
output = ["worked", "did not"]
diagnostics = []
