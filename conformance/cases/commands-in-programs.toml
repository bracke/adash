# Commands are calls in the language.
#
# Every case here was impossible before commands became callable: a submission
# was either internal commands or program statements, never both, and a
# command's arguments were the source text they were written with rather than
# values.
#
# Each script is one line, deliberately. Input on standard input is submitted a
# line at a time -- that is what an interactive session does, and the runner
# feeds these the same way -- so a declaration on one line is gone by the next.
# One line is one submission, and a submission is what these cases are about.

suite = "commands-in-programs"

[[case]]
id = "commands.compute-then-exit"
requirement = "A script can compute a value and exit with it. This is the most basic shell script there is, and it could not be written."
script = "Total : Integer := 0; for Index in 1 .. 4 loop Total := Total + Index; end loop; quit (Total);"
exit_status = 10
output = []
diagnostics = []

[[case]]
id = "commands.interleave-with-statements"
requirement = "Commands and statements run in the order written, and a declaration survives across a command."
script = "X : Integer := 1; Y : Integer := X + 1; quit (Y);"
exit_status = 2
output = []
diagnostics = []

[[case]]
id = "commands.inside-a-branch"
requirement = "A command may appear inside control flow. No design that ran commands beside the language rather than inside it can express this."
script = "N : Integer := 5; if N > 3 then quit (1); else quit (0); end if;"
exit_status = 1
diagnostics = []

[[case]]
id = "commands.argument-is-a-value"
requirement = "A command receives the value of its argument, not the text of it."
script = "N : Integer := 6; quit (N);"
exit_status = 6
diagnostics = []

[[case]]
id = "commands.wrong-type-is-refused"
requirement = "A command's arguments are type-checked before anything runs, rather than discovered by the command failing to convert them."
script = "quit (\"later\");"
exit_status = 0
output = []
diagnostics = [
  "!error.type_mismatch{found=String,expected=Integer}!",
]

[[case]]
id = "commands.quit-halts-the-program"
requirement = "quit stops the program there. Statements after it in the same submission do not run, which is what anybody writing quit means."
script = "quit (3); pwd;"
exit_status = 3
output = []
diagnostics = []

[[case]]
id = "commands.quit-halts-from-inside-a-loop"
requirement = "quit stops the program wherever it is reached, including from inside control flow."
script = "for Index in 1 .. 3 loop quit (4); end loop;"
exit_status = 4
output = []
diagnostics = []

[[case]]
id = "commands.failure-does-not-stop-the-sequence"
requirement = "A failing command reports and the program continues, as both Ada and a POSIX shell do. Failing is not halting: only a command that ends the session stops the program."
script = "cd (\"./nowhere-at-all\"); quit (0);"
exit_status = 0
diagnostics = [
  "!error.directory_not_found{path=./nowhere-at-all}!",
]

[[case]]
id = "commands.local-survives-a-command-inside-a-body"
requirement = """
A command called inside a subprogram leaves the body's own variables where they
were. The stub the call goes through is declared outermost, so returning from it
left the machine's display pointing at the frame that had just been popped --
the same fix-up a call to a subprogram declared further out has always had, and
the one this had not. A command written as the last statement of a body hid it,
because nothing read a local afterwards.
"""
script = "procedure P is N : Integer := 1; begin set (\"CASE_UNUSED=1\"); N := N + 1; put_line (N); end P; P; quit (0);"
exit_status = 0
output = [
  "2",
]
diagnostics = []

[[case]]
id = "commands.value-read-inside-a-body"
requirement = """
Env_Value answers the same inside a subprogram as outside one, at any depth, and
what the body declared around it is still there afterwards.
"""
script = "set (\"CASE_PROBE=inner\"); procedure Outer is procedure Inner is Y : String := Env_Value (\"CASE_PROBE\"); begin put_line (Y); end Inner; X : Integer := 5; begin Inner; put_line (X); end Outer; Outer; quit (0);"
exit_status = 0
output = [
  "inner",
  "5",
]
diagnostics = []

[[case]]
id = "help.entries-say-what-each-command-is-for"
requirement = """
`help` lists a command's name beside what that command is for. The summary was
an empty string for as long as `help` had existed, so the listing was a column
of names beside a column of nothing.

A command may not render -- it produces identifiers and typed arguments, and an
argument is text in its final form -- so the line names the message that says
what the command does and the frontend renders that one into this one. Both
halves appear as identifiers here, which is what shows that neither was turned
into text before it reached the boundary.

The whole listing is pinned rather than one line of it: a command added without
documentation is exactly the mistake this catches, and it can only catch it by
knowing what the complete list is.
"""
script = "help;"
exit_status = 0
output = [
  "!line.command_entry{name=cd,summary=!command.cd.doc!}!",
  "!line.command_entry{name=pwd,summary=!command.pwd.doc!}!",
  "!line.command_entry{name=quit,summary=!command.exit.doc!}!",
  "!line.command_entry{name=set,summary=!command.set.doc!}!",
  "!line.command_entry{name=unset,summary=!command.unset.doc!}!",
  "!line.command_entry{name=env,summary=!command.env.doc!}!",
  "!line.command_entry{name=jobs,summary=!command.jobs.doc!}!",
  "!line.command_entry{name=help,summary=!command.help.doc!}!",
  "!line.command_entry{name=version,summary=!command.version.doc!}!",
  "!line.command_entry{name=history,summary=!command.history.doc!}!",
  "!line.command_entry{name=source,summary=!command.source.doc!}!",
  "!line.command_entry{name=run,summary=!command.run.doc!}!",
  "!line.command_entry{name=run_into,summary=!command.run_into.doc!}!",
  "!line.command_entry{name=run_from,summary=!command.run_from.doc!}!",
  "!line.command_entry{name=run_append,summary=!command.run_append.doc!}!",
  "!line.command_entry{name=run_new,summary=!command.run_new.doc!}!",
  "!line.command_entry{name=pipe,summary=!command.pipe.doc!}!",
  "!line.command_entry{name=pipe_run,summary=!command.pipe_run.doc!}!",
  "!line.command_entry{name=start,summary=!command.start.doc!}!",
  "!line.command_entry{name=wait,summary=!command.wait.doc!}!",
  "!line.command_entry{name=stop,summary=!command.stop.doc!}!",
  "!line.command_entry{name=suspend,summary=!command.suspend.doc!}!",
  "!line.command_entry{name=resume,summary=!command.resume.doc!}!",
  "!line.command_entry{name=write_file,summary=!command.write_file.doc!}!",
  "!line.command_entry{name=append_file,summary=!command.append_file.doc!}!",
  "!line.command_entry{name=settings,summary=!command.settings.doc!}!",
  "!line.command_entry{name=save_settings,summary=!command.save_settings.doc!}!",
]
diagnostics = []

[[case]]
id = "environment.env-lists-what-children-inherit-and-unset-removes-one"
requirement = """
`env` lists the variables a child would be given, and `unset` takes one away.
Written together because neither can be observed without the other: what `set`
did is only visible through `env`, and what `unset` did is only visible as an
absence from the same list.

The case clears what the runner itself put in the environment first, so what
`env` prints is exactly what the script asked for -- otherwise it would list
the sandbox's own HOME and PATH, which differ per case.
"""
script = "unset (\"HOME\"); unset (\"XDG_DATA_HOME\"); unset (\"XDG_CONFIG_HOME\"); unset (\"PATH\"); unset (\"ADASH_MESSAGE_CATALOG\"); set (\"ONE=1\"); set (\"TWO=2\"); env; unset (\"ONE\"); put_line (\"and after removing one:\"); env;\nquit (0);"
exit_status = 0
output = [
  "!line.variable{name=ONE,value=1}!",
  "!line.variable{name=TWO,value=2}!",
  "and after removing one:",
  "!line.variable{name=TWO,value=2}!",
]
diagnostics = []

[[case]]
id = "redirection.run_into-replaces-and-run_append-adds"
requirement = """
`run_into` writes a program's output to a file, replacing what was there;
`run_append` adds to the end. The pair is how a script collects what several
programs said, and the difference between them is the whole of why there are
two commands rather than one with a flag.
"""
script = "run_into (\"{store}/a.txt\", \"echo\", \"one\"); run_append (\"{store}/a.txt\", \"echo\", \"two\"); run_into (\"{store}/b.txt\", \"echo\", \"first\"); run_into (\"{store}/b.txt\", \"echo\", \"second\"); put_line (Output_Of (\"cat\", \"{store}/a.txt\")); put_line (\"and the replaced one holds: \" & Output_Of (\"cat\", \"{store}/b.txt\"));\nquit (0);"
exit_status = 0
output = ["one", "two", "and the replaced one holds: second"]
diagnostics = []
platforms = ["linux", "macos"]

[[case]]
id = "redirection.run_new-refuses-a-file-that-is-there"
requirement = """
`run_new` writes to a file that must not already exist, which is how a script
says it is producing something rather than replacing it. The second attempt
fails and says which path it would not open, and the failure is a status rather
than the end of the script.
"""
script = "run_new (\"{store}/b.txt\", \"echo\", \"x\"); put_line (\"first status\" & Status'Image); run_new (\"{store}/b.txt\", \"echo\", \"y\"); put_line (\"second status\" & Status'Image); put_line (\"and the file still holds: \" & Output_Of (\"cat\", \"{store}/b.txt\"));\nquit (0);"
exit_status = 0
output = [
  "first status 0",
  "second status 1",
  "and the file still holds: x",
]
diagnostics = ["!error.redirection_open_failed{path={store}/b.txt}!"]
platforms = ["linux", "macos"]

[[case]]
id = "redirection.run_from-feeds-a-program-its-input"
requirement = "`run_from` gives a program a file as its input, which is the other half of the redirection pair: a script that wrote something can hand it to the next program without a pipeline."
script = "write_file (\"hello from a file\", \"{store}/in.txt\"); run_from (\"{store}/in.txt\", \"cat\");\nquit (0);"
exit_status = 0
output = ["hello from a file"]
diagnostics = []
platforms = ["linux", "macos"]

[[case]]
id = "pipelines.two-stages-run-as-one"
requirement = """
`pipe` adds a stage and `pipe_run` runs what was built, so a pipeline is
assembled by statements rather than written as punctuation. What the last stage
prints is what the session sees.
"""
script = "pipe (\"echo\", \"hello\"); pipe (\"tr\", \"a-z\", \"A-Z\"); pipe_run;\nquit (0);"
exit_status = 0
output = ["HELLO"]
diagnostics = []
platforms = ["linux", "macos"]

[[case]]
id = "pipelines.and-the-status-is-the-last-stage-s"
requirement = "A pipeline reports what its last stage reported, which is the convention every shell follows and what a script testing a pipeline is asking about."
script = "pipe (\"echo\", \"a\"); pipe (\"false\"); pipe_run; put_line (\"status\" & Status'Image); pipe (\"echo\", \"b\"); pipe (\"true\"); pipe_run; put_line (\"and now\" & Status'Image);\nquit (0);"
exit_status = 0
output = ["status 1", "and now 0"]
diagnostics = []
platforms = ["linux", "macos"]

[[case]]
id = "settings.save_settings-writes-what-was-changed"
requirement = """
`save_settings` writes the current settings to the configuration file. What it
prints is the path it wrote, which differs per machine, so the case checks the
*file* instead and carries its assertion in the exit status: a script that
found the wrong content quits with 3, and a status of 0 is the assertion
passing.

What this does not show is a later session reading it back -- a case is one
process, and that is a unit test's question.
"""
script = "settings (\"history.limit\", \"42\"); save_settings; if Output_Of (\"grep\", \"-c\", \"limit = 42\", Env_Value (\"XDG_CONFIG_HOME\") & \"/adash/config.toml\") /= \"1\" then quit (3); end if;\nquit (0);"
exit_status = 0
platforms = ["linux", "macos"]
