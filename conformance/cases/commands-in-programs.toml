# Commands are calls in the language.
#
# Every case here was impossible before commands became callable: a submission
# was either internal commands or program statements, never both, and a
# command's arguments were the source text they were written with rather than
# values.
#
# Each script is one line, deliberately. Input on standard input is submitted a
# line at a time -- that is what an interactive session does, and the runner
# feeds these the same way -- so a declaration on one line is gone by the next.
# One line is one submission, and a submission is what these cases are about.

suite = "commands-in-programs"

[[case]]
id = "commands.compute-then-exit"
requirement = "A script can compute a value and exit with it. This is the most basic shell script there is, and it could not be written."
script = "Total : Integer := 0; for Index in 1 .. 4 loop Total := Total + Index; end loop; quit (Total);"
exit_status = 10
output = []
diagnostics = []

[[case]]
id = "commands.interleave-with-statements"
requirement = "Commands and statements run in the order written, and a declaration survives across a command."
script = "X : Integer := 1; Y : Integer := X + 1; quit (Y);"
exit_status = 2
output = []
diagnostics = []

[[case]]
id = "commands.inside-a-branch"
requirement = "A command may appear inside control flow. No design that ran commands beside the language rather than inside it can express this."
script = "N : Integer := 5; if N > 3 then quit (1); else quit (0); end if;"
exit_status = 1
diagnostics = []

[[case]]
id = "commands.argument-is-a-value"
requirement = "A command receives the value of its argument, not the text of it."
script = "N : Integer := 6; quit (N);"
exit_status = 6
diagnostics = []

[[case]]
id = "commands.wrong-type-is-refused"
requirement = "A command's arguments are type-checked before anything runs, rather than discovered by the command failing to convert them."
script = "quit (\"later\");"
exit_status = 0
output = []
diagnostics = [
  "!error.type_mismatch{found=String,expected=Integer}!",
]

[[case]]
id = "commands.quit-halts-the-program"
requirement = "quit stops the program there. Statements after it in the same submission do not run, which is what anybody writing quit means."
script = "quit (3); pwd;"
exit_status = 3
output = []
diagnostics = []

[[case]]
id = "commands.quit-halts-from-inside-a-loop"
requirement = "quit stops the program wherever it is reached, including from inside control flow."
script = "for Index in 1 .. 3 loop quit (4); end loop;"
exit_status = 4
output = []
diagnostics = []

[[case]]
id = "commands.failure-does-not-stop-the-sequence"
requirement = "A failing command reports and the program continues, as both Ada and a POSIX shell do. Failing is not halting: only a command that ends the session stops the program."
script = "cd (\"./nowhere-at-all\"); quit (0);"
exit_status = 0
diagnostics = [
  "!error.directory_not_found{path=./nowhere-at-all}!",
]

[[case]]
id = "commands.local-survives-a-command-inside-a-body"
requirement = """
A command called inside a subprogram leaves the body's own variables where they
were. The stub the call goes through is declared outermost, so returning from it
left the machine's display pointing at the frame that had just been popped --
the same fix-up a call to a subprogram declared further out has always had, and
the one this had not. A command written as the last statement of a body hid it,
because nothing read a local afterwards.
"""
script = "procedure P is N : Integer := 1; begin set (\"CASE_UNUSED=1\"); N := N + 1; put_line (N); end P; P; quit (0);"
exit_status = 0
output = [
  "2",
]
diagnostics = []

[[case]]
id = "commands.value-read-inside-a-body"
requirement = """
Env_Value answers the same inside a subprogram as outside one, at any depth, and
what the body declared around it is still there afterwards.
"""
script = "set (\"CASE_PROBE=inner\"); procedure Outer is procedure Inner is Y : String := Env_Value (\"CASE_PROBE\"); begin put_line (Y); end Inner; X : Integer := 5; begin Inner; put_line (X); end Outer; Outer; quit (0);"
exit_status = 0
output = [
  "inner",
  "5",
]
diagnostics = []

[[case]]
id = "help.entries-say-what-each-command-is-for"
requirement = """
`help` lists a command's name beside what that command is for. The summary was
an empty string for as long as `help` had existed, so the listing was a column
of names beside a column of nothing.

A command may not render -- it produces identifiers and typed arguments, and an
argument is text in its final form -- so the line names the message that says
what the command does and the frontend renders that one into this one. Both
halves appear as identifiers here, which is what shows that neither was turned
into text before it reached the boundary.

The whole listing is pinned rather than one line of it: a command added without
documentation is exactly the mistake this catches, and it can only catch it by
knowing what the complete list is.
"""
script = "help;"
exit_status = 0
output = [
  "!line.command_entry{name=cd,summary=!command.cd.doc!}!",
  "!line.command_entry{name=pwd,summary=!command.pwd.doc!}!",
  "!line.command_entry{name=quit,summary=!command.exit.doc!}!",
  "!line.command_entry{name=set,summary=!command.set.doc!}!",
  "!line.command_entry{name=unset,summary=!command.unset.doc!}!",
  "!line.command_entry{name=env,summary=!command.env.doc!}!",
  "!line.command_entry{name=jobs,summary=!command.jobs.doc!}!",
  "!line.command_entry{name=help,summary=!command.help.doc!}!",
  "!line.command_entry{name=version,summary=!command.version.doc!}!",
  "!line.command_entry{name=push_directory,summary=!command.push_directory.doc!}!",
  "!line.command_entry{name=pop_directory,summary=!command.pop_directory.doc!}!",
  "!line.command_entry{name=directories,summary=!command.directories.doc!}!",
  "!line.command_entry{name=history,summary=!command.history.doc!}!",
  "!line.command_entry{name=forget,summary=!command.forget.doc!}!",
  "!line.command_entry{name=source,summary=!command.source.doc!}!",
  "!line.command_entry{name=run,summary=!command.run.doc!}!",
  "!line.command_entry{name=run_matching,summary=!command.run_matching.doc!}!",
  "!line.command_entry{name=run_instead,summary=!command.run_instead.doc!}!",
  "!line.command_entry{name=redirect,summary=!command.redirect.doc!}!",
  "!line.command_entry{name=redirect_append,summary=!command.redirect_append.doc!}!",
  "!line.command_entry{name=redirect_back,summary=!command.redirect_back.doc!}!",
  "!line.command_entry{name=run_into,summary=!command.run_into.doc!}!",
  "!line.command_entry{name=run_from,summary=!command.run_from.doc!}!",
  "!line.command_entry{name=run_from_text,summary=!command.run_from_text.doc!}!",
  "!line.command_entry{name=run_with,summary=!command.run_with.doc!}!",
  "!line.command_entry{name=start_with,summary=!command.start_with.doc!}!",
  "!line.command_entry{name=time,summary=!command.time.doc!}!",
  "!line.command_entry{name=umask,summary=!command.umask.doc!}!",
  "!line.command_entry{name=resource_limit,summary=!command.resource_limit.doc!}!",
  "!line.command_entry{name=resource_ceiling,summary=!command.resource_ceiling.doc!}!",
  "!line.command_entry{name=complete_with,summary=!command.complete_with.doc!}!",
  "!line.command_entry{name=run_append,summary=!command.run_append.doc!}!",
