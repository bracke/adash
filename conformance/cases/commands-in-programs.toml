[[case]]
id = "scripts.a-shebang-line-is-not-a-statement"
requirement = """
A script is a file, and a file somebody made executable begins with the line
the host reads to decide what runs it. That line is not Ada, so without this a
script starting `#!/usr/bin/env adash` is a script whose first line is a syntax
error -- which is what stood between this shell and being used the way every
other shell's scripts are.

The line is blanked rather than removed, and its newline kept, so that every
byte after it stays where it was: a diagnostic still names the line the reader
is looking at. This case proves the first half; the second is proved by the
one below it, which puts a mistake on a known line and checks where the shell
says it is.

Only at the very start, and only `#!`. A `#` anywhere else in this language is
not a comment and is not treated as one.
"""
script = """
write_file ("#!/usr/bin/env adash" & Character'Val (10) & "put_line (To_Upper (\"\"ran\"\"));" & Character'Val (10), "{store}/shebang.adash");
run ("{shell}", "{store}/shebang.adash");
quit (0);"""
exit_status = 0
output = ["RAN"]
diagnostics = []

[[case]]
id = "scripts.a-shebang-does-not-move-what-follows-it"
requirement = """
The other half of blanking rather than removing. The mistake below is on line
three of the file, and the shell must say line three: dropping the shebang
would move every position after it and quietly misplace every message about
the file.
"""
script = """
write_file ("#!/usr/bin/env adash" & Character'Val (10) & "put_line (To_Upper (\"\"first\"\"));" & Character'Val (10) & "put_line (Nope);" & Character'Val (10), "{store}/moved.adash");
run ("{shell}", "{store}/moved.adash");
quit (0);"""
exit_status = 0
output = []
diagnostics = [
  "!line.diagnostic_at{path={store}/moved.adash,line=3,column=11,text=!error.name_undeclared{name=Nope}!}!",
  "put_line (Nope);",
  "          ^~~~",
]

[[case]]
id = "jobs.a-process-this-session-did-not-start-can-be-asked-to-stop"
requirement = """
`stop` takes a job: something this shell started and still knows about. A user
who wants to stop anything else -- a build left running in another window, a
program that has stopped answering -- has a process id and no job, and had
nothing to type.

A separate command rather than a second meaning for `stop`, because job 3 and
process 3 are both plausible and a shell that guessed between them would
eventually stop the wrong thing.

What is asserted here is the refusal, because it is the half that is the same
everywhere: a process id nothing answers to is reported by number, and the
reason is not guessed at -- the host does not say whether it has already gone
or was never ours to signal, and neither does this.
"""
script = "stop_process (2147483647); quit (0);"
exit_status = 0
output = []
diagnostics = ["!error.process_would_not_stop{process=2147483647}!"]

[[case]]
id = "scripts.an-interrupt-handler-does-not-run-when-nothing-interrupts"
requirement = """
`on_interrupt` registers what to run when the user interrupts, and a script
that is never interrupted must not run it. The interrupted case is asserted in
the terminal suite, where there is a terminal to type Ctrl-C at; what belongs
here is that registering one is not the same as running it, and that `on_exit`
still runs on the ordinary path.
"""
script = """
procedure Note is begin put_line (To_Upper ("interrupted")); end Note;
procedure Tidy is begin put_line (To_Upper ("tidied")); end Tidy;
on_interrupt ("Note");
on_exit ("Tidy");
put_line (To_Upper ("done"));
quit (0);"""
exit_status = 0
output = ["DONE", "TIDIED"]
diagnostics = []

[[case]]
id = "environment.a-child-inherits-what-set-set"
requirement = """
`set` says it sets a variable children will inherit, and for as long as the
command existed no child inherited one. The session kept its own block --
`env` listed it, `Env_Value` answered from it -- and every program the shell
started was given this process's environment instead, so a script that set a
variable and ran a program that reads it saw nothing and had no way to find out
why.

Asked of the child rather than of the shell, because the shell's answer was
never the one in doubt. `unset` is here for the same reason: a variable removed
from a listing the child never had is not removed from anything.
"""
script = """
set ("CASE_SEEN=through");
run ("{emit}", "--env=CASE_SEEN");
unset ("CASE_SEEN");
run ("{emit}", "--env=CASE_SEEN");
quit (0);"""
exit_status = 0
output = ["[through]", "[]"]
diagnostics = []

[[case]]
id = "environment.run_with-sets-one-variable-for-one-program"
requirement = """
`LC_ALL=C sort` is the shape every shell has. Without it a script that wanted
one variable for one program had to set it in the session, run, and unset it --
and get that right on the path where the program failed, which is the path
nobody writes.

The assignment comes first, spelled the way `set` spells one, because what
follows is the program and its arguments and there is no other place to put a
boundary between them. It is one assignment: a rule that read assignments until
an argument without an `=` in it would be a rule with an exception waiting for
the first program whose path has one.

What it does *not* do is take anything away. The child gets the session's
variables with this one over the top, because a program run with `LC_ALL=C`
still needs its PATH.
"""
script = """
set ("CASE_KEPT=session");
run_with ("CASE_ONCE=only-here", "{emit}", "--env=CASE_ONCE", "--env=CASE_KEPT");
run ("{emit}", "--env=CASE_ONCE");
quit (0);"""
exit_status = 0
output = ["[only-here]", "[session]", "[]"]
diagnostics = []

[[case]]
id = "environment.run_with-refuses-what-is-not-an-assignment"
requirement = """
The same refusal `set` makes, in the same words: a command given `LC_ALL` where
it wanted `LC_ALL=C` cannot know whether the user meant to set it empty or to
remove it, and a program run without the variable it was supposed to have is a
failure nobody sees until later.
"""
script = "run_with (\"CASE_NO_EQUALS\", \"{emit}\", \"never\"); quit (0);"
exit_status = 0
output = []
diagnostics = ["!error.command.bad_assignment{text=CASE_NO_EQUALS}!"]

[[case]]
id = "environment.env-lists-what-children-inherit-and-unset-removes-one"
requirement = """
`env` lists the variables a child would be given, and `unset` takes one away.
Written together because neither can be observed without the other: what `set`
did is only visible through `env`, and what `unset` did is only visible as an
absence from the same list.

The case clears what the runner itself put in the environment first, so what
`env` prints is exactly what the script asked for -- otherwise it would list
the sandbox's own HOME and PATH, which differ per case.

It clears what the host puts there as well. macOS gives every process
`__CF_USER_TEXT_ENCODING`; Windows needs `SystemRoot` and a `PATH` naming
System32 to be a process at all, and the runner hands it `TEMP`, `APPDATA` and
`USERPROFILE` pointing at the case's own store, the way the XDG variables are
handed to the other two. A case that asserts a *complete* listing has to clear
every one of them. Unsetting a variable that is not there is not an error, so
the same script says the same thing everywhere.
"""
script = "unset (\"HOME\"); unset (\"XDG_DATA_HOME\"); unset (\"XDG_CONFIG_HOME\"); unset (\"PATH\"); unset (\"ADASH_MESSAGE_CATALOG\"); unset (\"__CF_USER_TEXT_ENCODING\"); unset (\"SystemRoot\"); unset (\"windir\"); unset (\"TEMP\"); unset (\"TMP\"); unset (\"APPDATA\"); unset (\"USERPROFILE\"); set (\"ONE=1\"); set (\"TWO=2\"); env; unset (\"ONE\"); put_line (\"and after removing one:\"); env;\nquit (0);"
exit_status = 0
output = [
  "!line.variable{name=ONE,value=1}!",
  "!line.variable{name=TWO,value=2}!",
  "and after removing one:",
  "!line.variable{name=TWO,value=2}!",
]
diagnostics = []

[[case]]
id = "redirection.run_into-replaces-and-run_append-adds"
requirement = """
`run_into` writes a program's output to a file, replacing what was there;
`run_append` adds to the end. The pair is how a script collects what several
programs said, and the difference between them is the whole of why there are
two commands rather than one with a flag.
"""
script = "run_into (\"{store}/a.txt\", \"{emit}\", \"one\"); run_append (\"{store}/a.txt\", \"{emit}\", \"two\"); run_into (\"{store}/b.txt\", \"{emit}\", \"first\"); run_into (\"{store}/b.txt\", \"{emit}\", \"second\"); run_from (\"{store}/a.txt\", \"{upcase}\"); run_from (\"{store}/b.txt\", \"{upcase}\");\nquit (0);"
exit_status = 0
output = ["ONE", "TWO", "SECOND"]
diagnostics = []

[[case]]
id = "redirection.run_new-refuses-a-file-that-is-there"
requirement = """
`run_new` writes to a file that must not already exist, which is how a script
says it is producing something rather than replacing it. The second attempt
fails and says which path it would not open, and the failure is a status rather
than the end of the script.
"""
script = "run_new (\"{store}/b.txt\", \"{emit}\", \"x\"); put_line (\"first status\" & Status'Image); run_new (\"{store}/b.txt\", \"{emit}\", \"y\"); put_line (\"second status\" & Status'Image); run_from (\"{store}/b.txt\", \"{upcase}\");\nquit (0);"
exit_status = 0
output = [
  "first status 0",
  "second status 1",
  "X",
]
diagnostics = ["!error.redirection_open_failed{path={store}/b.txt}!"]

[[case]]
id = "redirection.run_from-feeds-a-program-its-input"
requirement = "`run_from` gives a program a file as its input, which is the other half of the redirection pair: a script that wrote something can hand it to the next program without a pipeline."
script = "write_file (\"hello from a file\", \"{store}/in.txt\"); run_from (\"{store}/in.txt\", \"{upcase}\");\nquit (0);"
exit_status = 0
output = ["HELLO FROM A FILE"]
diagnostics = []

[[case]]
id = "pipelines.two-stages-run-as-one"
requirement = """
`pipe` adds a stage and `pipe_run` runs what was built, so a pipeline is
assembled by statements rather than written as punctuation. What the last stage
prints is what the session sees.
"""
script = "pipe (\"{emit}\", \"hello\"); pipe (\"{upcase}\"); pipe_run;\nquit (0);"
exit_status = 0
output = ["HELLO"]
diagnostics = []

[[case]]
id = "pipelines.and-the-status-is-the-last-stage-s"
requirement = "A pipeline reports what its last stage reported, which is the convention every shell follows and what a script testing a pipeline is asking about."
script = "pipe (\"{emit}\", \"a\"); pipe (\"{emit}\", \"--exit=1\"); pipe_run; put_line (\"status\" & Status'Image); pipe (\"{emit}\", \"b\"); pipe (\"{emit}\"); pipe_run; put_line (\"and now\" & Status'Image);\nquit (0);"
exit_status = 0
output = ["status 1", "and now 0"]
diagnostics = []

[[case]]
id = "settings.save_settings-writes-what-was-changed"
requirement = """
`save_settings` writes the current settings to the configuration file. What it
prints is the path it wrote, which differs per machine, so the case checks the
*file* instead and carries its assertion in the exit status: a script that
found the wrong content quits with 3, and a status of 0 is the assertion
passing.

Where that file is differs per *host*, not only per machine, and the case has
to know all three: `$XDG_CONFIG_HOME/adash` on Linux, `$HOME/Library/
Application Support/adash` on macOS, `%APPDATA%/adash` on Windows. That is
hostkit's answer rather than this shell's, and the case reads whichever of the
three exists -- it asserts that the setting was written *somewhere the shell
will read it back*, which is the promise, and not that a Linux path exists on
every host. It failed on macOS the first time it ran there for exactly that
reason.

What this does not show is a later session reading it back -- a case is one
process, and that is a unit test's question.
"""
script = "settings (\"history.limit\", \"42\"); save_settings; Xdg : String := Output_Of (\"{emit}\", \"--file=\" & Env_Value (\"XDG_CONFIG_HOME\") & \"/adash/config.toml\"); Mac : String := Output_Of (\"{emit}\", \"--file=\" & Env_Value (\"HOME\") & \"/Library/Application Support/adash/config.toml\"); Win : String := Output_Of (\"{emit}\", \"--file=\" & Env_Value (\"APPDATA\") & \"/adash/config.toml\"); if Index (Xdg, \"limit = 42\") = 0 and then Index (Mac, \"limit = 42\") = 0 and then Index (Win, \"limit = 42\") = 0 then quit (3); end if;\nquit (0);"
exit_status = 0

[[case]]
id = "commands.a-submission-mixes-commands-and-statements"
requirement = """
A command is an entity a program can call, so a submission holding both is one
program rather than two things dispatched separately: the command runs where it
is written, the declaration around it stands, and what the command changed is
visible to the statements after it. The engine's own documentation said this
was refused long after it stopped being; a case is what keeps a sentence like
that honest.
"""
script = "put_line (\"before\"); cd (\"{store}\"); X : Integer := 1; write_file (\"moved\", \"proof.txt\"); put_line (X'Image);\nput_line (Output_Of (\"{emit}\", \"--file={store}/proof.txt\"));\nquit (0);"
exit_status = 0
output = ["before", " 1", "moved"]
diagnostics = []

[[case]]
id = "resources.a-limit-is-set-and-read-back"
requirement = """
`resource_limit` sets what the host enforces and `resource_ceiling` sets how
far that may be raised; reading shows both, because somebody asking what a
limit is wants to know how far it could go.

The numbers a host starts with are the runner's business, so this sets both
before reading either -- and sets the limit before the ceiling, since a host
refuses a ceiling below the limit already in force.

Two hosts, because Windows has no per-process limits at all; the case below
asserts what it does instead.
"""
script = "resource_limit (\"open_files\", \"256\"); resource_ceiling (\"open_files\", \"300\"); resource_limit (\"open_files\");\nquit (0);"
exit_status = 0
output = [
  "!line.limit{resource=open_files,value=256}!",
  "!line.limit_ceiling{resource=open_files,value=300}!",
]
diagnostics = []
platforms = ["linux", "macos"]

[[case]]
id = "resources.unlimited-is-a-value"
requirement = """
`unlimited` is what a user types for a limit with nothing behind it, and what
the shell reports for one. A host spells infinity its own way -- every bit on
Linux, every bit but the sign on macOS -- and neither number reaches a script:
it would be printed as a limit, and a script comparing against it would be
comparing against a host detail.

How large a file may be written is unlimited on both of these hosts to begin
with, so setting it so asks nothing of the runner and the case still exercises
both spellings.
"""
script = "resource_ceiling (\"file_size\", \"unlimited\"); resource_limit (\"file_size\", \"unlimited\"); resource_limit (\"file_size\");\nquit (0);"
exit_status = 0
output = [
  "!line.limit_unbounded{resource=file_size}!",
  "!line.limit_ceiling_unbounded{resource=file_size}!",
]
diagnostics = []
platforms = ["linux", "macos"]

[[case]]
id = "resources.a-word-that-names-no-limit-is-refused"
requirement = """
A resource name that names nothing is refused where it stands, on every host --
the name is checked before the host is asked, so a user who mistyped one hears
about the typing rather than about the platform.

The names are the ones `resource_limit` lists with no argument, which is where
somebody who spelled one the way another shell spells it will look.
"""
script = "resource_limit (\"open_flies\");\nquit (0);"
exit_status = 0
output = []
diagnostics = ["!error.unknown_resource{resource=open_flies}!"]

[[case]]
id = "resources.a-limit-that-is-not-a-number-is-refused"
requirement = """
A limit is digits or the word `unlimited`. Sizes here are bytes rather than the
kilobytes some shells count in, so a value read wrongly would be wrong by a
factor of a thousand rather than obviously wrong -- and a limit somebody meant
to raise and instead lowered is a script that fails somewhere else entirely.
"""
script = "resource_limit (\"open_files\", \"many\");\nquit (0);"
exit_status = 0
output = []
diagnostics = ["!error.limit_not_a_number{text=many}!"]
platforms = ["linux", "macos"]

[[case]]
id = "resources.a-host-without-limits-says-so"
requirement = """
Windows has no per-process resource limits. What it has is a job object, which
is attached to a set of processes rather than inherited by them and which a
process cannot lower on itself -- a different thing, and reporting one as the
other would hand a script a number it could not act on.

So the shell says the host has none, rather than printing an empty list a
script could not tell from a host whose limits were all unset.
"""
script = "resource_limit ();\nquit (0);"
exit_status = 0
output = []
diagnostics = ["!error.no_resource_limits!"]
platforms = ["windows"]

[[case]]
id = "resources.a-ceiling-below-the-limit-is-refused"
requirement = """
A ceiling below the limit already in force is not a thing a host will hold, and
this reports the refusal rather than reporting success and leaving the limit
where it was.

Which refusal it was is not told apart. A host refuses a ceiling below the
limit, a raised ceiling without privilege, and a resource it will not move, and
the three hosts do not agree on how they say which -- so the shell names the
resource and leaves the limit to be read back.
"""
script = "resource_limit (\"open_files\", \"300\"); resource_ceiling (\"open_files\", \"100\");\nquit (0);"
exit_status = 0
output = []
diagnostics = ["!error.limit_refused{resource=open_files}!"]
platforms = ["linux", "macos"]

[[case]]
id = "matching.a-pattern-becomes-the-paths-it-names"
requirement = """
`run_matching` expands the arguments that hold a pattern into the paths they
name, sorted, and passes every other argument along untouched. That is what
every other shell does to `*.log` before a program sees it, done where a script
can see it happen and only where a script asked for it.

Sorted rather than in the order the host reads a directory, so that two runs of
the same script hand a program the same argument list.
"""
script = "cd (\"{store}\"); write_file (\"one\", \"b.log\"); write_file (\"two\", \"a.log\"); write_file (\"three\", \"c.txt\");\nrun_matching (\"{emit}\", \"kept\", \"*.log\");\nquit (0);"
exit_status = 0
output = ["kept", "a.log", "b.log"]
diagnostics = []

[[case]]
id = "matching.run-passes-a-pattern-along-untouched"
requirement = """
The other half of the same rule, and the reason the expanding form is a command
of its own: `run` hands a program exactly what it was written with. An argument
is a string literal in this language, and a shell that quietly turned one into
several would be a shell whose quoting rules somebody has to learn before they
can name a file with a star in it.

What the program does with it afterwards is the program's business, and on
Windows that is not nothing: a program built with the usual C runtime expands
the wildcards in its own argument list before `main` runs. So this asserts what
the shell hands over on the two hosts where the argument list a program receives
is the one it was given, and the case below asserts what the third host does
with the same script. The shell behaves identically on all three; only the
program differs.
"""
script = "cd (\"{store}\"); write_file (\"one\", \"kept.log\");\nrun (\"{emit}\", \"*.log\");\nquit (0);"
exit_status = 0
output = ["*.log"]
diagnostics = []
platforms = ["linux", "macos"]

[[case]]
id = "matching.a-windows-program-expands-for-itself"
requirement = """
The same script on Windows, where the program receives `kept.log` although the
shell handed it `*.log`.

Nothing in the shell did that. A program built with the usual Windows C runtime
expands the wildcards in its own argument list before `main` runs, which is a
fact about programs on that host rather than about this shell -- and it is worth
a case because a script written against the other two hosts will behave
differently here through no act of the shell's. `run_matching` is unaffected:
what it hands over has already been expanded, and there is nothing left in it
for a runtime to find.
"""
script = "cd (\"{store}\"); write_file (\"one\", \"kept.log\");\nrun (\"{emit}\", \"*.log\");\nquit (0);"
exit_status = 0
output = ["kept.log"]
diagnostics = []
platforms = ["windows"]

[[case]]
id = "matching.a-pattern-that-names-nothing-refuses"
requirement = """
A pattern naming nothing refuses the command rather than passing the pattern on
as a word. Passing it on is what sh does, and it is how `rm *.log` in a
directory with no logs becomes a program asked to remove a file called `*.log`.

A shell that expands on purpose can afford to say so instead, and the program is
not started.
"""
script = "cd (\"{store}\");\nrun_matching (\"{emit}\", \"nothing*here\");\nquit (0);"
exit_status = 0
output = []
diagnostics = ["!error.no_matching_files{pattern=nothing*here}!"]

[[case]]
id = "matching.a-dot-file-answers-only-a-dotted-pattern"
requirement = """
`*` does not name a file whose name begins with a dot, and a pattern that begins
with one does. Every shell has this rule, and the reason is that `*` is not how
anybody asks to see `.git`.
"""
script = "cd (\"{store}\"); write_file (\"seen\", \"visible.txt\"); write_file (\"hidden\", \".secret.txt\");\nrun_matching (\"{emit}\", \"*.txt\");\nrun_matching (\"{emit}\", \".*.txt\");\nquit (0);"
exit_status = 0
output = ["visible.txt", ".secret.txt"]
diagnostics = []

[[case]]
id = "matching.a-script-can-count-and-walk-the-matches"
requirement = """
The same expansion as a question, for a script that wants the paths rather than
a program run over them: `Match_Count` says how many, `Match_At` walks them in
the order the count came from.

A pattern with a directory keeps it, so what comes back can be handed to a
program or opened as it is.
"""
script = "cd (\"{store}\"); make_directory (\"logs\"); write_file (\"one\", \"logs/b.log\"); write_file (\"two\", \"logs/a.log\");\nput_line (Trim (Match_Count (\"logs/*.log\")'Image)); for I in 1 .. Match_Count (\"logs/*.log\") loop put_line (Match_At (\"logs/*.log\", I)); end loop;\nquit (0);"
exit_status = 0
output = ["2", "logs/a.log", "logs/b.log"]
diagnostics = []

[[case]]
id = "matching.a-name-with-no-pattern-in-it-names-nothing"
requirement = """
`Match_Count` answers zero for text holding no `*`, `?` or `[`, even when a file
of that name is there. It is an expansion rather than a lookup, and `Exists` is
how a script asks about one name.

This is the rule `run_matching` reads its arguments by: what holds a pattern is
expanded, and everything else is passed along -- so a flag is never a pattern
that named nothing.
"""
script = "cd (\"{store}\"); write_file (\"here\", \"plain.txt\");\nput_line (Trim (Match_Count (\"plain.txt\")'Image)); put_line (Exists (\"plain.txt\")'Image);\nquit (0);"
exit_status = 0
output = ["0", "TRUE"]
diagnostics = []

[[case]]
id = "signals.a-word-that-names-no-signal-is-refused"
requirement = """
The names are the host's own in lower case, and one that names nothing is
refused where it stands. A shell that accepted an unknown name would be a shell
with a handler that never runs and nothing to say about why.
"""
script = "on_signal (\"nosuchsignal\", \"Anything\");\nquit (0);"
exit_status = 0
output = []
diagnostics = ["!error.unknown_signal{signal=nosuchsignal}!"]

[[case]]
id = "signals.kill-and-stop-cannot-be-caught"
requirement = """
Two signals no process may catch, on any host: a process that could catch them
could not be ended, which is why POSIX makes them unconditional. Refused when
they are asked for rather than accepted and quietly never run.
"""
script = "on_signal (\"kill\", \"Anything\");\non_signal (\"stop\", \"Anything\");\nquit (0);"
exit_status = 0
output = []
diagnostics = [
  "!error.signal_not_catchable{signal=kill}!",
  "!error.signal_not_catchable{signal=stop}!",
]

[[case]]
id = "signals.a-process-that-is-not-there-is-reported"
requirement = """
Sending to a process that does not exist is refused with the process named. The
host does not say whether it is gone or whether it was never this user's to
signal, and neither does this: guessing between the two would be a claim.

The number is far above what any host hands out, so nothing is signalled by
accident on a machine running the suite.
"""
script = "signal_process (999999999, \"terminate\");\nquit (0);"
exit_status = 0
output = []
diagnostics = ["!error.signal_refused{signal=terminate,process=999999999}!"]
platforms = ["linux", "macos"]

[[case]]
id = "signals.a-host-without-them-says-so"
requirement = """
Windows has no signals in this sense. A console can report an interrupt and
nothing else, so `on_signal ("terminate", ...)` is refused there rather than
accepted and never run -- a shell saying what it cannot do.

The unit suite asserts the other half on the hosts that have signals: a
`terminate` sent to a running shell reaches the subprogram registered for it.
"""
script = "on_signal (\"terminate\", \"Anything\");\nquit (0);"
exit_status = 0
output = []
diagnostics = ["!error.signal_not_catchable{signal=terminate}!"]
platforms = ["windows"]

[[case]]
id = "matching.a-pattern-walks-a-tree-when-it-is-asked-to"
requirement = """
`**` stands for any run of directories, including none, so `logs/**/*.log` finds
what is directly in `logs` as well as what is under it. One pattern rather than
two, because a user who has to write both has to remember which of them found
what.

Every other segment is matched too: `*/name` means what it says. A walk never
goes through a symbolic link -- a link pointing at its own parent is a walk with
no end -- and never deeper than sixty-four levels.
"""
script = "cd (\"{store}\"); make_directory (\"logs/inner\"); write_file (\"a\", \"logs/one.log\"); write_file (\"b\", \"logs/inner/two.log\"); write_file (\"c\", \"logs/inner/three.txt\");\nfor I in 1 .. Match_Count (\"logs/**/*.log\") loop put_line (Match_At (\"logs/**/*.log\", I)); end loop;\nquit (0);"
exit_status = 0
output = ["logs/inner/two.log", "logs/one.log"]
diagnostics = []

[[case]]
id = "matching.a-star-does-not-cross-a-directory"
requirement = """
A single `*` matches within one segment and stops at the separator, which is the
rule everywhere else and the reason `**` had to be spelled differently: a star
that quietly crossed directories would make `logs/*.log` mean something else on
the day somebody made a subdirectory.
"""
script = "cd (\"{store}\"); make_directory (\"tree/under\"); write_file (\"a\", \"tree/top.log\"); write_file (\"b\", \"tree/under/deep.log\");\nfor I in 1 .. Match_Count (\"tree/*.log\") loop put_line (Match_At (\"tree/*.log\", I)); end loop;\nquit (0);"
exit_status = 0
output = ["tree/top.log"]
diagnostics = []

[[case]]
id = "paths.a-tilde-is-this-users-home"
requirement = """
A leading `~` is this user's home directory wherever the shell resolves a path.
Asked of the host rather than read from HOME, which a spawned process can set to
anything -- so this compares what the shell resolves against what the host says
its home is, rather than against a name a test could have set itself.
"""
script = "put_line (Is_Directory (\"~\")'Image);\nquit (0);"
exit_status = 0
output = ["TRUE"]
diagnostics = []

[[case]]
id = "paths.a-user-nobody-has-stays-as-it-was"
requirement = """
`~other` is somebody else's home, which the host's user database answers and
nothing else can. A name the host does not know is left exactly as written: a
path that meant itself survives, and one that meant a user fails as a path that
is not there rather than as the wrong directory.

Which is also what happens on a host that answers about no account at all --
Windows, where a profile folder belongs to whoever is logged in.
"""
script = "put_line (Exists (\"~adash-no-such-account-anywhere\")'Image);\nquit (0);"
exit_status = 0
output = ["FALSE"]
diagnostics = []

[[case]]
id = "paths.cd-goes-back-to-where-it-was"
requirement = """
`cd ("-")` goes back to where the last `cd` came from, which is what the dash
means in every other shell -- and twice in a row returns to where it started,
because going back is itself a move.

A directory actually named `-` is reachable as `./-`, which is how the other
shells reach it too.
"""
script = "cd (\"{store}\"); Started : String := Current_Directory; cd (\"{root}\"); cd (\"-\"); put_line (Current_Directory = Started); cd (\"-\"); put_line (Current_Directory = Started);\nquit (0);"
exit_status = 0
output = ["TRUE", "FALSE"]
diagnostics = []

[[case]]
id = "paths.going-back-with-nowhere-to-go-is-refused"
requirement = """
A session that has not moved has nowhere to go back to, and says so. Treating it
as the home directory -- which is what a shell that guessed would do -- would
take somebody somewhere they had never been and call it going back.
"""
script = "cd (\"-\");\nquit (0);"
exit_status = 0
output = []
diagnostics = ["!error.no_previous_directory!"]

[[case]]
id = "paths.previous-directory-is-a-question-a-script-can-ask"
requirement = """
The same value as a question, for a script that wants to remember where it was
rather than go there: `Previous_Directory` is what `cd ("-")` would use, and is
empty in a session that has not moved.
"""
script = "put_line (\"[\" & Previous_Directory & \"]\"); cd (\"{store}\"); Left : String := Current_Directory; cd (\"{root}\"); put_line (Previous_Directory = Left);\nquit (0);"
exit_status = 0
output = ["[]", "TRUE"]
diagnostics = []

[[case]]
id = "jobs.a-job-has-a-process-id"
requirement = """
A job this session started has a process id, which is what a script needs to
hand a number to another program -- or to `signal_process`, which until now
could be aimed at every process on the machine except the ones this shell had
started itself.

Zero for a job nobody has. Answering with somebody else's process id is the one
wrong thing this could do, so a question about a job that is not there has no
answer rather than a plausible one.

The job is waited for rather than stopped, though stopping it was the obvious
way to write this: Windows has no job control, so `stop` there reports that the
host cannot and the job runs to completion -- and a case about process ids has
no business asserting which of those happened.
"""
script = "start (\"{emit}\", \"--sleep=1\"); Id : Integer := Last_Job; put_line (Job_Process (Id) > 0); put_line (Job_Process (9999) = 0); wait (Id);\nquit (0);"
exit_status = 0
output = [
  "!line.job_started{id=1,what={emit} --sleep=1}!",
  "TRUE",
  "TRUE",
  "!line.job_finished{id=1,status=0}!",
]
diagnostics = []

[[case]]
id = "matching.braces-say-what-strings-to-make"
requirement = """
`{lib,test}` is two strings and `{1..4}` counts, and two groups multiply. This
touches no filesystem and refuses nothing for not existing: braces say what
strings to make, and whether anything is called that is a separate question,
asked afterwards by whatever wanted the names.

Left to right, leftmost varying slowest -- the order every other shell produces
and the one a reader expects when they see the result.
"""
script = "for I in 1 .. Braces_Count (\"{a,b}{1,2}\") loop put (Braces_At (\"{a,b}{1,2}\", I) & \" \"); end loop; put_line (\"\");\nfor I in 1 .. Braces_Count (\"v{1..3}\") loop put (Braces_At (\"v{1..3}\", I) & \" \"); end loop; put_line (\"\");\nquit (0);"
exit_status = 0
output = ["a1 a2 b1 b2 ", "v1 v2 v3 "]
diagnostics = []

[[case]]
id = "matching.a-group-that-says-nothing-is-text"
requirement = """
A group with neither a comma nor a range in it says nothing, and stays as it was
written -- `{a}` is `{a}`, which is what somebody who typed one and meant one
gets. Text with no group at all stands for itself, so a caller never has to ask
whether there was a group before using what comes back.
"""
script = "put_line (Braces_At (\"{a}\", 1) & \" \" & Trim (Braces_Count (\"{a}\")'Image)); put_line (Braces_At (\"plain\", 1) & \" \" & Trim (Braces_Count (\"plain\")'Image));\nquit (0);"
exit_status = 0
output = ["{a} 1", "plain 1"]
diagnostics = []

[[case]]
id = "matching.run_matching-makes-the-strings-braces-name"
requirement = """
The expanding form of `run` expands braces before patterns: `{lib,test}` says
what words to make, and each of them is then a word that may or may not hold a
pattern. Doing it the other way round would ask the filesystem about a name
nobody had finished writing.

Braces name strings rather than files, so a word made this way is passed along
whether or not anything is called that -- which is the difference between them
and a pattern, and the reason `run_matching ("mkdir", "-p", "src/{lib,test}")`
works at all.
"""
script = "cd (\"{store}\");\nrun_matching (\"{emit}\", \"src/{lib,test}\");\nquit (0);"
exit_status = 0
output = ["src/lib", "src/test"]
diagnostics = []

[[case]]
id = "failure.stop-on-failure-ends-the-submission"
requirement = """
`stop.on-failure` is what `set -e` is elsewhere: a submission stops at the first
command that fails, and the shell reports that failure rather than success. A
script run under it that failed half way and then exited 0 would be worse than
one that carried on -- the carrying on is visible, and the zero is what a build
system believes.

Off by default, because a shell that stopped on the first failure would break
every script written against this one.

What it stops is the submission, which is why this case has no `quit` after it:
a `quit (0)` on the next line would run as its own submission and hand back the
zero the setting exists to prevent. In a script file the whole text is one
submission, so a stopped script stops.

A command whose failure a script means to inspect must therefore not run under
this -- the same trap `set -e` has, and the reason it is a setting somebody
turns on rather than the way the shell works.
"""
script = "settings (\"stop.on-failure\", \"true\"); put_line (To_Upper (\"first\")); run (\"{emit}\", \"--exit=3\"); put_line (To_Upper (\"never\"));"
exit_status = 3
output = [
  "!line.setting{key=stop.on-failure,value=true,summary=!setting.stop-on-failure!}!",
  "FIRST",
]
diagnostics = []

[[case]]
id = "failure.a-failure-carries-on-by-default"
requirement = """
The other half: with the setting off, which is how the shell comes, a failing
command is a status and the next statement runs. This is asserted beside the
case above so that neither can be changed without the other being seen.
"""
script = "put_line (To_Upper (\"first\")); run (\"{emit}\", \"--exit=3\"); put_line (To_Upper (\"second\"));\nquit (0);"
exit_status = 0
output = ["FIRST", "SECOND"]
diagnostics = []

[[case]]
id = "exec.a-host-without-the-call-says-so"
requirement = """
Windows has no call that replaces a running image. What it has -- CreateProcess
-- makes a *new* process, so anything built on it changes the process id and
leaves the original waiting or gone, which is precisely what a caller reaching
for `run_instead` is trying to avoid.

So it refuses there and names the capability, rather than emulating something
that would look right from the outside and be wrong in every way that matters.
The other two hosts are covered by the unit suite, which starts a shell, has it
become another program, and finds the same process id running it.
"""
script = "run_instead (\"{emit}\");\nquit (0);"
exit_status = 0
output = []
diagnostics = ["!error.capability_unavailable{capability=BECOMING_A_PROGRAM}!"]
platforms = ["windows"]

[[case]]
id = "exec.a-program-that-is-not-there-is-refused"
requirement = """
A program this host cannot find is refused before anything is replaced. The
order matters twice over: a shell that had already given up its image and then
discovered the program was missing would have nothing left to report it with,
and a host that cannot do this at all still judges the argument first -- a
mistyped name is a mistyped name everywhere, and answering it with "this
platform cannot" sends somebody looking in the wrong place.
"""
script = "run_instead (\"adash-no-such-program-anywhere\");\nquit (0);"
exit_status = 0
output = []
diagnostics = ["!error.command_not_found{command=adash-no-such-program-anywhere}!"]

[[case]]
id = "redirection.the-session-can-send-its-own-output-to-a-file"
requirement = """
`redirect` is the other half of what `exec` does elsewhere: it moves the shell's
own stream rather than replacing the shell. `redirect_back` puts it where it was,
which is why `redirect` saved it -- once a file is assigned over standard output,
nothing in the process remembers where it used to point.

Asserted by looking for the text in the file rather than by matching the file
line for line: what a `put_line` leaves at the end of a file is a host's line
ending, and this case is not about those.

On every host. It was two for a while: Windows moves a stream with SetStdHandle,
which changes what a new reader of the standard handles finds and leaves this
program's own writes where they were, so the shell's line came out on the
console with the file empty. hostkit moves the runtime descriptor there as well
now, and this holds everywhere.
"""
script = "cd (\"{store}\"); redirect (\"both\", \"session.log\"); put_line (To_Upper (\"the shell\")); redirect_back (\"both\"); put_line (Index (Read_File (\"session.log\"), \"THE SHELL\") > 0);\nquit (0);"
exit_status = 0
output = ["TRUE"]
diagnostics = []

[[case]]
id = "redirection.a-program-writes-where-the-session-was-sent"
requirement = """
What the programs a redirected shell starts write goes where the shell's own
output goes, because it is the process's stream that moved -- which is the
difference between this and `run_into`, and the reason one line at the top of a
script can log everything it does.

On every host, for the reason the case above gives.
"""
script = "cd (\"{store}\"); redirect (\"output\", \"program.log\"); run (\"{emit}\", \"the program\"); redirect_back (\"output\"); put_line (Index (Read_File (\"program.log\"), \"the program\") > 0);\nquit (0);"
exit_status = 0
output = ["TRUE"]
diagnostics = []

[[case]]
id = "redirection.a-stream-nobody-has-is-refused"
requirement = """
The streams are named rather than numbered -- `output`, `errors`, `both` -- and
a word that names none of them is refused where it stands. Numbers are a
convention this shell has never used, and a shell that accepted `2` here would
have to decide what `3` meant.

On every host, because what the caller wrote is judged before what the host can
do. The first version of this asked the host first, and on Windows a mistyped
stream name came back as "this platform cannot" -- which sends somebody looking
in the wrong place for a mistake that is in their own line.
"""
script = "redirect (\"stdout\", \"nowhere.log\");\nquit (0);"
exit_status = 0
output = []
diagnostics = ["!error.unknown_stream{stream=stdout}!"]

[[case]]
id = "redirection.putting-back-what-was-never-moved-is-refused"
requirement = """
`redirect_back` for a stream that was never moved is said rather than quietly
done: a script that thinks it restored something is a script whose next output
goes somewhere it did not expect.

On every host, now that every host can move a stream.
"""
script = "redirect_back (\"output\");\nquit (0);"
exit_status = 0
output = []
diagnostics = ["!error.stream_not_redirected{stream=output}!"]

[[case]]
id = "text.columns-without-a-format-string"
requirement = """
What a format string does elsewhere, done as calls: alignment, padding and
decimal places. A format string is a second language inside the first -- its own
escapes, its own type letters, its own rules for when the letter and the value
disagree -- and this shell has one language.

Text already longer than the width comes back whole rather than cut: a formatter
that shortened a name to keep a column straight would lose the thing the line was
written for.
"""
script = "put_line (\"[\" & Left_Aligned (\"name\", 8) & \"|\" & Right_Aligned (\"7\", 4) & \"]\"); put_line (Zero_Padded (\"7\", 3) & \" \" & Zero_Padded (\"12345\", 3)); put_line (Decimals (3.14159, 2) & \" \" & Decimals (2.0, 0) & \" [\" & Decimals (1.0, 99) & \"]\");\nquit (0);"
exit_status = 0
output = ["[name    |   7]", "007 12345", "3.14 2 []"]
diagnostics = []


[[case]]
id = "paths.directories-are-set-aside-and-come-back"
requirement = """
`push_directory` goes somewhere and remembers where it was; `pop_directory`
goes back to the most recent of those and forgets it; `directories` lists what
is waiting, most recent first. They nest, which is what one previous directory
cannot do -- and is why a script walking a tree wants them.

A `pop_directory` with nothing set aside is refused rather than treated as the
home directory: a script that thought it had gone back would do the rest of its
work in the wrong place.

Asserted by where the shell ends up rather than by what `directories` prints. A
path is spelled the way its host spells it -- this case had a forward slash in
it and Windows answered with a backslash -- and where a script ends up is what
the commands are for.
"""
script = "cd (\"{store}\"); make_directory (\"one/two\"); Started : String := Current_Directory; push_directory (\"one\"); push_directory (\"two\"); put_line (Current_Directory = Started); pop_directory; pop_directory; put_line (Current_Directory = Started);\npop_directory;\nquit (0);"
exit_status = 0
output = ["FALSE", "TRUE"]
diagnostics = ["!error.no_directory_set_aside!"]

[[case]]
id = "failure.a-handler-hears-about-a-failure"
requirement = """
`on_failure` is what `trap ... ERR` is elsewhere, and what `stop.on-failure` is
not: the setting stops, this one tells. A script that wants to know which step
went wrong without stopping registers one of these.

Once per submission rather than once per failing command: a loop that fails a
hundred times is one thing gone wrong, and a handler writing a line each time
would bury it. That is what the two failures in one submission here assert.
"""
script = "procedure Note is begin put_line (To_Upper (\"noticed\")); end Note; on_failure (\"Note\"); run (\"{emit}\", \"--exit=1\"); run (\"{emit}\", \"--exit=2\"); put_line (To_Upper (\"carried on\"));\nquit (0);"
exit_status = 0
output = ["CARRIED ON", "NOTICED"]
diagnostics = []

[[case]]
id = "input.a-read-can-give-up-waiting"
requirement = """
`Read_Line_Within` is a line or nothing after that long, which is what a script
needs to ask a question it can carry on without.

Three answers, none of them an empty line: a line, the end of the input, and
giving up -- `Input_Ended` and `Input_Timed_Out` say which, because input can
genuinely hold an empty line and a caller reading "" would not know which of the
three had happened.

A line is what this case gives it. The other two need an input that is open and
silent, which a case cannot arrange -- the runner either hands the shell text or
closes the stream -- so giving up is asserted by a unit case that holds a pipe
open and writes nothing into it.
"""
arguments = ["{root}/conformance/fixtures/waits-a-moment.adash"]
input = "answered in time\n"
exit_status = 0
output = ["[answered in time] timed_out FALSE ended FALSE"]
diagnostics = []
