# A program can report what it computed.
#
# Until put_line was lowered for String, a program could compute but not say
# anything: its only observable result was its exit status. Every case here was
# unobservable before.
#
# The last three cases mix put_line with an internal command in one submission.
# They could not be written until the frontend began rendering a command's
# output as the command produced it: the two take different routes to standard
# output -- a program writes as the machine runs it, a command produces
# structured lines -- and holding the second back put it after text written
# later.

suite = "program-output"

[[case]]
id = "output.literal"
requirement = "put_line writes a string literal and a newline."
script = "put_line (\"hello, world\");"
exit_status = 0
output = ["hello, world"]
diagnostics = []

[[case]]
id = "output.variable"
requirement = "put_line writes what a variable holds, not its name."
script = "X : String := \"from a variable\"; put_line (X);"
exit_status = 0
output = ["from a variable"]
diagnostics = []

[[case]]
id = "output.computed"
requirement = "A program can compute a string and report it. This is what could not be done at all: compute, then say."
script = "X : String := \"\"; for I in 1 .. 3 loop X := X & \"ab\"; end loop; put_line (X);"
exit_status = 0
output = ["ababab"]
diagnostics = []

[[case]]
id = "output.empty-line"
requirement = "An empty string writes an empty line, not nothing."
script = "put_line (\"\");"
exit_status = 0
output = [""]
diagnostics = []

[[case]]
id = "output.utf8-survives"
requirement = "Text above ASCII reaches standard output byte for byte, through the lexer, the machine and the writer."
script = "put_line (\"héllo — ok\");"
exit_status = 0
output = ["héllo — ok"]
diagnostics = []

[[case]]
id = "output.put-does-not-break-the-line"
requirement = "put writes without a newline, so several calls build one line."
script = "put (\"a\"); put (\"b\"); put_line (\"c\");"
exit_status = 0
output = ["abc"]
diagnostics = []

[[case]]
id = "output.integer-still-writes"
requirement = "Lowering String did not disturb Integer, which needs a width and a base where a string needs neither. The width is zero, so there is no padding."
script = "put_line (42);"
exit_status = 0
output = ["42"]
diagnostics = []

[[case]]
id = "output.character"
requirement = "put_line writes a Character, with no padding: the width is zero, so a value takes exactly the room it needs."
script = "put (\"[\"); put ('q'); put_line (\"]\");"
exit_status = 0
output = ["[q]"]
diagnostics = []

[[case]]
id = "output.boolean"
requirement = "put_line writes a Boolean as Ada writes one -- upper case -- and with no padding. Ada's own default width pads to the longest literal, which would put a trailing space after every True."
script = "put (\"[\"); put (True); put_line (\"]\");"
exit_status = 0
output = ["[TRUE]"]
diagnostics = []

[[case]]
id = "output.boolean-from-an-expression"
requirement = "What is written is the value, so a comparison can be reported directly."
script = "N : Integer := 3; put_line (N > 2);"
exit_status = 0
output = ["TRUE"]
diagnostics = []

[[case]]
id = "output.float"
requirement = "put_line writes a Float in Ada's own default form, so the same program means the same thing here as under a compiler. A prettier form was available and would have printed a Float differently here than in the language Adash is a subset of."
script = "put_line (1.5);"
exit_status = 0
output = [" 1.50000000000000000E+00"]
diagnostics = []

[[case]]
id = "output.float-keeps-its-sign"
requirement = "A negative Float keeps its sign. Negating one with the integer instruction leaves the value untouched, and the program runs on with the wrong number rather than failing."
script = "put_line (-2.25);"
exit_status = 0
output = ["-2.25000000000000000E+00"]
diagnostics = []

[[case]]
id = "output.float-arithmetic"
requirement = "Float arithmetic uses the Float instructions: the value lives in a different field of the machine's cell from an Integer's, so the integer instructions would read the one that is not in use."
script = "put_line (1.5 + 2.25);"
exit_status = 0
output = [" 3.75000000000000000E+00"]
diagnostics = []

[[case]]
id = "output.command-then-program"
requirement = "A command's output comes before what the program writes after it."
script = "pwd; put_line (\"after the command\");"
exit_status = 0

[[case]]
id = "output.program-then-command-then-program"
requirement = "Output arrives in the order the submission wrote it, whichever channel each line came from."
script = "put_line (\"first\"); version; put_line (\"third\");"
exit_status = 0
output = [
  "first",
  "!line.version{name=adash,version=0.1.0-dev}!",
  "third",
]
diagnostics = []

[[case]]
id = "output.survives-a-halt"
requirement = "Everything written before a command that ends the session is still written, and nothing after it is."
script = "put_line (\"kept\"); version; quit (3); put_line (\"never\");"
exit_status = 3
output = [
  "kept",
  "!line.version{name=adash,version=0.1.0-dev}!",
]
diagnostics = []

[[case]]
id = "output.abs-integer"
requirement = "abs gives the magnitude of an Integer."
script = "put_line (abs (-5));"
exit_status = 0
output = ["5"]
diagnostics = []

[[case]]
id = "output.abs-float"
requirement = "abs gives the magnitude of a Float. It is a standard function with one form per type, and the integer form applied to a Float would leave the number untouched rather than fail."
script = "put_line (abs (-2.25));"
exit_status = 0
output = [" 2.25000000000000000E+00"]
diagnostics = []

[[case]]
id = "env.value-reaches-the-language"
requirement = """
A program can read an environment variable. Until this existed the language
could obtain nothing from outside itself: every predefined entity was a type, a
Boolean literal or a way to write output, so a program computed from literals
and `cd (Home)` was unwritable.
"""
script = "set (\"ADASH_PROBE=seen\"); put_line (Env_Value (\"ADASH_PROBE\"));"
exit_status = 0
output = ["seen"]
diagnostics = []

[[case]]
id = "env.unset-is-empty"
requirement = """
A name that is not set reads as the empty string rather than failing, as it does
in every shell: a program testing whether something is set compares it, and an
error would make that untestable.
"""
script = "if Env_Value (\"ADASH_NOT_SET_ANYWHERE\") = \"\" then put_line (\"unset\"); end if;"
exit_status = 0
output = ["unset"]
diagnostics = []

[[case]]
id = "env.value-composes"
requirement = "What it returns is an ordinary String: it concatenates, compares and can be passed on."
script = "set (\"ADASH_PROBE=x\"); put_line (\"got \" & Env_Value (\"ADASH_PROBE\") & \".\");"
exit_status = 0
output = ["got x."]
diagnostics = []

[[case]]
id = "capture.reads-what-a-program-wrote"
requirement = """
A program's output can be read as a value. Until this, a shell whose language
could run programs could not read what any of them said: everything a program
wrote went to the terminal and nothing could be computed from it.
"""
script = "put_line (\"[\" & Output_Of (\"{emit}\", \"hello world\") & \"]\"); quit (0);"
exit_status = 0
output = ["[hello world]"]
diagnostics = []

[[case]]
id = "capture.drops-the-final-newline"
requirement = """
The newline a program ends with is dropped, which is the convention every shell
follows and the reason `cd (Output_Of (\"pwd\"))` works. Only from the end: what
is in the middle is what the program wrote.

The middle is checked with a space rather than with a second line. A program
ends its lines the way its host does -- CR LF on Windows -- so a case that put
two lines in and asserted one newline between them was asserting the host's
line ending, which is not what this rule is about.
"""
script = "put_line (\"[\" & Output_Of (\"{emit}\", \"a b\") & \"]\"); quit (0);"
exit_status = 0
output = ["[a b]"]
diagnostics = []

[[case]]
id = "capture.answers-empty-for-a-program-that-said-nothing"
requirement = "A program that wrote nothing answers with the empty string rather than failing, so a script can compare it."
script = "if Output_Of (\"{emit}\") = \"\" then put_line (\"nothing\"); end if; quit (0);"
exit_status = 0
output = ["nothing"]
diagnostics = []

[[case]]
id = "capture.records-the-status"
requirement = "Running a program for its output is still running a program, so Status says what became of it."
script = "S : String := Output_Of (\"{emit}\", \"--exit=1\"); put_line (Status); quit (0);"
exit_status = 0
output = ["1"]
diagnostics = []

[[case]]
id = "capture.a-program-that-will-not-start"
requirement = "The same 127 the run family reports, from the one place that decides -- and the diagnostic still reaches the user."
script = "S : String := Output_Of (\"adash-no-such-program-anywhere\"); put_line (Status); quit (0);"
exit_status = 0
output = ["127"]
diagnostics = [
  "!error.command_not_found{command=adash-no-such-program-anywhere}!",
]

[[case]]
id = "capture.leaves-standard-error-alone"
requirement = """
What a program writes to standard error is not collected. It belongs to the
user: a program explaining why it failed should be heard, not swallowed into a
value the script is about to compare against something.
"""
script = "put_line (\"[\" & Output_Of (\"{emit}\", \"--error=err\", \"out\") & \"]\"); quit (0);"
exit_status = 0
output = ["[out]"]
diagnostics = ["err"]

[[case]]
id = "capture.needs-a-program"
requirement = "It takes a program and up to three arguments, so a call with none is refused by the analyser rather than discovered when nothing runs."
script = "S : String := Output_Of; quit (0);"
exit_status = 0
output = []
diagnostics = [
  "!error.wrong_argument_count{name=Output_Of,expected= 1 .. 4,found= 0}!",
]

[[case]]
id = "string.one-position-yields-a-character"
requirement = """
A String can be taken apart. Until this it could be held, copied, joined and
compared and nothing else -- a shell that could read a program's output could
not look at any of it.
"""
script = "S : String := \"hello\"; put_line (S (2)); quit (0);"
exit_status = 0
output = ["e"]
diagnostics = []

[[case]]
id = "string.a-range-yields-a-string"
requirement = "A range of positions yields the String between them, written as Ada writes it."
script = "S : String := \"hello world\"; put_line (S (7 .. 11)); quit (0);"
exit_status = 0
output = ["world"]
diagnostics = []

[[case]]
id = "string.an-empty-slice-is-empty"
requirement = "A range whose first position is past its last yields nothing, as Ada says, rather than failing."
script = "S : String := \"hello\"; put_line (\"[\" & S (3 .. 2) & \"]\"); quit (0);"
exit_status = 0
output = ["[]"]
diagnostics = []

[[case]]
id = "string.a-part-of-what-a-call-yielded"
requirement = """
Ada slices a function's result, and this does: `F (2 .. 4)` calls F and takes
the three characters. What tells it from a call is the range -- a range is not
an expression and cannot be an argument, so nothing but a part can be meant.
A prefix that is itself a call has already been decided: whatever it yields is
a value, and a value is not called, so `F (1) (2 .. 4)` and a slice of a slice
read the same way.

Nothing about an ordinary call changes. `F (7)` with an Integer parameter is a
call, because the argument is not a range and the name denotes something
callable.
"""
script = "function Whole return String is begin return \"abcdef\"; end Whole; function Sized (N : Integer) return String is begin return \"abcdef\"; end Sized; function Numbered (N : Integer) return String is begin return \"got\" & N'Image; end Numbered; S : String := \"abcdef\"; put_line (Whole (2 .. 4)); put_line (Sized (1) (2 .. 4)); put_line (S (2 .. 5) (1 .. 2)); put_line (Sized (1) (3)'Image); put_line (Numbered (7)); put_line (Trim (\"  hello  \") (1 .. 3)); quit (0);"
exit_status = 0
output = ["bcd", "bcd", "bc", "'c'", "got 7", "hel"]
diagnostics = []

[[case]]
id = "string.a-part-of-a-part-is-assigned-to"
requirement = """
`S (2 .. 5) (1 .. 2) := "XY"` writes through both levels into S, as deep as it
is written. Each level changes the level outside it and the outermost change is
stored in the variable the chain bottoms out at, so what a reader sees is one
statement and what runs is one store.

Positions inside a part are that part's own, counted from one. Ada's slice
keeps the index range of what it came from, so `S (2 .. 5) (1 .. 2)` is an error
there and is the first two characters of the slice here. A String is a value in
this language rather than a view of one, and a value that begins somewhere other
than one would be a String that `'First` lies about.

A chain rooted in a call is refused instead, and named: what a call yields has
nowhere to put anything, however many levels are written on it.
"""
script = "S : String := \"abcdefgh\"; S (2 .. 7) (2 .. 5) (1 .. 2) := \"XY\"; put_line (S); T : String := \"abcdef\"; T (2 .. 5) (2) := 'Q'; put_line (T); U : String := \"abcdef\"; U (2 .. 5) (1 .. 2) := U (5 .. 6); put_line (U);\nfunction Whole return String is begin return \"abcdef\"; end Whole; Whole (1 .. 4) (1 .. 2) := \"XY\";\nquit (0);"
exit_status = 0
output = ["abXYefgh", "abQdef", "aefdef"]
diagnostics = [
  "!error.not_assignable{name=Whole}!",
]

[[case]]
id = "string.a-part-of-a-part-is-checked-at-each-level"
requirement = "Each level checks what it can see. A bound past the end of the part being written into raises against that part's length, not against the length of the String underneath -- which is what makes the message name a number the reader can find."
script = "S : String := \"abcdef\"; S (2 .. 5) (3 .. 9) := \"XYZXYZX\";\nquit (0);"
exit_status = 0
diagnostics = [
  "!error.program_raised_detail{exception=Index_Error,detail=!error.machine.slice_outside{first=3,last=9,length=4}!}!",
]

[[case]]
id = "string.only-a-string-is-taken-apart"
requirement = """
What a call yields has to be a String for a part of it to mean anything: an
Integer has no parts, and neither has anything else here that is not a String
or an array.

A part of what a call yielded is not assigned to, because a value has nowhere
to put anything.
"""
script = "function Counted (N : Integer) return Integer is begin return 5; end Counted; put_line (Counted (1) (2)'Image);\nfunction Whole return String is begin return \"abcdef\"; end Whole; Whole (1 .. 2) := \"XY\";\nquit (0);"
exit_status = 0
diagnostics = [
  "!error.not_taken_apart{found=Integer}!",
  "!error.not_assignable{name=Whole}!",
]

[[case]]
id = "string.a-part-is-assigned-to"
requirement = """
`S (2 .. 4) := "xyz"` and `S (2) := 'x'` are Ada, and are how a script fixes a
field of a fixed-width line without rebuilding the whole of it by hand. A String
is one cell here rather than a run of slots, so there is no place inside one to
store to: the machine builds the whole text changed and the assignment stores
that. What a reader sees is Ada's statement; what runs is the same assignment
written the long way, with the checks in the instruction rather than in the
program.
"""
script = "S : String := \"abcdef\"; S (2 .. 4) := \"XYZ\"; put_line (S); S (1) := 'Q'; put_line (S); I : Integer := 5; S (I .. I + 1) := \"..\"; put_line (S); S (3 .. 2) := \"\"; put_line (S); quit (0);"
exit_status = 0
output = ["aXYZef", "QXYZef", "QXYZ..", "QXYZ.."]
diagnostics = []

[[case]]
id = "string.a-part-assigned-must-be-the-length-it-covers"
requirement = """
Ada's rule: the value has to be as long as the slice it goes into. A shorter one
would leave the rest of the target holding what it held, which no reading of the
assignment expects, and the honest answer is Constraint_Error rather than a
String that is quietly the wrong length.

A position or a bound outside the String raises where the read of one does, and
says the same thing.
"""
script = "S : String := \"abcdef\"; S (2 .. 4) := \"XY\";\nquit (0);"
exit_status = 0
diagnostics = [
  "!error.program_raised_detail{exception=Constraint_Error,detail=!error.machine.slice_lengths{wanted=3,given=2}!}!",
]

[[case]]
id = "string.a-part-is-assigned-only-where-the-whole-may-be"
requirement = """
What a part of a String may be assigned to is what the String may be. A constant
and an `in` parameter are refused, and refused by name -- the name of the
String, because that is what is not assignable rather than the position inside
it.

This is the check the other composites already had. It was missing here because
a String part carried no symbol for the assignment to ask about, so a constant's
slice was quietly written.
"""
script = "S : constant String := \"abcdef\"; S (2 .. 3) := \"XY\";\nprocedure P (T : String) is begin T (1) := 'Z'; end P;\nquit (0);"
exit_status = 0
diagnostics = [
  "!error.not_assignable{name=S}!",
  "!error.not_assignable{name=T}!",
]

[[case]]
id = "string.knows-its-own-length"
requirement = """
`'Length`, `'First` and `'Last`, which is what a loop over a String's characters
needs. Every String here begins at one, so `'First` is one and `'Last` is the
length -- there are no other index ranges to have.
"""
script = "S : String := \"abcd\"; put_line (S'Length); put_line (S'First); put_line (S'Last); quit (0);"
exit_status = 0
output = ["4", "1", "4"]
diagnostics = []

[[case]]
id = "string.walks-its-characters"
requirement = "The three attributes and indexing together, which is the loop somebody writes the day they have text to look at."
script = "S : String := \"abc\"; for I in S'First .. S'Last loop put (S (I)); end loop; New_Line; quit (0);"
exit_status = 0
output = ["abc"]
diagnostics = []

[[case]]
id = "string.a-position-past-the-end-raises"
requirement = """
Out of range raises rather than reading whatever was next. The check is the
machine's own instruction, so every way of reaching a position -- an index, a
slice, a part of a part -- is checked in one place rather than in each of them.
"""
script = "S : String := \"abc\"; put_line (S (9)); quit (0);"
exit_status = 0
output = []
diagnostics = [
  "!error.program_raised_detail{exception=Index_Error,detail=!error.machine.index_outside{position=9,length=3}!}!",
]

[[case]]
id = "string.is-taken-apart-one-way"
requirement = "One position or one range, and nothing else: two arguments is not an index and is refused by name."
script = "S : String := \"abc\"; put_line (S (1, 2)); quit (0);"
exit_status = 0
output = []
diagnostics = [
  "!error.string_index_malformed!",
]

[[case]]
id = "string.only-a-string-has-a-length"
requirement = "An attribute that means nothing for the type is refused rather than guessed at."
script = "N : Integer := 3; put_line (N'Length); quit (0);"
exit_status = 0
output = []
diagnostics = [
  "!error.attribute_not_defined{attribute=Length,found=Integer}!",
]

[[case]]
id = "string.joins-with-a-character"
requirement = """
Ada's rule for a one-dimensional array: two of them, or one and a component. A
String and a Character is the second, and is what a loop building text out of
the characters it took apart writes. Two Characters are refused, as Ada refuses
them: neither is an array, so nothing says which array type the result would be.
"""
script = "S : String := \"ab\"; C : Character := 'z'; put_line (S & C); put_line (C & S); quit (0);"
exit_status = 0
output = ["abz", "zab"]
diagnostics = []

[[case]]
id = "string.two-characters-are-not-a-string"
requirement = "Refused as Ada refuses it, rather than quietly producing a two-character String."
script = "C : Character := 'a'; put_line (C & C); quit (0);"
exit_status = 0
output = []
diagnostics = [
  "!error.operator_not_defined{operator=&,left=Character,right=Character}!",
]

[[case]]
id = "string.rebuilt-from-its-characters"
requirement = "Taking a String apart and putting it back together, which is the loop the three attributes and indexing exist for."
script = "S : String := \"abc\"; T : String := \"\"; for I in S'First .. S'Last loop T := T & S (I); end loop; if T = S then put_line (\"same\"); end if; quit (0);"
exit_status = 0
output = ["same"]
diagnostics = []

[[case]]
id = "input.reads-a-line-at-a-time"
requirement = """
A script can read its own input. Until this the shell could write its output and
run other programs and could not read a byte of what it was given: a script at
the end of a pipe had no way to see anything.

An empty line is a line, which is why the end of the input is a separate
question: a program that could only see the text could not tell `` from `no
more`.
"""
arguments = ["{root}/conformance/fixtures/echoes.adash"]
input = "one\ntwo\n\nthree"
exit_status = 0
output = ["[one]", "[two]", "[]", "[three]", "read to the end"]
diagnostics = []

[[case]]
id = "paths.asks-whether-something-is-there"
requirement = """
A shell script asks whether a file is there before it acts on it -- the
commonest conditional anybody writes -- and the language could not ask it at
all. Every other way a program touched the filesystem went through running
something, and none of those answers a question.
"""
script = "if Exists (\"{root}/README.md\") then put_line (\"there\"); end if; if not Exists (\"{root}/adash-no-such-file\") then put_line (\"and not there\"); end if; quit (0);"
exit_status = 0
output = ["there", "and not there"]
diagnostics = []

[[case]]
id = "paths.tells-a-directory-from-a-file"
requirement = "Two different questions, because acting on a directory as though it were a file is the mistake the question exists to prevent."
script = "put_line (Is_Directory (\"{root}/conformance\")); put_line (Is_Directory (\"{root}/README.md\")); quit (0);"
exit_status = 0
output = ["TRUE", "FALSE"]
diagnostics = []

[[case]]
id = "paths.asks-whether-something-could-be-run"
requirement = "The host's own answer, from hostkit: what makes a file runnable is the host's business and not a guess from the name."
script = "put_line (Is_Executable (\"{shell}\")); put_line (Is_Executable (\"{root}/README.md\")); quit (0);"
exit_status = 0
output = ["TRUE", "FALSE"]
diagnostics = []

[[case]]
id = "paths.a-path-that-cannot-be-reached-is-not-a-file"
requirement = """
A path that cannot be reached -- no such directory, nothing named at all -- is
not a file, so the answer is False rather than a failure. A predicate that could
fail would need a second question beside every use, and the useful answer is the
same either way.
"""
script = "put_line (Exists (\"\")); put_line (Exists (\"/adash-no-such-directory/and/deeper\")); quit (0);"
exit_status = 0
output = ["FALSE", "FALSE"]
diagnostics = []

[[case]]
id = "text.is-searched"
requirement = """
Where a piece of text starts inside another, counting from one, and zero when it
is not there -- which is Ada's own answer, and what lets a caller test without a
second question. A String could be compared whole and taken apart by position;
finding something in it meant a hand-written loop.
"""
script = "S : String := \"Hello World\"; put_line (Index (S, \"World\")); put_line (Index (S, \"zzz\")); quit (0);"
exit_status = 0
output = ["7", "0"]
diagnostics = []

[[case]]
id = "text.is-shaped"
requirement = """
Trimmed, and in either case. Ada spells these in packages --
`Ada.Strings.Fixed.Trim`, `Ada.Characters.Handling.To_Upper` -- and this
language has no packages to spell, so the names are visible directly. They are
Ada's own names; what is missing is only the road to them.
"""
script = "put_line (Trim (\"  x  \") & \"|\"); put_line (To_Upper (\"aBc\")); put_line (To_Lower (\"aBc\")); quit (0);"
exit_status = 0
output = ["x|", "ABC", "abc"]
diagnostics = []

[[case]]
id = "text.is-tested-at-either-end"
requirement = "Whether it begins or ends with something, which is what a script asks of a path, a flag or a line of output."
script = "S : String := \"report.txt\"; put_line (Starts_With (S, \"report\")); put_line (Ends_With (S, \".txt\")); put_line (Ends_With (S, \".csv\")); quit (0);"
exit_status = 0
output = ["TRUE", "TRUE", "FALSE"]
diagnostics = []

[[case]]
id = "files.writes-what-a-script-computed"
requirement = """
A script works something out and puts it in a file. Everything that wrote a file
before this wrote what a *program* had printed -- `run_into` and its relatives --
so a value the language itself produced had nowhere to go, and the shell could
not save its own answer.
"""
script = "write_file (\"alpha\", \"{store}/out.txt\"); run_from (\"{store}/out.txt\", \"{upcase}\"); quit (0);"
exit_status = 0
output = ["ALPHA"]
diagnostics = []

[[case]]
id = "files.appends-to-the-end"
requirement = "Adding to a file rather than replacing it, so a loop can collect lines. Appending to a file that is not there makes it, because the first turn of that loop is not an error."
script = "for Index in 1 .. 3 loop append_file (\"line\", \"{store}/log.txt\"); end loop; run_from (\"{store}/log.txt\", \"{upcase}\"); quit (0);"
exit_status = 0
output = ["LINELINELINE"]
diagnostics = []

[[case]]
id = "files.replaces-rather-than-adds"
requirement = "The second write leaves the file holding only what the second write said, which is the difference between the two commands and the reason there are two."
script = "write_file (\"first\", \"{store}/r.txt\"); write_file (\"second\", \"{store}/r.txt\"); run_from (\"{store}/r.txt\", \"{upcase}\"); quit (0);"
exit_status = 0
output = ["SECOND"]
diagnostics = []

[[case]]
id = "files.a-path-that-cannot-be-written-is-refused"
requirement = """
Refused rather than reported as done. A write that silently failed would leave a
script believing it had saved something, and the next run reading what the run
before it wrote.
"""
script = "write_file (\"x\", \"{store}/no-such-directory/out.txt\"); quit (Status);"
exit_status = 1
diagnostics = ["!error.file_not_writable{path={store}/no-such-directory/out.txt}!"]

[[case]]
id = "files.a-directory-is-not-a-file-to-write"
requirement = "Writing over a directory is refused before anything is opened, because the host's own answer to that is not the same everywhere and a shell should not depend on which one it got."
script = "write_file (\"x\", \"{store}\"); quit (Status);"
exit_status = 1
diagnostics = ["!error.file_not_writable{path={store}}!"]

[[case]]
id = "files.writing-sets-the-status"
requirement = "A write that worked leaves Status at zero, so a script can act on the one before it in the same way it acts on a program that ran."
script = "write_file (\"x\", \"{store}/s.txt\"); if Status = 0 then put_line (\"saved\"); end if; quit (0);"
exit_status = 0
output = ["saved"]
diagnostics = []

[[case]]
id = "run.the-shell-can-run-the-shell"
requirement = """
`{shell}` is the binary under test, with whatever suffix the host puts on an
executable -- `.exe` on Windows and nothing on the other two. Starting it as a
child is the one case where the shell meets the same question a user does: a
case that named `{root}/bin/adash` would be asking about a file that does not
exist on one of the three hosts, and would fail there for a reason that has
nothing to do with what it meant to assert.

What comes back is what `--version` prints, through a pipe rather than a
terminal, so it also says that the version report is an answer on standard
output rather than something only a terminal sees.
"""
script = "run (\"{shell}\", \"--version\");\nquit (Status);"
exit_status = 0
output = [
  "!version.line{version=0.1.0-dev}!",
  "!version.build{profile=development,os={os},arch={arch}}!",
  "!version.prerelease_notice!",
]
diagnostics = []

[[case]]
id = "run.a-batch-file-runs-where-the-host-starts-one"
requirement = """
Windows starts a batch file when it is named: the host runs the command
interpreter for it, which is a fact about the host rather than a language this
shell has adopted. So `run ("thing.bat")` runs it, and its exit status is the
status of the run.

This case exists because the opposite was written down first, from reading how
process creation works rather than from watching it: completion was made to
leave batch files out, and a case gated to this host said the shell had run one
perfectly well. What is asserted here is what the host does; what completion
offers follows from it.
"""
script = """
write_file ("@echo off", "{store}/batch.bat");
run ("{store}/batch.bat");
if Status /= 0 then
   quit (3);
end if;
put_line ("ran it");
quit (0);"""
exit_status = 0
output = ["ran it"]
platforms = ["windows"]

[[case]]
id = "run.a-file-nothing-starts-is-refused-and-said-so"
requirement = """
Windows counts a `.ps1` an executable and starts none from a name: a script for
another shell is read by that shell, and this one invokes nothing to help. So a
name the host would call a program can still be a name nothing here can run.

What is asserted is that it is refused and that the session goes on -- the run
fails, `Status` says so, and the next submission runs. Which diagnostic the host
produces is left unasserted on purpose: it is Windows's word for a failed
process creation, and pinning it here would pin an error code into a case about
the shell's behaviour.

The neighbouring case says what happens to a `.bat`, which this host *does*
start by running the command interpreter for it. The two together are the
boundary, and completion offers what falls on the near side of it.
"""
script = """
write_file ("Write-Host hello", "{store}/thing.ps1");
run ("{store}/thing.ps1");
if Status = 0 then
   quit (3);
end if;
put_line ("refused, and still here");
quit (0);"""
exit_status = 0
output = ["refused, and still here"]
platforms = ["windows"]

[[case]]
id = "files.read_file-is-write_file-other-half"
requirement = """
A shell that can put text in a file and cannot get it back is one whose scripts
run `cat` to read what they just wrote -- a program start for something the
shell can do itself, and a program two of the three hosts have.

`Read_File` is a question, so it is a function and has no consequences: a file
that is not there reads as nothing, which is what a script appending to a log
wants on its first turn and what `cat` would have said with a complaint. Telling
"nothing there" from "nothing in it" is what `Exists` is for, and the case below
says so.
"""
script = """
write_file ("first" & Character'Val (10) & "second", "{store}/held.txt");
put_line ("[" & Read_File ("{store}/held.txt") & "]");
put_line ("[" & Read_File ("{store}/never-written.txt") & "]");
put_line (Boolean'Image (Exists ("{store}/never-written.txt")));
quit (0);"""
exit_status = 0
output = [
  "[first",
  "second]",
  "[]",
  "FALSE",
]
diagnostics = []

[[case]]
id = "files.current_directory-is-what-the-session-knows"
requirement = """
Where the session is is something the shell knows: `cd` moved it. A script that
had to ask a program for it would only run on hosts that ship that program, and
would pay a process start for an answer already in hand.

A question, so a function -- and one whose answer moves, which is a different
property from having consequences. It answers with the directory `cd` last
went to.
"""
script = """
cd ("{store}");
put_line (Boolean'Image (Is_Directory (Current_Directory)));
put_line (Boolean'Image (Current_Directory = ""));
quit (0);"""
exit_status = 0
output = [
  "TRUE",
  "FALSE",
]
diagnostics = []

[[case]]
id = "files.make_directory-makes-the-place-a-file-goes"
requirement = """
`write_file` into a directory that is not there is refused, and until this
existed a script had no way to make one: a shell that could save a file could
not decide where to put it, and reached for a program to make the place.

Every missing directory in the path rather than only the last, because a script
that has worked out `logs/2026/august` means all of it. A directory that is
already there is not a failure -- what was asked for is that it be there, and a
script that ran twice would otherwise fail on its second turn for having
succeeded on its first. Something that is not a directory in the way is refused
and says so.

A command rather than a function, for the same reason writing is one: it has
consequences, and a reader should see it happen rather than find it inside a
condition.
"""
script = """
make_directory ("{store}/deep/and/deeper");
put_line (Boolean'Image (Is_Directory ("{store}/deep/and/deeper")));
write_file ("held", "{store}/deep/and/deeper/file.txt");
put_line (Read_File ("{store}/deep/and/deeper/file.txt"));
make_directory ("{store}/deep/and/deeper");
put_line (Integer'Image (Status));
make_directory ("{store}/deep/and/deeper/file.txt");
put_line (Integer'Image (Status));
quit (0);"""
exit_status = 0
output = [
  "TRUE",
  "held",
  " 0",
  " 1",
]
diagnostics = [
  "!error.file_not_writable{path={store}/deep/and/deeper/file.txt}!",
]

[[case]]
id = "files.read_file-of-a-directory-is-nothing"
requirement = """
A directory holds no text, so reading one answers with none -- the same answer
as a file that is not there, and for the same reason: a question has no
consequences, and a function that raised here would make `Read_File` unusable
in the expression a script actually writes.

Which is why the two are told apart by asking, not by reading. `Exists` says
something is there and `Is_Directory` says what it is, and a script that cares
asks before it reads.
"""
script = """
make_directory ("{store}/a-directory");
put_line ("[" & Read_File ("{store}/a-directory") & "]");
put_line (Boolean'Image (Exists ("{store}/a-directory")));
put_line (Boolean'Image (Is_Directory ("{store}/a-directory")));
quit (0);"""
exit_status = 0
output = [
  "[]",
  "TRUE",
  "TRUE",
]
diagnostics = []

[[case]]
id = "files.make_directory-refuses-a-name-the-host-will-not-form"
requirement = """
The other refusal, and the one nobody writes a test for: not something in the
way, but a name this host will not take at all. Every host has a limit on how
long one part of a path may be, and a name past it is refused where it is
named.

Refused rather than failed, and the difference is not pedantry. A write can
stop half way and leave a file that is neither what was there before nor what
was meant, so "did not finish" is what its caller needs to hear. A directory is
made or it is not, and a name the host never accepted was never begun -- a user
told that writing did not finish would go looking for what was half done.
"""
script = """
make_directory ("{store}");
put_line (Integer'Image (Status));
put_line (Boolean'Image (Exists ("{store}")));
quit (0);"""
exit_status = 0
output = [
  " 1",
  "FALSE",
]
diagnostics = [
  "!error.file_not_writable{path={store}}!",
]

[[case]]
id = "files.a-program-that-writes-too-much-is-stopped"
requirement = """
`Output_Of` holds what a program writes in one String, so a program that never
stops writing would grow the session until the host ended it -- and unlike a
file, whose size can be asked about, the only way to find out is to read it.

So the read is bounded by `read.limit`, said in mebibytes, and a program past it
is stopped rather than waited for: the shell closes the pipe, and the next write
into a pipe nobody holds open ends the program. No signal is involved, which is
what makes it work on the host that has none.

Refused whole rather than truncated. A script handed the first megabyte of an
answer has no way to know that is what it got, and every comparison it makes
afterwards is wrong in a way nothing reports.

The program is the test crate's own, told to repeat a line until it has written
more than a mebibyte. `yes` was the obvious choice and it is a POSIX one, which
would have gated this case to two hosts of three -- and the host it would have
left out is the one where the stopping works differently, since it has no signal
to stop a program with.
"""
script = """
settings ("read.limit", "1");
put_line ("[" & Output_Of ("{emit}", "--repeat=16000", "0123456789012345678901234567890123456789012345678901234567890123456789012345678901234567890123456789") & "]");
put_line (Integer'Image (Status));
quit (0);"""
exit_status = 0
output = [
  "!line.setting{key=read.limit,value=1,summary=!setting.read-limit!}!",
  "[]",
  " 1",
]
diagnostics = [
  "!error.output_too_large{program={emit}}!",
]

[[case]]
id = "run.a-shell-runs-a-shell"
requirement = """
A script may run another, and the shell is a program like any other to it. That
is worth asserting for itself, and it is also the smallest version of something
that failed on one host and not the others: a case that ran this shell over a
fixture writing a mebibyte got nothing back on Windows, no output and no
complaint, while the same case answered on Linux and macOS.

It answered: a shell runs a shell fine, and what was wrong was the line endings.
A program on Windows ends a line with a carriage return and a line feed, so a
capture with two lines in it came back with a stray carriage return inside --
invisible, and enough to make every comparison against text the script wrote
itself fail on that host and nowhere else. `Output_Of` hands back text with the
line endings text has, which is what this case now asserts on all three hosts.
"""
script = """
put_line (Output_Of ("{shell}", "{root}/conformance/fixtures/says-a-little.adash"));
put_line (Integer'Image (Status));
quit (0);"""
exit_status = 0
output = [
  "from the child",
  "and again",
  " 0",
]
diagnostics = []

[[case]]
id = "run.a-shell-runs-a-shell-that-says-a-great-deal"
requirement = """
The other half of the case above, and the half that is still unexplained: when
a child shell wrote more than a mebibyte, one host came back with an empty
capture, a failing status, and no complaint of any kind -- and a refusal that
says nothing is a defect whatever caused it.

Two hundred kilobytes rather than a mebibyte, so this is inside what a capture
will hold and past what a pipe buffer holds. If it passes everywhere, a child
shell can fill a pipe and be drained, and what remains unexplained is only the
refusal path. If it fails, filling a pipe from a child of this shell is the
thing that does not work, which is worth far more than the guess it replaces.

The last line is what is asserted: anything short of it means the child stopped
early, and asserting the whole two hundred kilobytes would say the same thing
in a way nobody could read.
"""
script = """
put_line (Boolean'Image (Index (Output_Of ("{shell}", "{root}/conformance/fixtures/says-a-lot.adash"), "that was all of it") > 0));
put_line (Integer'Image (Status));
quit (0);"""
exit_status = 0
output = [
  "TRUE",
  " 0",
]
diagnostics = []

[[case]]
id = "files.a-capture-and-a-file-both-answer-in-text"
requirement = """
A program on Windows ends a line with a carriage return and a line feed, and a
file written there holds the same. A script that compared what it read against
text it wrote itself failed on that host and nowhere else, for a byte nobody
can see -- which is exactly the kind of thing that survives for years, because
it is invisible in the two places most people look.

So all three readers answer the same way: `Read_Line` drops the carriage return
with the terminator, and `Output_Of` and `Read_File` drop it too. A lone
carriage return is left where it is, since it is not a line ending on any host
this runs on -- which the last line asserts, because a rule that removed every
carriage return would be a different rule and a worse one.

Asserted on every host rather than only where the host writes those endings: a
rule one host of three exercises is a rule that breaks on the other two without
anybody hearing about it. The program is the test crate's own, told to end its
lines the way a Windows program does.
"""
script = """
put_line (Boolean'Image (Output_Of ("{emit}", "--crlf", "one", "two") = "one" & Character'Val (10) & "two"));
write_file ("a" & Character'Val (13) & Character'Val (10) & "b", "{store}/crlf.txt");
put_line (Boolean'Image (Read_File ("{store}/crlf.txt") = "a" & Character'Val (10) & "b"));
write_file ("held" & Character'Val (13) & "on", "{store}/lone.txt");
put_line (Boolean'Image (Read_File ("{store}/lone.txt") = "held" & Character'Val (13) & "on"));
quit (0);"""
exit_status = 0
output = [
  "TRUE",
  "TRUE",
  "TRUE",
]
diagnostics = []

[[case]]
id = "run.a-shell-runs-a-shell-that-says-more-than-a-mebibyte"
requirement = """
Two hundred kilobytes from a child shell works everywhere; this is the same
question at a mebibyte and a half, which is the size at which one host answered
with nothing at all.

Inside what a capture holds by default, so nothing here is refused: what is
being asked is whether a child shell can write that much into a pipe and be
drained of it. If this passes and the refusal below does not, then what is
broken is the refusal and not the writing, which is as far as anybody has
narrowed it.
"""
script = """
put_line (Boolean'Image (Index (Output_Of ("{shell}", "{root}/conformance/fixtures/says-too-much.adash"), "that was all of it") > 0));
put_line (Integer'Image (Status));
quit (0);"""
exit_status = 0
output = [
  "TRUE",
  " 0",
]
diagnostics = []

[[case]]
id = "run.a-child-shell-past-the-limit-is-refused"
requirement = """
The case that has never been explained, written down so that it either passes
or says something.

A program past `read.limit` is stopped and the capture refused, and the same
case with the test crate's own program passes on every host. With a child shell
as the program, one host came back with an empty capture, a failing status, and
no diagnostic of any kind. Everything else about that has since been ruled out:
a shell runs a shell, a child fills a pipe and is drained of it, and the line
endings that made the first version of this fail are fixed.

A refusal that says nothing is a defect whatever causes it, so this asserts the
saying rather than only the refusing.

It ran on two hosts for a while, because on Windows it came back with the
refusal and no diagnostic. The cause turned out to have nothing to do with
Windows: a program stopped part-way through writing leaves a line with no end
on it, on the standard error it shares with the shell, and the shell's next
diagnostic continued that line instead of starting its own -- so what tooling
reads as a marker was glued to the tail of somebody else's sentence. On POSIX
the child dies of SIGPIPE without a word and there was nothing to glue; the
host with no such signal simply showed it first.

What is asserted here is therefore the refusal itself -- an empty capture and a
failing status -- and not the diagnostic beside it. The diagnostic is asserted
by the case above, whose program is the test crate's own and shares the stream
with nothing that dies mid-write.

That is not a dodge, and the difference is worth stating plainly: this case is
about a child shell being stopped, and what a stopped child leaves on a stream
it shares is the host's business rather than this shell's. On Windows it leaves
something -- an empty line ahead of the shell's own diagnostic, whose origin is
still unidentified -- and a case that asserted the exact contents of a shared
stream would be asserting the behaviour of whatever else was writing to it.
"""
script = """
settings ("read.limit", "1");
put_line ("[" & Output_Of ("{shell}", "{root}/conformance/fixtures/says-too-much.adash") & "]");
put_line (Integer'Image (Status));
quit (0);"""
exit_status = 0
output = [
  "!line.setting{key=read.limit,value=1,summary=!setting.read-limit!}!",
  "[]",
  " 1",
]

[[case]]
id = "input.a-line-ending-is-a-line-ending-however-it-is-spelled"
requirement = """
The third reader's half of the same rule. `Read_Line` drops the carriage return
in front of a line feed, as `Output_Of` and `Read_File` do, so a script reading
input written on Windows compares against text the same way everywhere.

Asserted through input this case supplies rather than through a host that
happens to send it, for the reason the other two are: a rule one host of three
exercises is a rule that breaks quietly on the other two.

The last line is what a lone carriage return does, which is nothing: it is not a
line ending anywhere this runs, so it stays inside the line it was typed in.
"""
arguments = ["{root}/conformance/fixtures/echoes.adash"]
input = "one\r\ntwo\r\nthr\ree\n"
exit_status = 0
output = ["[one]", "[two]", "[thr\ree]", "read to the end"]
diagnostics = []

[[case]]
id = "run.what-a-program-complains-about-can-be-collected-and-placed"
requirement = """
A shell that could put a program's output anywhere and its complaints nowhere
left a script two things it could not do: keep a program's noise out of its own
error stream, and read what a program said about a failure in order to act on
it.

`Error_Of` is `Output_Of` for the other stream, and `run_errors_into` is
`run_into` for it. Two names rather than a flag on each of the existing pair:
what a program says and what it complains about are two streams because they
are two things, and a script that wanted both would want them apart.

Each leaves the other stream alone, which is the half that is easy to get wrong
-- so the case asserts that the output of a program whose errors are being
collected still arrives, and the reverse.
"""
script = """
put_line ("[" & Error_Of ("{emit}", "--error=complained", "said") & "]");
run_errors_into ("{store}/errs.txt", "{emit}", "--error=complained", "said");
put_line ("[" & Read_File ("{store}/errs.txt") & "]");
quit (0);"""
exit_status = 0
output = [
  "said",
  "[complained]",
  "said",
  "[complained",
  "]",
]
diagnostics = []

[[case]]
id = "files.a-program-that-complains-too-much-is-stopped"
requirement = """
`Error_Of` collects through the same path `Output_Of` does, so the limit that
holds there holds here -- and a program that complains without stopping is
exactly the shape that would find a mistake in the sharing. A shell that
bounded one stream and not the other would be a shell whose second reader
nobody had run past the end.

The program is stopped the same way: the shell closes the pipe, and the next
write into a pipe nobody holds open ends the program. Its ordinary output is
untouched by any of this, which is what makes the two functions worth having
separately.
"""
script = """
settings ("read.limit", "1");
put_line ("[" & Error_Of ("{emit}", "--repeat=16000", "--error=0123456789012345678901234567890123456789012345678901234567890123456789012345678901234567890123456789") & "]");
put_line (Integer'Image (Status));
quit (0);"""
exit_status = 0
output = [
  "!line.setting{key=read.limit,value=1,summary=!setting.read-limit!}!",
  "[]",
  " 1",
]
diagnostics = [
  "!error.output_too_large{program={emit}}!",
]

[[case]]
id = "run.what-a-program-complains-about-has-three-places-to-go"
requirement = """
Output can be written, added to, or written to a file that must not already
exist. Complaints could only be written, which left a script that wanted to
collect what went wrong across several runs -- the commonest thing anybody does
with an error log -- with nowhere to put the second one.

The three forms are the three the output side has, and they refuse the same
way: a file that is already there is what `run_errors_new` will not write over.
"""
script = """
run_errors_into ("{store}/log.txt", "{emit}", "--error=first");
run_errors_append ("{store}/log.txt", "{emit}", "--error=second");
put_line ("[" & Read_File ("{store}/log.txt") & "]");
run_errors_new ("{store}/log.txt", "{emit}", "--error=third");
put_line (Integer'Image (Status));
quit (0);"""
exit_status = 0
output = [
  "[first",
  "second",
  "]",
  " 1",
]
diagnostics = [
  "!error.redirection_open_failed{path={store}/log.txt}!",
]

[[case]]
id = "run.both-streams-can-go-to-one-file-in-order"
requirement = """
A build log is one file with what a program said and what it complained about
in the order it wrote them. Until now a script could put each stream somewhere,
and pointing both at one name gave two open files with two positions, each
writing over the other -- which is not a log of anything.

So the error stream follows the output stream into the same open file rather
than opening a second one. Three forms again, the same three the other two
families have.

The program below says something, complains, and says something else; what the
file holds is those three in that order, which is the whole claim.
"""
script = """
run_all_into ("{store}/build.log", "{emit}", "said", "--error=complained", "after");
put_line ("[" & Read_File ("{store}/build.log") & "]");
run_all_append ("{store}/build.log", "{emit}", "again");
put_line ("[" & Read_File ("{store}/build.log") & "]");
run_all_new ("{store}/build.log", "{emit}", "refused");
put_line (Integer'Image (Status));
quit (0);"""
exit_status = 0
output = [
  "[said",
  "complained",
  "after",
  "]",
  "[said",
  "complained",
  "after",
  "again",
  "]",
  " 1",
]
diagnostics = [
  "!error.redirection_open_failed{path={store}/build.log}!",
]

[[case]]
id = "run.what-a-stopped-child-leaves-on-a-shared-stream"
requirement = """
The last unexplained thing, brought somewhere it can be looked at.

A shell that refuses a capture stops the program it refused by closing the
pipe. On POSIX that program dies of SIGPIPE without a word. On Windows there is
no such signal: the program finds its write refused, and something -- nobody
has yet identified what -- puts a blank line on the standard error it shares
with the shell, ahead of the shell's own diagnostic. That is why the case above
asserts the refusal rather than the diagnostic beside it.

Here the whole arrangement runs one level down: this shell runs a second shell
with its error stream in a file, and that second shell refuses a third. What
the file then holds is exactly what a stopped child leaves on a shared stream,
and unlike a stream two processes are writing to as a test watches, a file can
be read afterwards.

What is asserted is what holds on every host: the second shell does emit its
diagnostic, whatever else ends up on the stream beside it. That alone settles
half of what was open -- the earlier case could not tell a diagnostic that was
never written from one that was written and then lost -- and it says so on the
host where the answer was in doubt.

Both streams go to the file, not only the error one: the inner shell's own
output belongs in the record too, and it is what makes the order visible.

The name of the failure is what is looked for rather than the sentence it
renders as. A shell run by this suite says its diagnostics as markers and the
inner shell inherits that, so the words a person would read are not in the file
-- which is worth knowing when reading this case by hand, where they are.
"""
script = """
run_all_into ("{store}/inner.log", "{shell}", "{root}/conformance/fixtures/refuses-a-child.adash", "{shell}", "{root}/conformance/fixtures/says-too-much.adash");
put_line (Boolean'Image (Index (Read_File ("{store}/inner.log"), "output_too_large") > 0));
quit (0);"""
exit_status = 0
output = [
  "TRUE",
]
diagnostics = []

[[case]]
id = "files.everything-a-program-wrote-can-be-read-back-in-order"
requirement = """
The reading half of what `run_all_into` does for a file. A script could send
both streams to one file and could not read both back as one answer, so
anything that wanted to look at what a program did -- rather than store it --
had to write a file and read it again.

One pipe with a copy of its write end, for the same reason the file gets a copy
of its descriptor: two pipes would be two orders, and the order is the point.

Not a replacement for the other two and not the default. A script comparing a
program's output against something does not want a warning in the middle of it,
which is why `Output_Of` still collects one stream and leaves the other alone --
asserted here beside it, so the difference is visible in one place.
"""
script = """
put_line ("[" & All_Of ("{emit}", "said", "--error=complained", "after") & "]");
put_line ("[" & Output_Of ("{emit}", "said", "--error=complained", "after") & "]");
quit (0);"""
exit_status = 0
output = [
  "[said",
  "complained",
  "after]",
  "[said",
  "after]",
]

#  Where the complaint goes when nobody collects it: to the shell's own error
#  stream, which is exactly what `Output_Of` leaving the other stream alone
#  means, and what the case above it is for.
diagnostics = [
  "complained",
]

[[case]]
id = "pipelines.a-pipeline-s-streams-have-somewhere-to-go"
requirement = """
Everything a single program gained -- three files for output, three for
complaints, three for both -- stopped at the moment a script used more than one
program: a pipeline could only run, and where its output went was wherever the
shell's was. That was the largest asymmetry left in the language.

The nine names are the nine that already exist for one program, so a reader who
has learned those has learned these.

The **last** stage is the one redirected, which the case shows by leaving the
first stage's complaint where it was: the others are attached to the stage after
them, and redirecting one of those would cut the pipeline in half.
"""
script = """
pipe ("{emit}", "one", "--error=noise", "two");
pipe ("{upcase}");
pipe_all_into ("{store}/piped.txt");
pipe_run;
put_line ("[" & Read_File ("{store}/piped.txt") & "]");
quit (0);"""
exit_status = 0
output = [
  "[ONE",
  "TWO",
  "]",
]
diagnostics = [
  "noise",
]

[[case]]
id = "pipelines.a-pipeline-reads-from-a-file-and-answers-as-a-value"
requirement = """
The two ends the pipe_* family did not have: where a pipeline's input comes
from, and how a script reads what it wrote rather than storing it.

`pipe_from` records rather than runs, which is the difference between it and
`run_from`. A pipeline that took its input from one file and put its output in
another would otherwise be two commands each insisting on running, and only one
of them could.

`Output_Of_Pipe` and its two companions take no arguments, because the pipeline
is already built -- `pipe` said what it is, a stage at a time -- and they empty
it, because a pipeline that answered twice would run twice and the second
answer would surprise whoever wrote the first.

The first stage is where input is attached and the last is where output comes
from, for the same reason: every other stage is joined to its neighbour, and
redirecting one of those would cut the pipeline in half.
"""
script = """
write_file ("fed" & Character'Val (10), "{store}/fed.txt");
pipe ("{upcase}");
pipe_from ("{store}/fed.txt");
put_line ("[" & Output_Of_Pipe & "]");
pipe ("{emit}", "said", "--error=complained");
put_line ("[" & All_Of_Pipe & "]");
put_line (Integer'Image (Status));
quit (0);"""
exit_status = 0
output = [
  "[FED]",
  "[said",
  "complained]",
  " 0",
]
diagnostics = []

[[case]]
id = "pipelines.a-pipeline-can-be-left-running"
requirement = """
`start` puts one program in the background and there was no way to put a
pipeline there, so a script that built one had to wait for it. That was the
last direction this family left open: a pipeline could be given files to read
and write, and could not be left running while the script got on with
something else.

It is a job like any other afterwards -- named by a number, waited for, and
reported when it ends -- which is what the lines below are.

The program writes nothing and exits with a number, so what is asserted is the
job and its status rather than a race between a background program's output and
the shell's own lines.
"""
script = """
pipe ("{emit}", "--exit=3");
pipe_start;
wait (1);
put_line (Integer'Image (Status));
quit (0);"""
exit_status = 0
output = [
  "!line.job_started{id=1,what=pipeline}!",
  "!line.job_finished{id=1,status=3}!",
  " 3",
]
diagnostics = []

[[case]]
id = "pipelines.saying-where-it-goes-is-not-running-it"
requirement = """
The placement forms say where a pipeline's streams go and run nothing, as
`pipe_from` says where its input comes from. That is what lets one pipeline
read a file, write a log, and be left running -- which is the commonest reason
to put anything in the background, and could not be said while placing and
running were one command.

`Last_Job` is the other half: the number the shell just gave it, in a form a
script can hold. Guessing would mean counting every job the session has run,
foreground ones included.
"""
script = """
write_file ("b" & Character'Val (10) & "a" & Character'Val (10), "{store}/two.txt");
pipe ("sort");
pipe_from ("{store}/two.txt");
pipe_all_into ("{store}/sorted.log");
pipe_start;
wait (Last_Job);
put_line ("[" & Read_File ("{store}/sorted.log") & "]");
quit (0);"""
platforms = ["linux", "macos"]
exit_status = 0
output = [
  "!line.job_started{id=1,what=pipeline}!",
  "!line.job_finished{id=1,status=0}!",
  "[a",
  "b",
  "]",
]
diagnostics = []

[[case]]
id = "files.a-directory-can-be-looked-at"
requirement = """
Nothing in this language could see what was in a directory. That is the
commonest loop anybody writes in a shell -- over the files in a place -- and it
had no equivalent at all: a script had to run a program to find out what
existed, which is the thing `Exists` and its neighbours were added to stop.

Two functions rather than one that answers with a list, because a String and an
Integer are what this language's values are and a loop from 1 to the count reads
as what it is. They answer from one reading of the directory, so the loop sees a
place that is not changing under it.

Sorted, so that two runs of one script do the same thing; `.` and `..` left out,
because every directory has them and a loop that skips them every time has a
wart in it. There is no pattern expansion here and there will not be -- a
listing with `Ends_With` beside it is how a script picks the ones it wants.
"""
script = """
make_directory ("{store}/place");
write_file ("a", "{store}/place/beta.txt");
write_file ("b", "{store}/place/alpha.log");
make_directory ("{store}/place/inside");
put_line (Integer'Image (File_Count ("{store}/place")));
put_line (File_At ("{store}/place", 1) & " " & File_At ("{store}/place", 2) & " " & File_At ("{store}/place", 3));
put_line ("[" & File_At ("{store}/place", 4) & "]");
put_line (Integer'Image (File_Count ("{store}/no-such-place")));
quit (0);"""
exit_status = 0
output = [
  " 3",
  "alpha.log beta.txt inside",
  "[]",
  " 0",
]
diagnostics = []

[[case]]
id = "jobs.a-suspended-job-can-be-brought-back-in-front"
requirement = """
The other half of suspending. `suspend` stopped a job and `resume` let it carry
on without the terminal, so a job stopped with Ctrl-Z could never be brought
back to the keyboard -- which is what every other shell calls `fg` and what a
user who suspends something expects.

`foreground` resumes it *and waits* for it, because those are one act from
where a user stands: the point of bringing something back is to be in front of
it again. It gets the terminal while it runs, exactly as a program started in
front does.
"""
platforms = ["linux", "macos"]
script = """
start ("{emit}", "--sleep=0.2", "--exit=5");
suspend (1);
foreground (1);
put_line (Integer'Image (Status));
quit (0);"""
exit_status = 0
output = [
  "!line.job_started{id=1,what={emit} --sleep=0.2 --exit=5}!",
  "!line.job{job=1,description={emit} --sleep=0.2 --exit=5,state=!job.state.stopped!}!",
  " 5",
]
diagnostics = []

[[case]]
id = "files.things-can-be-taken-away-again"
requirement = """
A script could make a file and a directory and unmake neither. That was
defensible while unmaking was left to programs, and stopped being so when the
shell began running where those programs are not -- and the directory listing
makes it sharper still, since a script can now name exactly what it wants gone
and then has to shell out to something that may not be there.

Removing a directory takes an **empty** one, deliberately. A recursive removal
is one typo away from the most destructive thing a shell can do; a script that
means it says so in three lines that name what they destroy.

A file that is not there is not an error to remove -- a script tidying up
should not have to know whether it already has -- and `rename` and `copy_file`
refuse to replace something that is already there, because a move that silently
overwrote would be the destructive case wearing the safe one's name.
"""
script = """
make_directory ("{store}/heap/inner");
write_file ("x", "{store}/heap/a.txt");
copy_file ("{store}/heap/a.txt", "{store}/heap/b.txt");
rename ("{store}/heap/b.txt", "{store}/heap/inner/c.txt");
put_line (Integer'Image (File_Count ("{store}/heap")));
remove_directory ("{store}/heap");
put_line (Integer'Image (Status));
copy_file ("{store}/heap/a.txt", "{store}/heap/inner/c.txt");
put_line (Integer'Image (Status));
remove_file ("{store}/heap/a.txt");
remove_file ("{store}/heap/nothing-here.txt");
put_line (Integer'Image (Status));
remove_file ("{store}/heap/inner/c.txt");
remove_directory ("{store}/heap/inner");
remove_directory ("{store}/heap");
put_line (Boolean'Image (Exists ("{store}/heap")));
quit (0);"""
exit_status = 0
output = [
  " 2",
  " 1",
  " 1",
  " 0",
  "FALSE",
]
diagnostics = [
  "!error.file_not_writable{path={store}/heap}!",
  "!error.file_not_writable{path={store}/heap/inner/c.txt}!",
]

[[case]]
id = "run.a-script-can-tidy-up-after-itself"
requirement = """
A script that makes a temporary directory had no way to take it away when it
was interrupted -- what `trap` is for elsewhere, and what nothing here could
say.

`on_exit` names a subprogram the script declared, and the shell runs it when
the session ends however it ends: off the end, through `quit`, or because an
interrupt stopped what was running. Most recently registered first, so that
cleanups undo in the order the things they clean up were made.

The name is resolved when it runs rather than when it is registered, so a
script may ask for cleanup at the top and declare it below -- which is the
order anybody writes it in.
"""
script = """
procedure Tidy is begin put_line ("tidied"); remove_file ("{store}/scratch.txt"); end Tidy;
on_exit ("Tidy");
write_file ("x", "{store}/scratch.txt");
put_line (Boolean'Image (Exists ("{store}/scratch.txt")));
quit (0);"""
exit_status = 0
output = [
  "TRUE",
  "tidied",
]
diagnostics = []

[[case]]
id = "run.where-a-program-is-can-be-asked"
requirement = """
`Is_Executable` needs a path, so a script could ask about a program whose
location it already knew and could not ask about one on the search path --
which is every program a user actually names.

The host's own resolution, not a split of `PATH` by this shell: on Windows a
name matches with any of the PATHEXT suffixes, and the answer for `git` there
ends in `.exe`. Nothing at all for a name the host would not find, which is a
question with no consequences and the answer a script tests.
"""
script = """
put_line (Boolean'Image (Program_Path ("{shell}") /= ""));
put_line ("[" & Program_Path ("no-such-program-anywhere-at-all") & "]");
quit (0);"""
exit_status = 0
output = [
  "TRUE",
  "[]",
]
diagnostics = []

[[case]]
id = "pipelines.what-each-stage-reported-can-be-asked"
requirement = """
`Status` is the pipeline's own, which is its last stage's -- the rule every
shell follows, and the one that hides a failure in the middle: a pipeline whose
first stage failed and whose last one did not is a pipeline that succeeded.

Other shells answer this with an array nobody remembers the name of. Here it is
a count and a position, the shape a directory listing already has. A position
outside the pipeline answers zero, which is what `Status` answers before
anything has run: a question about something that did not happen.
"""
script = """
pipe ("{emit}", "--exit=3", "x");
pipe ("{upcase}");
pipe_run;
put_line (Integer'Image (Status) & Integer'Image (Stage_Count) & Integer'Image (Stage_Status (1)) & Integer'Image (Stage_Status (2)) & Integer'Image (Stage_Status (9)));
quit (0);"""
exit_status = 0
output = [
  "X",
  " 0 2 3 0 0",
]
diagnostics = []

[[case]]
id = "settings.commands-can-be-announced-before-they-run"
requirement = """
A script that does not do what its author expected is usually a script whose
author cannot see what it did -- which is what `set -x` is for elsewhere.

On standard error and as a note, so that what a script writes is still what a
script writes: tracing that wrote into a pipeline's data is a thing every shell
user has been bitten by once. As a structured line like everything else, so a
tool reading a session can tell a trace from a result.

The command that turns it on is not traced, because it was not on when it ran.
"""
script = """
settings ("trace.commands", "true");
write_file ("x", "{store}/traced.txt");
remove_file ("{store}/traced.txt");
quit (0);"""
exit_status = 0
output = [
  "!line.setting{key=trace.commands,value=true,summary=!setting.trace!}!",
]
diagnostics = [
  "!line.traced{command=write_file x {store}/traced.txt}!",
  "!line.traced{command=remove_file {store}/traced.txt}!",
  "!line.traced{command=quit 0}!",
]
