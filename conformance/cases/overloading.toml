# One name, several subprograms, chosen by the arguments.
#
# Resolution is by the number of arguments, their types, and what the context
# requires of the result. The last is what settles a pair differing only in what
# they return; where the context requires nothing, such a call is ambiguous --
# which is Ada's answer as well, and a better one than picking whichever was
# declared last.
#
# The lowering needed no change for any of this. Calls are matched to the
# declaration the scope chain resolved to rather than to the name, so once the
# semantic pass picks a candidate the rest follows.

suite = "overloading"

[[case]]
id = "over.by-type"
requirement = "The argument's type decides which subprogram a call means."
script = "procedure P (A : Integer) is begin put_line (\"int\"); end P; procedure P (A : String) is begin put_line (\"str\"); end P; P (1); P (\"x\");"
exit_status = 0
output = ["int", "str"]
diagnostics = []

[[case]]
id = "over.by-count"
requirement = "So does how many arguments there are."
script = "procedure P (A : Integer) is begin put_line (\"one\"); end P; procedure P (A : Integer; B : Integer) is begin put_line (\"two\"); end P; P (1); P (1, 2);"
exit_status = 0
output = ["one", "two"]
diagnostics = []

[[case]]
id = "over.functions"
requirement = "Functions overload, and the call has the chosen one's result type."
script = "function F (N : Integer) return Integer is begin return N; end F; function F (S : String) return String is begin return S; end F; put_line (F (7)); put_line (F (\"s\"));"
exit_status = 0
output = ["7", "s"]
diagnostics = []

[[case]]
id = "over.bare-name"
requirement = """
A name written without arguments means whichever takes none, not whichever was
declared last.
"""
script = "function G return Integer is begin return 1; end G; function G (N : Integer) return Integer is begin return N; end G; put_line (G); put_line (G (5));"
exit_status = 0
output = ["1", "5"]
diagnostics = []

[[case]]
id = "over.inner-does-not-hide"
requirement = "An inner declaration of a different profile does not hide an outer one; both are candidates."
script = "procedure P (A : Integer) is begin put_line (\"outer\"); end P; procedure Q is procedure P (A : String) is begin put_line (\"inner\"); end P; begin P (1); P (\"s\"); end Q; Q;"
exit_status = 0
output = ["outer", "inner"]
diagnostics = []

[[case]]
id = "over.same-profile-refused"
requirement = "Same name and same parameter types: no call could tell them apart."
script = "procedure P (A : Integer) is begin null; end P; procedure P (B : Integer) is begin null; end P;"
exit_status = 0
output = []
diagnostics = ["!error.name_already_declared{name=P}!"]

[[case]]
id = "over.no-match"
requirement = "Arguments that fit none of the declarations say so, and say how many there were."
script = "procedure P (A : Integer) is begin null; end P; procedure P (A : String) is begin null; end P; P (1.5);"
exit_status = 0
output = []
diagnostics = ["!error.no_matching_subprogram{name=P,count=2}!"]

[[case]]
id = "over.shell-names-are-reserved"
requirement = """
Ada would let a user overload Put_Line. Here the shell's own subprograms accept
any type, so a user's version would fit every call the original does and every
one would be ambiguous -- a declaration whose every use is an error.
"""
script = "procedure Put_Line (X : Integer) is begin null; end Put_Line;"
exit_status = 0
output = []
diagnostics = ["!error.name_is_predefined{name=Put_Line}!"]

[[case]]
id = "over.result-type-by-declaration"
requirement = """
Two subprograms differing only in what they return. The arguments cannot tell
them apart -- there are none -- so the declared type of the variable does.
"""
script = "function F return Integer is begin return 1; end F; function F return String is begin return \"s\"; end F; X : Integer := F; S : String := F; put_line (X); put_line (S);"
exit_status = 0
output = ["1", "s"]
diagnostics = []

[[case]]
id = "over.result-type-through-an-operator"
requirement = """
An operator whose result is its operands' type passes the requirement down to
them, so a String is wanted of the concatenation and therefore of the call.
"""
script = "function F return Integer is begin return 1; end F; function F return String is begin return \"s\"; end F; S : String := F & \"!\"; put_line (S);"
exit_status = 0
output = ["s!"]
diagnostics = []

[[case]]
id = "over.result-type-unsettled"
requirement = """
put_line takes any type, so it requires nothing of its argument and both
candidates fit. Reported rather than resolved to whichever came last.
"""
script = "function F return Integer is begin return 1; end F; function F return String is begin return \"s\"; end F; put_line (F);"
exit_status = 0
output = []
diagnostics = ["!error.ambiguous_call{name=F,count=2}!"]

[[case]]
id = "over.comparison-settles-it"
requirement = """
A comparison's operands have each other's type, even though neither has the
comparison's own. So a call several subprograms could answer is settled by what
it is compared against -- which is how Ada reads `if F = 1`.
"""
script = "function F return Integer is begin return 1; end F; function F return String is begin return \"s\"; end F; if F = 1 then put_line (\"int\"); end if; if F = \"s\" then put_line (\"str\"); end if;"
exit_status = 0
output = ["int", "str"]
diagnostics = []

[[case]]
id = "over.comparison-of-two-open-calls"
requirement = """
Only when exactly one operand is open. Two ambiguous calls say nothing about
each other, and neither does the operator between them.
"""
script = "function F return Integer is begin return 1; end F; function F return String is begin return \"s\"; end F; if F = F then null; end if;"
exit_status = 0
output = []
diagnostics = [
  "!error.ambiguous_call{name=F,count=2}!",
  "!error.ambiguous_call{name=F,count=2}!",
]

[[case]]
id = "overloading.two-types-may-name-one-value"
requirement = """
Ada lets two enumerations each declare a `Red`: a literal is a parameterless
function returning its own type, so it overloads like one and a use of the name
is settled by what the context expects. Every context that has an expectation
settles it -- an object's type, either side of a comparison, a case, a loop
parameter, an argument, and a type mark's own attribute.
"""
script = "type Warm is (Red, Amber); type Signal is (Red, Green); X : Warm := Red; Y : Signal := Red; if X = Red then put_line (\"compared against the warm one\"); end if; if Red = Y then put_line (\"and against the signal, literal first\"); end if; case X is when Red => put_line (\"case took the warm Red\"); when Amber => put_line (\"amber\"); end case; for Each in Signal loop if Each = Red then put_line (\"the loop's Red is the signal's\"); end if; end loop; procedure Show (Which : Signal) is begin put_line (\"shown \" & Which'Image); end Show; Show (Red); put_line (\"position in Warm:\" & Warm'Pos (Red)'Image & \", in Signal:\" & Signal'Pos (Red)'Image);\nquit (0);"
exit_status = 0
output = [
  "compared against the warm one",
  "and against the signal, literal first",
  "case took the warm Red",
  "the loop's Red is the signal's",
  "shown Red",
  "position in Warm: 0, in Signal: 0",
]
diagnostics = []

[[case]]
id = "overloading.and-where-nothing-says-which-it-is-refused"
requirement = """
Where no context says which type is meant the name is ambiguous, which is Ada's
answer too: taking one of them would make the program mean whichever was
declared last. Said as what it is -- a value of two types -- rather than as a
call that fits too many declarations.
"""
script = "type Warm is (Red, Amber); type Signal is (Red, Green); put_line (Red'Image);\nquit (0);"
exit_status = 0
diagnostics = ["!error.ambiguous_literal{name=Red,count=2}!"]

[[case]]
id = "overloading.but-one-type-still-names-a-value-once"
requirement = """
Two literals of one type are a redeclaration however they are spelled: nothing
could tell them apart. A variable of the same name is one too -- only what
overloads overloads -- and a name the shell provides is still refused.
"""
script = "type T is (Red, Red);\ntype W is (Red, Amber); Red : Integer := 3;\ntype B is (True, False);\nquit (0);"
exit_status = 0
diagnostics = [
  "!error.name_already_declared{name=Red}!",
  "!error.name_already_declared{name=Red}!",
  "!error.name_is_predefined{name=True}!",
  "!error.name_is_predefined{name=False}!",
]

[[case]]
id = "overloading.the-other-operand-settles-it"
requirement = """
A comparison's operands have each other's type, so when exactly one of them is
a name several declarations could answer, the other is analysed first and
settles it. That is how `if F = 1` reads, and an enumeration literal is the
same shape of question: `Red = Amber` where only one type has an Amber.
"""
script = "type Warm is (Red, Amber); type Signal is (Red, Green); if Red = Amber then put_line (\"never\"); else put_line (\"settled from the other operand\"); end if; if Amber = Red then put_line (\"never\"); else put_line (\"and the other way round\"); end if; if Red = Green then put_line (\"never\"); else put_line (\"settled to the signal\"); end if;\nquit (0);"
exit_status = 0
output = ["settled from the other operand", "and the other way round", "settled to the signal"]
diagnostics = []

[[case]]
id = "overloading.and-a-bound-settles-a-membership"
requirement = """
Membership asks the same question with its bound: the value settles the bounds
unless the value is the one in doubt, and then the bound settles the value.
Which type the bound belongs to is what decides, so the same test reads two
ways in two programs.
"""
script = "type Warm is (Red, Amber); type Signal is (Red, Green); if Red in Amber .. Amber then put_line (\"never\"); else put_line (\"took the warm Red\"); end if; if Red in Green .. Green then put_line (\"never\"); else put_line (\"took the signal Red\"); end if;\nquit (0);"
exit_status = 0
output = ["took the warm Red", "took the signal Red"]
diagnostics = []

[[case]]
id = "overloading.but-two-open-ends-say-nothing"
requirement = """
Two operands that are each a name several declarations could answer say nothing
about each other, and neither does the operator, so it stays ambiguous. Ada's
answer too: both readings exist and nothing chooses between them.
"""
script = "type Warm is (Red, Amber); type Signal is (Red, Green); if Red = Red then put_line (\"never\"); end if;\nquit (0);"
exit_status = 0
diagnostics = [
  "!error.ambiguous_literal{name=Red,count=2}!",
  "!error.ambiguous_literal{name=Red,count=2}!",
]

[[case]]
id = "overloading.and-what-is-wrong-is-said-as-what-it-is"
requirement = """
Where the context expects a type none of the declarations has, the fault is the
type rather than the choice, and the diagnostic says so. Here the second bound
of a range fixes the type and the first cannot be it.
"""
script = "type Warm is (Red, Amber); type Count_Of is (One, Two); for Each in Red .. Two loop put_line (Each'Image); end loop;\nquit (0);"
exit_status = 0
diagnostics = ["!error.type_mismatch{found=Count_Of,expected=Warm}!"]

[[case]]
id = "overloading.and-a-range-loop-settles-its-bounds-the-same-way"
requirement = "A range loop's two bounds have each other's type, so an open one is settled by the closed one -- the same rule as a comparison, applied where a loop counts."
script = "type Warm is (Red, Amber); type Signal is (Red, Green); for Each in Red .. Amber loop put_line (\"warm \" & Each'Image); end loop; for Each in Red .. Green loop put_line (\"signal \" & Each'Image); end loop;\nquit (0);"
exit_status = 0
output = ["warm Red", "warm Amber", "signal Red", "signal Green"]
diagnostics = []

[[case]]
id = "overloading.two-open-ends-with-one-type-between-them"
requirement = """
Where both ends of a comparison are open, neither settles the other by being
analysed first. What settles it is that only one type is possible for both:
two functions of each name sharing one result, or a literal two enumerations
name beside one that only one of them names.
"""
script = "function F return Integer is begin return 1; end F; function F return Float is begin return 2.0; end F; function G return Integer is begin return 9; end G; function G return String is begin return \"x\"; end G; if F = G then put_line (\"equal\"); else put_line (\"settled on Integer, and not equal\"); end if;\ntype W is (Red, Amber); type S is (Red, Green); type T is (Amber, Blue); if Red = Amber then put_line (\"never\"); else put_line (\"settled on W\"); end if;\nquit (0);"
exit_status = 0
output = ["settled on Integer, and not equal", "settled on W"]
diagnostics = []

[[case]]
id = "overloading.and-an-open-argument-to-an-open-call"
requirement = """
A call whose candidates disagree about what a parameter takes used to leave the
argument with nothing expected of it. Where the argument could itself be only
one of the types they ask for, that is the answer whichever candidate wins --
which settles the call and the argument together.
"""
script = "function F return Integer is begin return 1; end F; function F return Float is begin return 2.0; end F; procedure Show (X : Integer) is begin put_line (\"an integer:\" & X'Image); end Show; procedure Show (X : String) is begin put_line (\"a string\"); end Show; Show (F);\nquit (0);"
exit_status = 0
output = ["an integer: 1"]
diagnostics = []

[[case]]
id = "overloading.but-two-combinations-are-still-two"
requirement = """
Both readings existing is what ambiguous means, and Ada refuses it too: two
functions of each name sharing *both* results say nothing about each other, and
neither does the operator between them.
"""
script = "function F return Integer is begin return 1; end F; function F return Float is begin return 2.0; end F; function G return Integer is begin return 9; end G; function G return Float is begin return 1.0; end G; if F = G then put_line (\"never\"); end if;\nquit (0);"
exit_status = 0
diagnostics = [
  "!error.ambiguous_call{name=F,count=2}!",
  "!error.ambiguous_call{name=G,count=2}!",
]

[[case]]
id = "overloading.and-what-the-context-wants-reaches-the-arguments"
requirement = """
Ada resolves a call and its arguments together. Here both Shows take what both
Makes return, so the arguments settle nothing; what settles it is the declared
type, which only one Show returns -- and once that Show is the only candidate
left, its parameter type is what the argument is analysed against. Without it a
program has to write the intermediate declaration by hand, which is the same
program with a name nobody reads.
"""
script = "function Make return Integer is begin return 7; end Make; function Make return String is begin return \"seven\"; end Make; function Show (V : Integer) return Integer is begin return V; end Show; function Show (V : String) return String is begin return V; end Show;\nX : Integer := Show (Make); S : String := Show (Make);\nput_line (X'Image); put_line (S);\nquit (0);"
exit_status = 0
output = [" 7", "seven"]
diagnostics = []

[[case]]
id = "overloading.and-it-reaches-as-far-down-as-the-calls-nest"
requirement = """
Each level narrows the next: the declared type picks the outer Show, its
parameter picks the inner one, and that one's parameter picks the Make. A rule
that reached one level would be a rule a reader could not state.
"""
script = "function Make return Integer is begin return 7; end Make; function Make return String is begin return \"seven\"; end Make; function Show (V : Integer) return Integer is begin return V; end Show; function Show (V : String) return String is begin return V; end Show;\nS : String := Show (Show (Make));\nput_line (S);\nquit (0);"
exit_status = 0
output = ["seven"]
diagnostics = []

[[case]]
id = "overloading.and-with-nothing-required-it-is-still-ambiguous"
requirement = """
The narrowing is what the context asks for, so where it asks for nothing there
is nothing to narrow with. `put_line` takes any type and both interpretations
stand, which is Ada's answer as well -- and the honest one, since taking the
last-declared candidate would make the program mean whichever body was written
second.

**One fault, one telling.** The inner call is what cannot be resolved, and the
outer one cannot be resolved *because* of it: saying so twice would name the
outer call as the place to look, which is not where the reader has to go. So
what is reported is the argument.
"""
script = "function Make return Integer is begin return 7; end Make; function Make return String is begin return \"seven\"; end Make; function Show (V : Integer) return Integer is begin return V; end Show; function Show (V : String) return String is begin return V; end Show;\nput_line (Show (Make)'Image);\nquit (0);"
exit_status = 0
diagnostics = [
  "!error.ambiguous_call{name=Make,count=2}!",
]

[[case]]
id = "overloading.and-an-argument-that-is-settled-rules-out-the-rest"
requirement = """
Resolution travels sideways as well as inward: the argument whose type is known
rules out the subprograms that could not take it, and what is left says what
the *other* argument must be. Here the Float settles which P is meant, and that
P settles which F. Ada resolves the whole call at once and reaches the same
answer; what this does is ask the same question of one argument at a time,
which is enough whenever some argument is closed.
"""
script = "function F return Integer is begin return 7; end F; function F return String is begin return \"s\"; end F; procedure P (A : Integer; B : Integer) is begin put_line (\"ints\"); end P; procedure P (A : String; B : Float) is begin put_line (\"strfloat \" & A); end P;\nX : Float := 1.0;\nP (F, X);\nquit (0);"
exit_status = 0
output = ["strfloat s"]
diagnostics = []

[[case]]
id = "overloading.and-it-works-whichever-argument-is-closed"
requirement = """
The rule is about the arguments and not about their order, so a literal in the
second position settles the first exactly as a variable in the first settles
the second. Three arguments with one open is the same question again: what is
left after the closed ones have ruled out what they can.
"""
script = "function F return Integer is begin return 7; end F; function F return String is begin return \"s\"; end F; procedure P (A : Integer; B : Integer) is begin put_line (\"ints\"); end P; procedure P (A : String; B : String) is begin put_line (\"strs \" & A); end P;\nP (F, \"z\");\nquit (0);"
exit_status = 0
output = ["strs s"]
diagnostics = []

[[case]]
id = "overloading.and-with-every-argument-open-it-is-ambiguous"
requirement = """
Two subprograms of the same name that both take what both Fs return, with
nothing else to go on: each reading is as good as the other, which is Ada's
answer as well. The narrowing is what the closed arguments do, so where none is
closed there is nothing to narrow with -- and taking the last-declared
candidate would make the program mean whichever body was written second.

Both arguments are reported and the call is not. Each F is a place the reader
can act on -- qualify it, or name the one that was meant -- and the call is
only where the consequence showed up.
"""
script = "function F return Integer is begin return 7; end F; function F return String is begin return \"s\"; end F; procedure P (A : Integer; B : Integer) is begin put_line (\"i\"); end P; procedure P (A : String; B : String) is begin put_line (\"s\"); end P;\nP (F, F);\nquit (0);"
exit_status = 0
diagnostics = [
  "!error.ambiguous_call{name=F,count=2}!",
  "!error.ambiguous_call{name=F,count=2}!",
]

[[case]]
id = "overloading.and-a-name-written-for-a-parameter-narrows-as-a-position-does"
requirement = """
A named argument stands in the position its name denotes rather than the one it
is written in, so the narrowing has to ask each candidate where the name puts
it -- two subprograms of one name may call their parameters differently. The
same call written positionally and by name resolves the same way, which is what
a reader expects of a notation that is only about clarity.
"""
script = "function F return Integer is begin return 7; end F; function F return String is begin return \"s\"; end F; procedure P (A : Integer; B : Integer) is begin put_line (\"ints\"); end P; procedure P (A : String; B : Float) is begin put_line (\"strfloat \" & A); end P;\nX : Float := 1.0;\nP (B => X, A => F);\nP (A => F, B => X);\nquit (0);"
exit_status = 0
output = ["strfloat s", "strfloat s"]
diagnostics = []

[[case]]
id = "overloading.and-an-operator-narrows-its-other-operand"
requirement = """
An operator is where a value stands too, and its operands relate: most take one
type on both sides, and `&` takes a String or a Character on either. So a
closed operand settles an open one even where the context requires nothing --
`put_line (F & "x")` is a String because the other reading is not an operand
this operator has. Without it a program had to write the intermediate
declaration by hand, or qualify what needed no qualifying.
"""
script = "function F return Integer is begin return 7; end F; function F return String is begin return \"s\"; end F;\nput_line (F & \"x\");\nput_line (\"x\" & F);\nput_line (Integer'Image (F * 2));\nquit (0);"
exit_status = 0
output = ["sx", "xs", " 14"]
diagnostics = []

[[case]]
id = "overloading.and-two-open-operands-still-say-nothing"
requirement = """
The narrowing is what a *settled* operand does, so two open ones settle
nothing: each reading stands and the call is ambiguous, which is Ada's answer
as well. What rules this in is that both operands are calls several subprograms
could answer and no context requires anything of the whole.
"""
script = "function F return Integer is begin return 7; end F; function F return String is begin return \"s\"; end F; function G return Float is begin return 1.5; end G; function G return String is begin return \"g\"; end G;\nput_line (F & G);\nquit (0);"
exit_status = 0
diagnostics = [
  "!error.ambiguous_call{name=F,count=2}!",
  "!error.ambiguous_call{name=G,count=2}!",
]

[[case]]
id = "overloading.an-operator-argument-settles-the-call"
requirement = """
An argument that is an expression rather than a name says what it is too. `F &
"z"` can only be a String, whatever else F could be, so a call whose candidates
differ in that position is settled by it -- and the F inside it is settled in
turn, by the parameter the chosen candidate has there.

Before this, only a literal or a name with one meaning counted as saying
anything, so an operator expression left every candidate standing and the call
was reported ambiguous with the answer written in front of it.
"""
script = "function A return Integer is begin return 1; end A;\nfunction A return String is begin return \"a\"; end A;\nprocedure Show (X : Integer; Y : Integer) is begin put_line (\"ints\"); end Show;\nprocedure Show (X : String; Y : String) is begin put_line (\"strings \" & X & Y); end Show;\nShow (A, A & \"z\");\nquit (0);"
exit_status = 0
output = ["strings aaz"]
diagnostics = []

[[case]]
id = "overloading.not-requires-a-boolean-of-what-it-negates"
requirement = """
`not` yields a Boolean and takes one, and the second half is what settles a
name several declarations could answer: `not F` is the F that yields a Boolean,
because the others could not be negated at all.

The same reading for `and`, `or` and `xor`, which take Boolean on both sides
and nothing else in this subset. A sign is the numeric version of the same
thing: `-F` is the F that yields a number, when exactly one of them does.
"""
script = "function A return Integer is begin return 2; end A;\nfunction A return String is begin return \"a\"; end A;\nfunction A return Boolean is begin return True; end A;\nput_line (Boolean'Image (not A));\nput_line (Boolean'Image (A and A));\nput_line (Integer'Image (-A));\nput_line (Integer'Image (abs A));\nquit (0);"
exit_status = 0
output = ["FALSE", "TRUE", "-2", " 2"]
diagnostics = []

[[case]]
id = "overloading.a-qualified-argument-says-what-it-is"
requirement = """
`Integer'(F)` is the whole point of writing one: it says which F is meant where
nothing else does. It counts as an argument that has settled, so the call
around it is settled too.
"""
script = "function A return Integer is begin return 3; end A;\nfunction A return String is begin return \"a\"; end A;\nprocedure Show (X : Integer) is begin put_line (\"int\" & Integer'Image (X)); end Show;\nprocedure Show (X : String) is begin put_line (\"str \" & X); end Show;\nShow (Integer'(A));\nquit (0);"
exit_status = 0
output = ["int 3"]
diagnostics = []

[[case]]
id = "overloading.two-open-ends-stay-ambiguous"
requirement = """
The other half of the same rule, and the reason it is a rule rather than a
guess. `F = F` where F names three subprograms has three readings and Ada calls
that ambiguous too: an operator settles an open operand from a *settled* one,
and there is none here. Reported rather than chosen.
"""
script = "function A return Integer is begin return 1; end A;\nfunction A return String is begin return \"a\"; end A;\nput_line (Boolean'Image (A = A));\nquit (0);"

# The submission that is refused is one of four; the session goes on and the
# last of them decides what the shell exits with.
exit_status = 0
output = []
diagnostics = [
  "!error.ambiguous_call{name=A,count=2}!",
  "!error.ambiguous_call{name=A,count=2}!",
]
