# `source`: running another file in this session rather than in a child.
#
# The distinction is the whole point. A child process could not change the
# environment of the shell that started it; a sourced file can, because it is
# the same session -- and that is why this is a shell command rather than a way
# to spawn one more adash.
#
# These cases write no files of their own: a conformance case is a script and a
# set of expectations, and one that needed a fixture on disk would be testing
# the fixture too. What is pinned down here is what `source` does when the file
# is not there, and that a session which cannot run scripts says so.

suite = "sourcing"

[[case]]
id = "source.missing-file"
requirement = """
A file that is not there is reported, and the rest of the submission still
runs: a failed command does not stop the sequence, which the exit-status cases
already pin down. A name with a separator in it is a path and is used as
written, so the report says there is nothing there rather than describing a
search that never happened.
"""
script = "source (\"/nonexistent/adash-no-such-file.adash\"); put_line (\"after\");"
exit_status = 0
output = ["after"]
diagnostics = [
  "!error.module_not_found{name=/nonexistent/adash-no-such-file.adash,where=!module.looked.as_written!}!",
]

[[case]]
id = "source.needs-one-argument"
requirement = "source takes exactly one path, and says so rather than guessing."
script = "source;"
exit_status = 2
output = []
diagnostics = ["!error.wrong_argument_count{name=source,expected=1,found=0}!"]

[[case]]
id = "history.reports-what-was-typed"
requirement = """
`history` reports this session's lines, numbered, including the call itself --
the line is recorded before the command runs, which is what every shell does.

Each case gets a data store of its own, so the numbering here is this session's
and not a count of everything the suite has run.
"""
script = "version;\nhistory;"
exit_status = 0
output = [
  "!line.version{name=adash,version={version}}!",
  "!line.history_entry{number=1,line=version;}!",
  "!line.history_entry{number=2,line=history;}!",
]
diagnostics = []

[[case]]
id = "source.finds-a-module-beside-the-script"
requirement = """
A bare name is searched for rather than used as written: beside the script doing
the loading first, then the user's own module directory. A set of scripts that
ship together find each other without any of them knowing where they were
installed -- and without the working directory deciding, which is what makes it
work when somebody runs the script from elsewhere.

`Adash.Scripting.Modules` had decided all of this since Phase 14 and nothing
asked it: `source ("greeting")` failed unless a file of exactly that name sat in
the working directory.
"""
arguments = ["{root}/conformance/fixtures/modules/asks.adash"]
exit_status = 0
output = ["the module ran", "and the script that asked for it"]
diagnostics = []

[[case]]
id = "source.says-where-it-looked"
requirement = """
A name that resolves to nothing says where the search went. `no script called
setup` leaves a reader wondering whether the shell searched at all.
"""
script = "source (\"adash-no-such-module\"); quit (0);"
exit_status = 0
output = []
diagnostics = [
  "!error.module_not_found{name=adash-no-such-module,where=!module.looked.in_modules!}!",
]

[[case]]
id = "session.a-protected-object-keeps-its-state-across-submissions"
requirement = """
A protected object declared at the prompt is there on the next line, with the
state it ended with. It is carried by replaying its declaration and handing its
state back, which is why it works for a single object and for one of a
protected type alike -- a protected object has no value to be handed back as.
"""
script = "protected Tally is procedure Add; function Total return Integer; end Tally; protected body Tally is N : Integer := 0; procedure Add is begin N := N + 1; end Add; function Total return Integer is begin return N; end Total; end Tally;\nTally.Add; Tally.Add;\nput_line (\"kept: \" & Integer'Image (Tally.Total));\nquit (0);"
exit_status = 0
output = ["kept:  2"]
diagnostics = []

[[case]]
id = "session.a-submission-that-stops-early-loses-only-its-own"
requirement = """
`quit`, `return` and an unhandled exception all leave the hand-back unreached,
so the variables of *that* submission are not kept -- and only those. What the
session was already holding it goes on holding, with the values it had before
the submission that failed: a submission's effect on the variables is either all
there or not there at all.

This had been wider than it said. Every carried variable is declared again in
every submission, because that is how its value comes back, and the declaration
emptied the place it was holding before the program ran. One raise anywhere
therefore took every variable in the session with it, and a subprogram carried
alongside them stopped analysing -- it named something that had just ceased to
exist. Found while writing a case for something else, which is where the
diagnostic that made no sense turned up.
"""
script = "Kept : Integer := 5; procedure Show is begin put_line (Kept'Image); end Show; Show;\nKept := 9; Lost : Integer := 1; raise Constraint_Error;\nShow;\nput_line (Lost'Image);\nquit (0);"
exit_status = 0
output = [" 5", " 5"]
diagnostics = [
  "!error.program_raised{exception=Constraint_Error}!",
  "!error.name_undeclared{name=Lost}!",
]

[[case]]
id = "session.a-definition-past-the-limit-says-so"
requirement = """
A session holds at most 256 definitions -- a shell open for a week should not be
carrying everything anyone ever typed -- and one past that is not remembered.
Said out loud, because a definition silently not kept looks like one that was
until the line that used it fails for no visible reason.

That was written down for subprograms and types and was not true of variables:
the warning existed and only one of the four paths that drop a definition
reached it. So the 257th variable vanished in silence and the next line reported
an undeclared name the user had watched themselves declare. All four paths say
it now.
"""
script = "V1 : Integer := 1; V2 : Integer := 2; V3 : Integer := 3; V4 : Integer := 4; V5 : Integer := 5; V6 : Integer := 6; V7 : Integer := 7; V8 : Integer := 8; V9 : Integer := 9; V10 : Integer := 10; V11 : Integer := 11; V12 : Integer := 12; V13 : Integer := 13; V14 : Integer := 14; V15 : Integer := 15; V16 : Integer := 16; V17 : Integer := 17; V18 : Integer := 18; V19 : Integer := 19; V20 : Integer := 20; V21 : Integer := 21; V22 : Integer := 22; V23 : Integer := 23; V24 : Integer := 24; V25 : Integer := 25; V26 : Integer := 26; V27 : Integer := 27; V28 : Integer := 28; V29 : Integer := 29; V30 : Integer := 30; V31 : Integer := 31; V32 : Integer := 32; V33 : Integer := 33; V34 : Integer := 34; V35 : Integer := 35; V36 : Integer := 36; V37 : Integer := 37; V38 : Integer := 38; V39 : Integer := 39; V40 : Integer := 40; V41 : Integer := 41; V42 : Integer := 42; V43 : Integer := 43; V44 : Integer := 44; V45 : Integer := 45; V46 : Integer := 46; V47 : Integer := 47; V48 : Integer := 48; V49 : Integer := 49; V50 : Integer := 50; V51 : Integer := 51; V52 : Integer := 52; V53 : Integer := 53; V54 : Integer := 54; V55 : Integer := 55; V56 : Integer := 56; V57 : Integer := 57; V58 : Integer := 58; V59 : Integer := 59; V60 : Integer := 60; V61 : Integer := 61; V62 : Integer := 62; V63 : Integer := 63; V64 : Integer := 64; V65 : Integer := 65; V66 : Integer := 66; V67 : Integer := 67; V68 : Integer := 68; V69 : Integer := 69; V70 : Integer := 70; V71 : Integer := 71; V72 : Integer := 72; V73 : Integer := 73; V74 : Integer := 74; V75 : Integer := 75; V76 : Integer := 76; V77 : Integer := 77; V78 : Integer := 78; V79 : Integer := 79; V80 : Integer := 80; V81 : Integer := 81; V82 : Integer := 82; V83 : Integer := 83; V84 : Integer := 84; V85 : Integer := 85; V86 : Integer := 86; V87 : Integer := 87; V88 : Integer := 88; V89 : Integer := 89; V90 : Integer := 90; V91 : Integer := 91; V92 : Integer := 92; V93 : Integer := 93; V94 : Integer := 94; V95 : Integer := 95; V96 : Integer := 96; V97 : Integer := 97; V98 : Integer := 98; V99 : Integer := 99; V100 : Integer := 100; V101 : Integer := 101; V102 : Integer := 102; V103 : Integer := 103; V104 : Integer := 104; V105 : Integer := 105; V106 : Integer := 106; V107 : Integer := 107; V108 : Integer := 108; V109 : Integer := 109; V110 : Integer := 110; V111 : Integer := 111; V112 : Integer := 112; V113 : Integer := 113; V114 : Integer := 114; V115 : Integer := 115; V116 : Integer := 116; V117 : Integer := 117; V118 : Integer := 118; V119 : Integer := 119; V120 : Integer := 120; V121 : Integer := 121; V122 : Integer := 122; V123 : Integer := 123; V124 : Integer := 124; V125 : Integer := 125; V126 : Integer := 126; V127 : Integer := 127; V128 : Integer := 128; V129 : Integer := 129; V130 : Integer := 130; V131 : Integer := 131; V132 : Integer := 132; V133 : Integer := 133; V134 : Integer := 134; V135 : Integer := 135; V136 : Integer := 136; V137 : Integer := 137; V138 : Integer := 138; V139 : Integer := 139; V140 : Integer := 140; V141 : Integer := 141; V142 : Integer := 142; V143 : Integer := 143; V144 : Integer := 144; V145 : Integer := 145; V146 : Integer := 146; V147 : Integer := 147; V148 : Integer := 148; V149 : Integer := 149; V150 : Integer := 150; V151 : Integer := 151; V152 : Integer := 152; V153 : Integer := 153; V154 : Integer := 154; V155 : Integer := 155; V156 : Integer := 156; V157 : Integer := 157; V158 : Integer := 158; V159 : Integer := 159; V160 : Integer := 160; V161 : Integer := 161; V162 : Integer := 162; V163 : Integer := 163; V164 : Integer := 164; V165 : Integer := 165; V166 : Integer := 166; V167 : Integer := 167; V168 : Integer := 168; V169 : Integer := 169; V170 : Integer := 170; V171 : Integer := 171; V172 : Integer := 172; V173 : Integer := 173; V174 : Integer := 174; V175 : Integer := 175; V176 : Integer := 176; V177 : Integer := 177; V178 : Integer := 178; V179 : Integer := 179; V180 : Integer := 180; V181 : Integer := 181; V182 : Integer := 182; V183 : Integer := 183; V184 : Integer := 184; V185 : Integer := 185; V186 : Integer := 186; V187 : Integer := 187; V188 : Integer := 188; V189 : Integer := 189; V190 : Integer := 190; V191 : Integer := 191; V192 : Integer := 192; V193 : Integer := 193; V194 : Integer := 194; V195 : Integer := 195; V196 : Integer := 196; V197 : Integer := 197; V198 : Integer := 198; V199 : Integer := 199; V200 : Integer := 200; V201 : Integer := 201; V202 : Integer := 202; V203 : Integer := 203; V204 : Integer := 204; V205 : Integer := 205; V206 : Integer := 206; V207 : Integer := 207; V208 : Integer := 208; V209 : Integer := 209; V210 : Integer := 210; V211 : Integer := 211; V212 : Integer := 212; V213 : Integer := 213; V214 : Integer := 214; V215 : Integer := 215; V216 : Integer := 216; V217 : Integer := 217; V218 : Integer := 218; V219 : Integer := 219; V220 : Integer := 220; V221 : Integer := 221; V222 : Integer := 222; V223 : Integer := 223; V224 : Integer := 224; V225 : Integer := 225; V226 : Integer := 226; V227 : Integer := 227; V228 : Integer := 228; V229 : Integer := 229; V230 : Integer := 230; V231 : Integer := 231; V232 : Integer := 232; V233 : Integer := 233; V234 : Integer := 234; V235 : Integer := 235; V236 : Integer := 236; V237 : Integer := 237; V238 : Integer := 238; V239 : Integer := 239; V240 : Integer := 240; V241 : Integer := 241; V242 : Integer := 242; V243 : Integer := 243; V244 : Integer := 244; V245 : Integer := 245; V246 : Integer := 246; V247 : Integer := 247; V248 : Integer := 248; V249 : Integer := 249; V250 : Integer := 250; V251 : Integer := 251; V252 : Integer := 252; V253 : Integer := 253; V254 : Integer := 254; V255 : Integer := 255; V256 : Integer := 256; V257 : Integer := 257; V258 : Integer := 258;\nput_line (V258'Image);\nquit (0);"
exit_status = 0
diagnostics = [
  "!error.too_many_kept{name=V257,limit=256}!",
  "!error.too_many_kept{name=V258,limit=256}!",
  "!error.name_undeclared{name=V258}!",
]

[[case]]
id = "session.a-failed-submission-keeps-what-it-declared-that-is-not-a-variable"
requirement = """
A submission that raises still declared its subprograms and its types. That is
deliberate and the reason is a session at a prompt: a definition that vanished
because a later line raised would be maddening to work with, and the definition
is text rather than a value -- nothing has to survive the run for it to be
kept.

Its *variables* are another matter. Those are carried by handing their values
back as the program ends, and a program that stopped early never reached the
hand-back, so what it declared has no value to carry and is not carried.
"""
script = "procedure Kept_One is begin put_line (\"still here\"); end Kept_One; type Colour is (Red, Green); Lost : Integer := 1; raise Constraint_Error;\nKept_One; Shade : Colour := Green; put_line (Shade'Image);\nput_line (Lost'Image);\nquit (0);"
exit_status = 0
output = ["still here", "Green"]
diagnostics = [
  "!error.program_raised{exception=Constraint_Error}!",
  "!error.name_undeclared{name=Lost}!",
]

[[case]]
id = "session.a-handled-exception-is-not-stopping-early"
requirement = """
The rule is about a submission that *stops* early, not about an exception
happening. One a handler answers for is a submission that finished, so what it
changed is carried like any other -- which is what makes a handler worth
writing at a prompt rather than only in a script.
"""
script = "X : Integer := 1;\nbegin X := 9; raise Constraint_Error; exception when others => put_line (\"caught\"); end;\nput_line (X'Image);\nquit (0);"
exit_status = 0
output = ["caught", " 9"]
diagnostics = []

[[case]]
id = "session.a-session-goes-on-after-a-raise"
requirement = """
An interactive session is a raise followed by more submissions, which is the
shape nothing here covered until the hand-back defect was found -- by a
diagnostic in a case written for something else rather than by a test failing.

So: a raise in a submission of its own, one from a subprogram called by a
later submission, and one inside a task. After each, the session goes on and
what it was holding is what it held before that submission ran. A String is in
here because its value travels back as text where a number travels as its
`'Image`, and the two are different roads to the same place.
"""
script = "X : Integer := 3; S : String := \"before\"; procedure Fail is begin raise Program_Error; end Fail;\nS := \"after\"; raise Constraint_Error;\nFail;\ntask T; task body T is begin raise Constraint_Error; end T;\nput_line (X'Image & \" \" & S);\nquit (0);"
exit_status = 0
output = [" 3 before"]
diagnostics = [
  "!error.program_raised{exception=Constraint_Error}!",
  "!error.program_raised{exception=Program_Error}!",
  "!error.program_raised{exception=Constraint_Error}!",
]

[[case]]
id = "session.a-protected-object-keeps-what-it-held-before-a-raise"
requirement = """
A protected object's state is carried the way a variable's is -- handed back as
the program ends -- so a submission that raises leaves it holding what it held
before. Two calls before the failing submission and one inside it come to two,
not three: the failed submission's effect is either all there or not there at
all.
"""
script = "protected Tally is procedure Add; function Total return Integer; end Tally; protected body Tally is N : Integer := 0; procedure Add is begin N := N + 1; end Add; function Total return Integer is begin return N; end Total; end Tally; Tally.Add; Tally.Add;\nTally.Add; raise Constraint_Error;\nput_line (Tally.Total'Image);\nquit (0);"
exit_status = 0
output = [" 2"]
diagnostics = [
  "!error.program_raised{exception=Constraint_Error}!",
]

[[case]]
id = "session.a-sourced-file-that-raises-leaves-the-session-standing"
requirement = "A sourced file runs in this session rather than in a child, so a raise in one is a raise in the session -- and the session goes on holding what it held. What the file failed to do is undone with it; what was there before is not."
script = "write_file (\"raise Constraint_Error;\", \"{store}/boom.adash\"); X : Integer := 6;\nsource (\"{store}/boom.adash\");\nput_line (X'Image);\nquit (0);"
exit_status = 0
output = [" 6"]
diagnostics = [
  "!error.program_raised{exception=Constraint_Error}!",
]

[[case]]
id = "session.and-a-task-object-does-not-outlive-its-submission"
requirement = """
A task object is not carried, and the roadmap says why: a task does not outlive
its master and a submission is one, so what would be carried is the name of
something that has ended. The type is carried, body and all, because a type
starts nothing.
"""
script = "task type Worker is entry Go; end Worker; task body Worker is begin accept Go do put_line (\"served\"); end Go; end Worker;\nW : Worker; W.Go;\nW.Go;\nquit (0);"
exit_status = 0
output = ["served"]
diagnostics = ["!error.name_undeclared{name=W}!"]

[[case]]
id = "session.a-variable-read-before-it-has-a-value-says-so"
requirement = """
Ada calls reading an uninitialised variable erroneous and says nothing about
what follows. What follows here is a failure with a name: the alternative is
whatever the slot happened to hold being used as though somebody had written
it, which is the one outcome a reader cannot see in the source. It is
`Program_Error` and a handler catches it, so a program that means to read a
variable it may not have set can say so.
"""
script = "X : Integer;\nput_line (X'Image);\nquit (0);"
exit_status = 0
diagnostics = [
  "!error.program_raised_detail{exception=Program_Error,detail=!error.machine.no_value!}!",
]

[[case]]
id = "session.and-a-variable-with-no-value-is-carried-as-the-declaration"
requirement = """
A submission carries what it declared into the next one. A variable that was
never assigned has no value to carry and is carried as the declaration alone --
so the next submission may assign it, which is the ordinary way `X : Integer;`
and `X := 4;` are written on two lines. Carrying nothing at all would lose the
declaration, and inventing a value would hand the next submission something
this one never had.
"""
script = "X : Integer;\nX := 4;\nput_line (X'Image);\nquit (0);"
exit_status = 0
output = [" 4"]
diagnostics = []

[[case]]
id = "session.and-a-composite-is-carried-with-the-parts-it-has"
requirement = """
A composite is carried as the value that rebuilds it, and a part that holds
nothing cannot be written in one -- so a value filled in part is carried as the
declaration and an assignment for each part that has one. What was set stays
set across the submission that follows, and what was not is still unset there:
reading it raises exactly as reading it before would have.
"""
script = "type Row is array (1 .. 3) of Integer; A : Row; A (1) := 7;\nput_line (A (1)'Image);\nput_line (A (2)'Image);\nquit (0);"
exit_status = 0
output = [" 7"]
diagnostics = [
  "!error.program_raised_detail{exception=Program_Error,detail=!error.machine.no_value!}!",
]

[[case]]
id = "session.and-a-record-carries-the-components-it-has-by-name"
requirement = """
The same rule with the other composite: a record's parts are reached by name
rather than by position, so what is carried names them. A component set two
submissions ago is still set, which is what makes a record usable at a prompt
where it is filled in a component at a time.
"""
script = "type Line is record Number : Integer; Text : String; end record; L : Line; L.Number := 3;\nL.Text := \"here\";\nput_line (L.Text & L.Number'Image);\nquit (0);"
exit_status = 0
output = ["here 3"]
diagnostics = []

[[case]]
id = "source.a-module-moves-the-session-it-was-read-into"
requirement = """
A sourced file runs *in this session*, which is the whole reason `source`
exists rather than `run`. So a module that pushes a directory has pushed the
session's directory: the caller stands where the module left it, and what the
module set aside is on the caller's stack to pop.

Worth asserting because the alternative is defensible and wrong here. A module
that moved only itself would be a module that could not set up a working
directory for the script that read it, which is one of the two things a module
is for -- the other being declarations, which the cases below cover.

Named by path rather than as a module, because the search for a bare name does
not include the directory the shell happens to be standing in -- see
`source.says-where-it-looked`, which is the case for that.

The stack is asserted by popping it rather than by listing it. `directories`
prints the path it set aside, and on macOS the shell's answer is the canonical
`/private/var/...` while the store this case was given is the `/var/...` the
runner knows it by -- the same directory, spelled two ways, and a case that
compared them failed on one host of the three. Popping asks the question
without naming the answer.
"""
script = "cd (\"{store}\"); make_directory (\"below\"); write_file (\"push_directory (\"\"below\"\");\" & Character'Val (10), \"mover.adash\"); source (\"./mover.adash\"); put_line (Ends_With (Current_Directory, \"below\")); pop_directory; put_line (Ends_With (Current_Directory, \"files\"));\nquit (0);"
exit_status = 0
output = ["TRUE", "TRUE"]
diagnostics = []

[[case]]
id = "source.a-failure-in-a-module-stops-a-stopping-script"
requirement = """
`stop.on-failure` ends the submission at the first command that fails, and a
sourced file is part of the submission that read it -- so a failure inside a
module stops the module *and* the script that sourced it, at that command.

The other reading would be that a module is a thing you call and come back
from, which is what `run` is for. This is the one that matches "a script is one
submission": the module's next line does not run, and neither does the caller's.
"""
script = "cd (\"{store}\"); settings (\"stop.on-failure\", \"true\"); write_file (\"run (\"\"{emit}\"\", \"\"--exit=4\"\"); put_line (\"\"module went on\"\");\" & Character'Val (10), \"failing.adash\"); source (\"./failing.adash\"); put_line (\"caller went on\");"
exit_status = 4
output = ["!line.setting{key=stop.on-failure,value=true,summary=!setting.stop-on-failure!}!"]
diagnostics = []

[[case]]
id = "source.and-a-script-is-one-submission"
requirement = """
What a sourced file declares reaches the next submission, and a script file is
one submission — so a script that sources a file and then calls what it
declared is refused, however many lines apart the two are. Typed at a prompt
the same two lines work, because there each line is its own submission. The
scripting guide showed the script form as working for some time; a case is what
keeps the difference from being described from memory.
"""
script = "write_file (\"procedure Report (What : String) is begin put_line (\"\"report: \"\" & What); end Report;\", \"{store}/helpers.adash\");\nsource (\"{store}/helpers.adash\"); Report (\"done\");\nquit (0);"
exit_status = 0
diagnostics = ["!error.name_undeclared{name=Report}!"]

[[case]]
id = "source.but-the-next-submission-sees-it"
requirement = """
The other half of the same rule: the declaration is there for the submission
after the one that sourced it, which is what makes `source` usable at a prompt
and what the startup file relies on.
"""
script = "write_file (\"procedure Report (What : String) is begin put_line (\"\"report: \"\" & What); end Report;\", \"{store}/helpers.adash\");\nsource (\"{store}/helpers.adash\");\nReport (\"done\");\nquit (0);"
exit_status = 0
output = ["report: done"]
diagnostics = []

[[case]]
id = "source.a-script-reads-in-what-it-asks-for"
requirement = """
A script is one submission, analysed as a whole before any of it runs, so a
call that only *runs* another file comes too late for the analysis: the names
that file declares are not there to be resolved. The file is read into the
script's text where the call stands, so what runs is one program in the order
it was written and a module's declarations are in scope for what follows them.
That is what makes a set of scripts that ship together usable as one.
"""
arguments = ["{root}/conformance/fixtures/modules/uses.adash"]
exit_status = 0
output = ["hello, world!", "and the script that asked for it"]
diagnostics = []

[[case]]
id = "source.and-a-name-it-computes-still-runs-when-reached"
requirement = """
Only a literal name is read in, which is the rule this language uses wherever
something has to be known before the program runs -- an array's bounds, a
case's choices, a parameter's default. `source (Name)` is not one, so it stays
what it was: a command that runs a file when it is reached, whose declarations
reach the next submission.
"""
script = "Where : String := \"{store}/late.adash\"; write_file (\"put_line (\"\"late ran\"\");\", Where);\nsource (Where);\nquit (0);"
exit_status = 0
output = ["late ran"]
diagnostics = []

[[case]]
id = "scripting.a-file-a-windows-editor-wrote-runs"
requirement = """
Every line of `crlf.adash` ends CR LF, which is what a Windows editor writes.
The shell reads it as it reads any other script: the carriage returns end lines
and do not become part of them, so a string is not one character longer than it
was typed and a comment does not swallow what follows it.

The fixture is held at CR LF by `.gitattributes`, which holds the rest of this
repository to LF, so this asserts the same thing on all three hosts rather than
on whichever one's checkout happened to produce those bytes. That entry is
there because a checkout that turned LF into CR LF once made 374 message keys
missing from a catalog that had every one of them -- the same bytes, read the
other way round.
"""
arguments = ["{root}/conformance/fixtures/crlf.adash"]
exit_status = 0
output = [
  "a line that ends with a carriage return",
  "hello, world",
  "line 1",
  "line 2",
]
diagnostics = []
