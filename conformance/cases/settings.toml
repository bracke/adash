#  The shell's own settings.
#
#  Adash.Configuration carried a complete settings registry -- what each one is
#  for, what values it takes, what its bounds are -- and Adash.Configuration.Files
#  could write the file. None of it was reachable from the shell: a user could
#  only change a setting by editing TOML by hand.

[[case]]
id = "settings.lists-what-there-is"
requirement = """
Every setting, its value, and what it is for. The description is quoted rather
than rendered by the command, so it appears here as its own message key -- which
is what shows that nothing below the presentation boundary turned it into text.
"""
script = "settings; quit (0);"
exit_status = 0
output = [
  "!line.setting{key=color,value=auto,summary=!setting.color!}!",
  "!line.setting{key=history.enabled,value=true,summary=!setting.history-enabled!}!",
  "!line.setting{key=history.limit,value=1000,summary=!setting.history-limit!}!",
  "!line.setting{key=trace.commands,value=false,summary=!setting.trace!}!",
  "!line.setting{key=read.limit,value=16,summary=!setting.read-limit!}!",
  "!line.setting{key=prompt.directory,value=true,summary=!setting.prompt-directory!}!",
  "!line.setting{key=prompt.failure,value=true,summary=!setting.prompt-failure!}!",
  "!line.setting{key=editing.enabled,value=true,summary=!setting.editing!}!",
  "!line.setting{key=startup.session,value=true,summary=!setting.session-file!}!",
  "!line.setting{key=history.per-session,value=false,summary=!setting.history-per-session!}!",
  "!line.setting{key=history.ignore-space,value=true,summary=!setting.history-ignore-space!}!",
  "!line.setting{key=prompt.format,value=,summary=!setting.prompt.format!}!",
  "!line.setting{key=stop.on-failure,value=false,summary=!setting.stop-on-failure!}!",
]
diagnostics = []

[[case]]
id = "settings.changes-one"
requirement = "Naming a setting and a value changes it, and the shell says back what it now holds rather than leaving the user to trust that it took."
script = "settings (\"color\", \"never\"); quit (0);"
exit_status = 0
output = [
  "!line.setting{key=color,value=never,summary=!setting.color!}!",
]
diagnostics = []

[[case]]
id = "settings.refuses-a-value-that-is-not-a-choice"
requirement = "A choice setting takes one of a fixed list, and the refusal names the list so the reader does not have to go and find it."
script = "settings (\"color\", \"purple\"); quit (0);"
exit_status = 0
output = []
diagnostics = [
  "!config.bad-choice{key=color,detail=auto, always, never}!",
]

[[case]]
id = "settings.refuses-a-number-out-of-range"
requirement = "The bounds the registry already carried are what the refusal reports."
script = "settings (\"history.limit\", \"0\"); quit (0);"
exit_status = 0
output = []
diagnostics = [
  "!config.out-of-range{key=history.limit,detail=!config.wants.range{low=1,high=1000000}!}!",
]

[[case]]
id = "settings.refuses-a-name-it-does-not-have"
requirement = """
Its own message rather than the file reader's. That one says the key `was
ignored`, which is true of a line in a file nobody is watching and wrong for
something a user has just typed.
"""
script = "settings (\"nope\", \"x\"); quit (0);"
exit_status = 0
output = []
diagnostics = [
  "!error.setting_unknown{key=nope}!",
]

[[case]]
id = "settings.color-reaches-a-script-too"
requirement = """
`color` says when coloured output is produced, and a script ignored it: the
policy was read and applied where an interactive session starts, and a script
run went on under `auto`. So `color = "never"` still coloured a script run at a
terminal, and `always` coloured nothing when the script was piped -- under a
comment in the main program saying a script gets the user's settings too,
because a script and a session that behaved differently would be two shells.

Run down a pipe, which is what this suite does, `always` is the choice that can
be seen: `auto` produces nothing here whether or not the setting arrives, so it
would pass without the fix. The escape byte is named as a number rather than
written, because an escape in a source file is what `adash_check` refuses.

The file is planted in both places a host looks -- `{store}/adash` and
`{store}/Library/Application Support/adash`. The runner points
`XDG_CONFIG_HOME`, `APPDATA` and `HOME` at the store and each host reads its
own: writing only the first passed on Linux and failed on macOS and Windows,
where the nested shell found no configuration and used the default.
"""
script = "make_directory (\"{store}/adash\");\nmake_directory (\"{store}/Library/Application Support/adash\");\nSaid : String := \"color = \"\"always\"\"\" & Character'Val (10);\nwrite_file (Said, \"{store}/adash/config.toml\");\nwrite_file (Said, \"{store}/Library/Application Support/adash/config.toml\");\nwrite_file (\"run (\"\"/nonesuch-for-colour\"\");\" & Character'Val (10), \"{store}/probe.adash\");\nset (\"XDG_CONFIG_HOME={store}\");\nset (\"HOME={store}\");\nset (\"APPDATA={store}\");\nS : String := All_Of (\"{shell}\", \"{store}/probe.adash\");\nif Index (S, \"\" & Character'Val (27)) = 0 then put_line (\"no colour\"); else put_line (\"coloured\"); end if;\nquit (0);"
exit_status = 0
output = ["coloured"]
diagnostics = []

[[case]]
id = "startup.a-quit-in-a-startup-file-does-not-end-the-session"
requirement = """
A startup file is read while the shell is coming up, so a `quit` in one is a
request nobody is driving yet. Standing, it made every session one submission
long: the loop saw the request before the first line and stopped after it,
reporting the startup file's status rather than the session's. On the script
path it was quieter and still wrong -- the script ran whole and exited with the
startup file's number.

Withdrawn where the startup files finish, beside the rule that was already
written there: whatever happened, the shell comes up. What a `quit` in a startup
file still does is end that file, which is the submission it is in.

Run as a nested shell, because the suite's own session has no startup file, and
planted in both places a host looks: the runner points `XDG_CONFIG_HOME`,
`APPDATA` and `HOME` at the store, and each host reads its own of the three.
"""
script = "make_directory (\"{store}/adash\");\nmake_directory (\"{store}/Library/Application Support/adash\");\nSaid : String := \"quit (7);\" & Character'Val (10) & \"put_line (\"\"must not appear\"\");\" & Character'Val (10);\nwrite_file (Said, \"{store}/adash/startup.adash\");\nwrite_file (Said, \"{store}/Library/Application Support/adash/startup.adash\");\nset (\"XDG_CONFIG_HOME={store}\");\nset (\"HOME={store}\");\nset (\"APPDATA={store}\");\nwrite_file (\"put_line (\"\"one\"\");\" & Character'Val (10) & \"put_line (\"\"two\"\");\" & Character'Val (10) & \"quit (3);\" & Character'Val (10), \"{store}/probe.adash\");\nS : String := Output_Of (\"{shell}\", \"{store}/probe.adash\");\nput_line (\"lines=[\" & Trim (S) & \"] status=\" & Trim (Status'Image));\nquit (0);"
exit_status = 0
output = ["lines=[one", "two] status=3"]
diagnostics = []

[[case]]
id = "settings.the-history-settings-take-effect-at-once"
requirement = """
A change applies in the session it was typed in -- which the configuration
reference has claimed since colour was fixed, and which was true of five
settings and false of four.

`history.enabled`, `editing.enabled`, `history.limit` and
`history.ignore-space` were read once at startup and never again, so turning
`history.ignore-space` off left the next spaced line out of the history anyway.
Colour had exactly this shape and was fixed on its own; the rest were not
looked for, which is how one hole becomes four.

Watched here on the one of the four a script can see: `history` lists what the
session is holding, and the spaced line is in it.

`history.per-session` is deliberately still read once. It chooses *which file*
the log is, and that file was opened and read at startup -- changing it in the
middle would write what this session typed into a file it never read, which is
a different decision from these.
"""
script = "settings (\"history.ignore-space\", \"false\");\n put_line (\"kept\");\nhistory (3);\nquit (0);"
exit_status = 0
output = [
  "!line.setting{key=history.ignore-space,value=false,summary=!setting.history-ignore-space!}!",
  "kept",
  "!line.history_entry{number=1,line=settings (\"history.ignore-space\", \"false\");}!",
  "!line.history_entry{number=2,line= put_line (\"kept\");}!",
  "!line.history_entry{number=3,line=history (3);}!",
]
