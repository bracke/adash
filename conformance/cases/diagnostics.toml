# Diagnostics, compared as identifiers and arguments rather than as sentences.
#
# This is the file that would silently stop testing anything if the suite
# compared English: every one of these lines is a stable identifier that other
# tools, and translations, depend on.

suite = "diagnostics"

[[case]]
id = "diagnostics.undeclared-name"
requirement = "A name that was never declared is reported by name, so the reader does not have to find it."
script = """
zzz;
quit (0);"""
exit_status = 0
output = []
diagnostics = [
  "!error.name_undeclared{name=zzz}!",
]

[[case]]
id = "diagnostics.stay-off-standard-output"
requirement = "Diagnostics go to standard error and never to standard output, so a pipeline reading a shell's output is not fed them."
script = """
zzz;
quit (0);"""
exit_status = 0
output = []

[[case]]
id = "diagnostics.function-call-as-a-statement"
requirement = """
Ada has no expression statement, and neither does this: a call that yields a
value is an expression. Written on its own it computed something and discarded
it, which is more often a forgotten assignment than an intention. A user's
function did exactly that, silently; a predefined one reached the lowering and
was reported as a call this build cannot run, which named a limitation that
does not exist.
"""
script = """
function F (N : Integer) return Integer is begin return N; end F;
F (2);
quit (0);"""
exit_status = 0
output = []
diagnostics = [
  "!error.function_as_statement{name=F}!",
]

[[case]]
id = "diagnostics.value-called-as-a-statement"
requirement = "A name that yields a value without being callable at all is the older complaint, and still the right one."
script = """
X : Integer := 1;
X;
quit (0);"""
exit_status = 0
output = []
diagnostics = [
  "!error.not_callable{name=X}!",
]

[[case]]
id = "diagnostics.bare-name-short-of-arguments"
requirement = """
A subprogram named without the arguments it requires is short of them wherever
the name stands. The statement form, `source;`, said so; the expression form,
`S : String := Env_Value;`, answered with the result type and left the omission
to be discovered by the lowering.
"""
script = """
S : String := Env_Value;
quit (0);"""
exit_status = 0
output = []
diagnostics = [
  "!error.wrong_argument_count{name=Env_Value,expected= 1,found= 0}!",
]

[[case]]
id = "diagnostics.redeclaring-a-name-the-shell-provides"
requirement = """
A name the shell puts in scope is refused as what it is. Nothing declared it, so
there is no position to report: saying "already declared, on line 1" named a
line that had nothing to do with the collision and, in a one-line submission,
was the line being complained about. The message for this case existed and was
reached only for a subprogram named after a predefined subprogram -- never for a
variable, a type name or a command.
"""
script = """
Status : Integer := 1;
quit (0);"""
exit_status = 0
output = []
diagnostics = [
  "!error.name_is_predefined{name=Status}!",
]

[[case]]
id = "diagnostics.redeclaring-a-command"
requirement = "A command is in scope the same way and is refused the same way."
script = """
pwd : Integer := 1;
quit (0);"""
exit_status = 0
output = []
diagnostics = [
  "!error.name_is_predefined{name=pwd}!",
]

[[case]]
id = "diagnostics.a-real-redeclaration-still-names-the-line"
requirement = """
Where there is a first declaration to point at, it is still pointed at: this did
not become one message for two situations. Written on one line because a name
declared by an earlier submission may be redeclared by a later one -- that is
what makes a session a session -- so a collision needs both in the same one.
"""
script = "Total : Integer := 1; Total : Integer := 2; quit (0);"
exit_status = 0
output = []
diagnostics = [
  "!error.name_already_declared{name=Total,line= 1}!",
]

[[case]]
id = "limits.a-recursion-with-no-end-runs-out-of-frames"
requirement = """
Every limit this build has is documented, and a documented limit with no case
is a claim nothing checks. The machine carries 256 frames, so a recursion that
never returns ends as `Storage_Error` -- named, where the program stands, and
with the session still standing afterwards. What it must not do is grow until
the host kills the process.
"""
script = "function Down (N : Integer) return Integer is begin return Down (N + 1); end Down;\nX : Integer := Down (1);\nput_line (\"the session is still here\");\nquit (0);"
exit_status = 0
output = ["the session is still here"]
diagnostics = [
  "!error.program_raised_detail{exception=Storage_Error,detail=!error.machine.too_many_calls!}!",
]

[[case]]
id = "limits.and-nested-handlers-run-out-too"
requirement = """
A handler is a guard the machine writes down on entering a block and takes back
on leaving it, and it carries 256 of them. Two blocks per call and two hundred
calls reach that before the frames run out, which is what this checks: the
limit that fires is the one the program actually exceeded.
"""
script = "procedure Deep (N : Integer) is begin begin begin if N > 0 then Deep (N - 1); end if; exception when Constraint_Error => null; end; exception when Constraint_Error => null; end; end Deep;\nDeep (200);\nput_line (\"still here\");\nquit (0);"
exit_status = 0
output = ["still here"]
diagnostics = [
  "!error.program_raised_detail{exception=Storage_Error,detail=!error.machine.too_many_handlers!}!",
]

[[case]]
id = "limits.and-a-sixteenth-task-is-one-too-many"
requirement = """
Fifteen tasks at once, each with a fixed region of the machine's store, is what
the ROADMAP promises. The sixteenth is refused where it is elaborated rather
than quietly not started -- a task object that holds no strand would be a name
for something that never runs, and a rendezvous with it would wait forever.
"""
script = "task type Waiter; task body Waiter is begin delay 0.30; end Waiter;\nA1 : Waiter; A2 : Waiter; A3 : Waiter; A4 : Waiter; A5 : Waiter; A6 : Waiter; A7 : Waiter; A8 : Waiter; A9 : Waiter; A10 : Waiter; A11 : Waiter; A12 : Waiter; A13 : Waiter; A14 : Waiter; A15 : Waiter; A16 : Waiter;\nquit (0);"
exit_status = 0
diagnostics = [
  "!error.program_raised_detail{exception=Storage_Error,detail=!error.machine.too_many_tasks!}!",
]

[[case]]
id = "limits.and-an-array-longer-than-the-frame-is-refused"
requirement = """
An array is a run of slots in a frame whose size is decided when the program is
built, and 4096 elements is what one may hold. The refusal names the type and
the limit, and it comes from the analyser rather than from the run: a length
known before the program runs is checked before it runs.
"""
script = "type Big is array (1 .. 5000) of Integer;\nquit (0);"
exit_status = 0
diagnostics = [
  "!error.array_too_long{name=Big,limit= 4096}!",
]

[[case]]
id = "diagnostics.a-diagnostic-about-a-file-says-where"
requirement = """
A diagnostic carries a file and a position, and until now nothing printed
either: a script with a mistake on line forty said what was wrong and left the
reader to find it. A file read into another says its own name and its own line,
which the scripting cases assert against the data -- here the path is the
machine's own and only the shape can be pinned. It is written the way every compiler writes one --
path, line, column -- because that is what a person and an editor both already
read.

Only where there is a position to give. A file that could not be read at all,
and a program that raised, have none: what raised is a run rather than a place,
and a position in front of it would point at the first byte of a file that is
not where anything went wrong.
"""
arguments = ["{root}/conformance/fixtures/modules/misspelt.adash"]

# A script the analyser refuses exits 2, which is what makes this a run whose
# diagnostic is worth reading.
exit_status = 2
output = []
diagnostics = [
  "!line.diagnostic_at{path={root}/conformance/fixtures/modules/misspelt.adash,line=6,column=11,text=!error.name_undeclared{name=Nowhere_At_All}!}!",
]
