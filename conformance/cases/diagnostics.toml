# Diagnostics, compared as identifiers and arguments rather than as sentences.
#
# This is the file that would silently stop testing anything if the suite
# compared English: every one of these lines is a stable identifier that other
# tools, and translations, depend on.

suite = "diagnostics"

[[case]]
id = "diagnostics.undeclared-name"
requirement = "A name that was never declared is reported by name, so the reader does not have to find it."
script = """
zzz;
quit (0);"""
exit_status = 0
output = []
diagnostics = [
  "!error.name_undeclared{name=zzz}!",
]

[[case]]
id = "diagnostics.stay-off-standard-output"
requirement = "Diagnostics go to standard error and never to standard output, so a pipeline reading a shell's output is not fed them."
script = """
zzz;
quit (0);"""
exit_status = 0
output = []

[[case]]
id = "diagnostics.function-call-as-a-statement"
requirement = """
Ada has no expression statement, and neither does this: a call that yields a
value is an expression. Written on its own it computed something and discarded
it, which is more often a forgotten assignment than an intention. A user's
function did exactly that, silently; a predefined one reached the lowering and
was reported as a call this build cannot run, which named a limitation that
does not exist.
"""
script = """
function F (N : Integer) return Integer is begin return N; end F;
F (2);
quit (0);"""
exit_status = 0
output = []
diagnostics = [
  "!error.function_as_statement{name=F}!",
]

[[case]]
id = "diagnostics.value-called-as-a-statement"
requirement = "A name that yields a value without being callable at all is the older complaint, and still the right one."
script = """
X : Integer := 1;
X;
quit (0);"""
exit_status = 0
output = []
diagnostics = [
  "!error.not_callable{name=X}!",
]

[[case]]
id = "diagnostics.bare-name-short-of-arguments"
requirement = """
A subprogram named without the arguments it requires is short of them wherever
the name stands. The statement form, `source;`, said so; the expression form,
`S : String := Env_Value;`, answered with the result type and left the omission
to be discovered by the lowering.
"""
script = """
S : String := Env_Value;
quit (0);"""
exit_status = 0
output = []
diagnostics = [
  "!error.wrong_argument_count{name=Env_Value,expected= 1,found= 0}!",
]

[[case]]
id = "diagnostics.redeclaring-a-name-the-shell-provides"
requirement = """
A name the shell puts in scope is refused as what it is. Nothing declared it, so
there is no position to report: saying "already declared, on line 1" named a
line that had nothing to do with the collision and, in a one-line submission,
was the line being complained about. The message for this case existed and was
reached only for a subprogram named after a predefined subprogram -- never for a
variable, a type name or a command.
"""
script = """
Status : Integer := 1;
quit (0);"""
exit_status = 0
output = []
diagnostics = [
  "!error.name_is_predefined{name=Status}!",
]

[[case]]
id = "diagnostics.redeclaring-a-command"
requirement = "A command is in scope the same way and is refused the same way."
script = """
pwd : Integer := 1;
quit (0);"""
exit_status = 0
output = []
diagnostics = [
  "!error.name_is_predefined{name=pwd}!",
]

[[case]]
id = "diagnostics.a-real-redeclaration-points-at-the-first-one"
requirement = """
Where there is a first declaration to point at, it is still pointed at: this did
not become one message for two situations. Written on one line because a name
declared by an earlier submission may be redeclared by a later one -- that is
what makes a session a session -- so a collision needs both in the same one.

The message no longer carries the place. It used to say "on line {line}" and be
handed a *byte offset*, which looked like a line and was one only by accident;
where the first declaration is now travels as a related location, and the
engine gives it a line from the buffer it was analysed in.
"""
script = "Total : Integer := 1; Total : Integer := 2; quit (0);"
exit_status = 0
output = []
diagnostics = [
  "!error.name_already_declared{name=Total}!",
]

[[case]]
id = "limits.a-recursion-with-no-end-runs-out-of-frames"
requirement = """
Every limit this build has is documented, and a documented limit with no case
is a claim nothing checks. The machine carries 256 frames, so a recursion that
never returns ends as `Storage_Error` -- named, where the program stands, and
with the session still standing afterwards. What it must not do is grow until
the host kills the process.
"""
script = "function Down (N : Integer) return Integer is begin return Down (N + 1); end Down;\nX : Integer := Down (1);\nput_line (\"the session is still here\");\nquit (0);"
exit_status = 0
output = ["the session is still here"]
diagnostics = [
  "!error.program_raised_detail{exception=Storage_Error,detail=!error.machine.too_many_calls!}!",
]

[[case]]
id = "limits.and-nested-handlers-run-out-too"
requirement = """
A handler is a guard the machine writes down on entering a block and takes back
on leaving it, and it carries 256 of them. Two blocks per call and two hundred
calls reach that before the frames run out, which is what this checks: the
limit that fires is the one the program actually exceeded.
"""
script = "procedure Deep (N : Integer) is begin begin begin if N > 0 then Deep (N - 1); end if; exception when Constraint_Error => null; end; exception when Constraint_Error => null; end; end Deep;\nDeep (200);\nput_line (\"still here\");\nquit (0);"
exit_status = 0
output = ["still here"]
diagnostics = [
  "!error.program_raised_detail{exception=Storage_Error,detail=!error.machine.too_many_handlers!}!",
]

[[case]]
id = "limits.and-a-sixteenth-task-is-one-too-many"
requirement = """
Fifteen tasks at once, each with a fixed region of the machine's store, is what
the ROADMAP promises. The sixteenth is refused where it is elaborated rather
than quietly not started -- a task object that holds no strand would be a name
for something that never runs, and a rendezvous with it would wait forever.
"""
script = "task type Waiter; task body Waiter is begin delay 0.30; end Waiter;\nA1 : Waiter; A2 : Waiter; A3 : Waiter; A4 : Waiter; A5 : Waiter; A6 : Waiter; A7 : Waiter; A8 : Waiter; A9 : Waiter; A10 : Waiter; A11 : Waiter; A12 : Waiter; A13 : Waiter; A14 : Waiter; A15 : Waiter; A16 : Waiter;\nquit (0);"
exit_status = 0
diagnostics = [
  "!error.program_raised_detail{exception=Storage_Error,detail=!error.machine.too_many_tasks!}!",
]

[[case]]
id = "limits.and-an-array-longer-than-the-frame-is-refused"
requirement = """
An array is a run of slots in a frame whose size is decided when the program is
built, and 4096 elements is what one may hold. The refusal names the type and
the limit, and it comes from the analyser rather than from the run: a length
known before the program runs is checked before it runs.
"""
script = "type Big is array (1 .. 5000) of Integer;\nquit (0);"
exit_status = 0
diagnostics = [
  "!error.array_too_long{name=Big,limit= 4096}!",
]

[[case]]
id = "diagnostics.a-diagnostic-about-a-file-says-where"
requirement = """
A diagnostic carries a file and a position, and until now nothing printed
either: a script with a mistake on line forty said what was wrong and left the
reader to find it. A file read into another says its own name and its own line,
which the scripting cases assert against the data -- here the path is the
machine's own and only the shape can be pinned. It is written the way every compiler writes one --
path, line, column -- because that is what a person and an editor both already
read.

The line itself follows, with a caret under what the diagnostic is about --
measured in terminal cells, so a line holding an accented or a wide character
still carries a caret that points at the right place.

Only where there is a position to give. A file that could not be read at all,
and a program that raised, have none: what raised is a run rather than a place,
and a position in front of it would point at the first byte of a file that is
not where anything went wrong.
"""
arguments = ["{root}/conformance/fixtures/modules/misspelt.adash"]

# A script the analyser refuses exits 2, which is what makes this a run whose
# diagnostic is worth reading.
exit_status = 2
output = []
diagnostics = [
  "!line.diagnostic_at{path={root}/conformance/fixtures/modules/misspelt.adash,line=6,column=11,text=!error.name_undeclared{name=Nowhere_At_All}!}!",
  "put_line (Nowhere_At_All);",
  "          ^~~~~~~~~~~~~~",
]

[[case]]
id = "diagnostics.and-says-where-the-first-one-is"
requirement = """
"X is already declared" is only actionable if the reader is told where the
other one is. The place travels as a related location -- a span the scope chain
knows and a line the engine works out -- and is printed under the diagnostic in
the same form, so a reader can go straight to it.

Where the two declarations are in *different* files, which reading a module in
makes possible, each names its own.
"""
arguments = ["{root}/conformance/fixtures/modules/twice.adash"]
exit_status = 2
diagnostics = [
  "!line.diagnostic_at{path={root}/conformance/fixtures/modules/twice.adash,line=6,column=1,text=!error.name_already_declared{name=Total}!}!",
  "Total : Integer := 2;",
  "^~~~~",
  "!line.diagnostic_at{path={root}/conformance/fixtures/modules/twice.adash,line=4,column=1,text=!note.declared_here!}!",
]

[[case]]
id = "diagnostics.and-an-ambiguity-shows-what-it-could-have-meant"
requirement = """
An ambiguity is the diagnostic a reader can do least with on its own: what they
have to decide is which of the things called that they meant, and they cannot
decide it without seeing them. Every declaration the name could denote is named
under the complaint, innermost first, up to the four a diagnostic carries.
"""
arguments = ["{root}/conformance/fixtures/modules/ambiguous.adash"]
exit_status = 2
diagnostics = [
  "!line.diagnostic_at{path={root}/conformance/fixtures/modules/ambiguous.adash,line=9,column=11,text=!error.ambiguous_call{name=F,count= 2}!}!",
  "put_line (F'Image);",
  "          ^",
  "!line.diagnostic_at{path={root}/conformance/fixtures/modules/ambiguous.adash,line=7,column=10,text=!note.declared_here!}!",
  "!line.diagnostic_at{path={root}/conformance/fixtures/modules/ambiguous.adash,line=5,column=10,text=!note.declared_here!}!",
]

[[case]]
id = "diagnostics.and-a-part-given-twice-points-at-the-first"
requirement = """
The same shape wherever a complaint is about a pair: the second is where the
diagnostic stands and the first is named under it. An aggregate that gives a
component twice is one, and a case choice covering a value an earlier one
covered is another.
"""
arguments = ["{root}/conformance/fixtures/modules/twice-given.adash"]
exit_status = 2
diagnostics = [
  "!line.diagnostic_at{path={root}/conformance/fixtures/modules/twice-given.adash,line=6,column=23,text=!error.part_given_twice{name=X}!}!",
  "P : Point := (X => 1, X => 2, Y => 3);",
  "                      ^~~~~~",
  "!line.diagnostic_at{path={root}/conformance/fixtures/modules/twice-given.adash,line=6,column=15,text=!note.first_here!}!",
]

[[case]]
id = "diagnostics.a-place-in-a-file-a-windows-editor-wrote"
requirement = """
A position counts lines, and a line that ends CR LF must count as one line and
not as one line plus a stray character. The mistake is on line five of
`crlf-faulty.adash`, at column eleven, and the quoted line under the diagnostic
must come back without the carriage return that ended it: a terminal given one
returns the cursor to the start of the line, which would draw the caret over
the quote instead of under it.
"""
arguments = ["{root}/conformance/fixtures/crlf-faulty.adash"]
exit_status = 2
output = []
diagnostics = [
  "!line.diagnostic_at{path={root}/conformance/fixtures/crlf-faulty.adash,line=5,column=11,text=!error.name_undeclared{name=Missing}!}!",
  "put_line (Missing);",
  "          ^~~~~~~",
]

[[case]]
id = "diagnostics.a-procedure-where-a-value-was-wanted"
requirement = """
A procedure yields nothing, so a program that writes one where a value belongs
has made a mistake -- and for as long as this language existed it was told so
only when the procedure stood alone. Written inside an operator it was told
nothing at all: the analyser noted the operand's type as unknown, the rule that
keeps one unknown type from producing a complaint per operator it flows through
kept quiet, the submission was refused, and the shell exited 2 having printed
nothing. An exit status with no reason beside it is the worst answer a shell can
give.

Said about the name, because that is what a user has to change, and at the name
rather than at the operator.
"""
script = "X : String := \"a\" & New_Line;"
exit_status = 0
output = []
diagnostics = ["!error.procedure_has_no_value{name=New_Line}!"]

[[case]]
id = "diagnostics.a-procedure-called-where-a-value-was-wanted"
requirement = """
The same mistake in its other form, where the procedure is given arguments. The
answer is the same and names the same thing.

A statement is where a procedure belongs, and `put_line ("x");` is not this: a
call as a statement is analysed knowing that a callee yielding nothing is what
it wants, which is why the check reads the context rather than the call.
"""
script = "X : Integer := 1 + Put_Line (\"x\");"
exit_status = 0
output = []
diagnostics = ["!error.procedure_has_no_value{name=Put_Line}!"]

[[case]]
id = "diagnostics.a-procedure-alone-says-the-same-thing"
requirement = """
And standing by itself, which used to reach the lowering and come back as a
construct this build could not lower, naming an empty type. What is wrong with
the program is the same thing in all three places, so it is said the same way.
"""
script = "X : String := New_Line;"
exit_status = 0
output = []
diagnostics = ["!error.procedure_has_no_value{name=New_Line}!"]

[[case]]
id = "lexical.a-character-that-belongs-to-no-token"
requirement = """
A character the language has no use for is named where it stands, and what
follows it is read as best it can be -- so one stray character produces one
complaint about the character and one about the shape of what is left, rather
than a cascade.

These are the diagnostics a user meets by mistyping, and until now none of them
had a case: they were reachable, documented, translated, and never once produced
by anything that runs.

The tail is asserted rather than trimmed. One stray character costs four
complaints -- the parser tries the line as an expression, as a statement, and as
the end of one -- and a case that expected only the first would have let the
other three change without anybody noticing.
"""
script = "put_line (\"a\" # \"b\");"
exit_status = 0
output = []
diagnostics = [
  "!error.lexical.stray_character{character=#}!",
  "!error.syntax.unexpected{found=\"b\",expected=)}!",
  "!error.syntax.unexpected{found=\"b\",expected=;}!",
  "!error.syntax.unexpected{found=\"b\",expected=!expected.statement!}!",
]

[[case]]
id = "lexical.a-character-literal-that-is-not-one-character"
requirement = """
`'ab'` is not a character literal, and saying so where it is written is better
than reading it as a quote and then complaining about everything after it.
"""
script = "X : Character := 'ab';\nquit (0);"
exit_status = 0
output = []
diagnostics = [
  "!error.lexical.unterminated_character!",
  "!error.syntax.unexpected{found=;,expected=!expected.attribute_name!}!",
]

[[case]]
id = "lexical.a-number-with-letters-in-it"
requirement = """
`12ab` is not a number and is not two tokens: a lexer that stopped at `12` would
hand the parser an identifier `ab` and a puzzle. It is named whole, as it was
written.
"""
script = "X : Integer := 12ab;\nquit (0);"
exit_status = 0
output = []
diagnostics = [
  "!error.lexical.malformed_number{text=12ab}!",
  "!error.syntax.unexpected{found=;,expected=!expected.expression!}!",
]

[[case]]
id = "lexical.an-identifier-ada-would-not-accept"
requirement = """
A trailing underscore and a doubled one are both identifiers Ada rejects, and
this language is Ada: accepting them here would take a program a real compiler
refuses, which is the one thing this shell must not do.
"""
script = "X_ : Integer := 1;\nY__Z : Integer := 2;\nquit (0);"
exit_status = 0
output = []
diagnostics = [
  "!error.lexical.malformed_identifier{text=X_}!",
  "!error.syntax.unexpected{found=:,expected=!expected.statement!}!",
  "!error.lexical.malformed_identifier{text=Y__Z}!",
  "!error.syntax.unexpected{found=:,expected=!expected.statement!}!",
]

[[case]]
id = "lexical.a-doubled-quote-inside-an-interpolated-literal"
requirement = """
Ada 2022 forbids a doubled quote inside an interpolated literal outright -- the
escape is what puts a quote in one -- so accepting it would take a program a
real compiler rejects.
"""
script = "put_line (f\"a \"\" b\");"
exit_status = 0
output = []
diagnostics = [
  "!error.lexical.quote_in_interpolation!",
  "!error.lexical.unterminated_string!",
  "!error.syntax.missing{expected=)}!",
  "!error.syntax.missing{expected=;}!",
]

[[case]]
id = "lexical.a-brace-that-closes-nothing"
requirement = """
A `}` in an interpolated literal that closes nothing would read as the end of an
expression that never began.
"""
script = "put_line (f\"closes } nothing\");"
exit_status = 0
output = []
diagnostics = [
  "!error.lexical.brace_unescaped!",
  "!error.lexical.unterminated_string!",
  "!error.syntax.missing{expected=)}!",
  "!error.syntax.missing{expected=;}!",
]

[[case]]
id = "syntax.and-and-or-without-brackets"
requirement = """
`a and b or c` means different things in different languages, so Ada makes you
say which you meant. Refusing it is not pedantry: the two readings differ, and a
shell that picked one would be a shell whose conditions mean something other
than they look like.
"""
script = "if true and false or true then null; end if;\nquit (0);"
exit_status = 0
output = []
diagnostics = [
  "!error.syntax.mixed_logical{first=and,second=or}!",
  "!error.syntax.unexpected{found=true,expected=then}!",
]

[[case]]
id = "subprograms.a-function-must-return-something"
requirement = """
A bare `return` in a function is a function that promised a value and did not
produce one.
"""
script = "function F return Integer is begin return; end F;\nquit (0);"
exit_status = 0
output = []
diagnostics = ["!error.return_without_value!"]

[[case]]
id = "types.a-name-that-is-not-a-record-has-no-components"
requirement = """
Asking an array for a component by name is a mistake the shape of the value
settles, and the diagnostic names both the component asked for and what was
found instead.
"""
script = "type A is array (1 .. 2) of Integer; X : A; put_line (X.A'Image);\nquit (0);"
exit_status = 0
output = []
diagnostics = ["!error.not_a_record{name=A,found=A}!"]

