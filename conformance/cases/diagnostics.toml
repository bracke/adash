# Diagnostics, compared as identifiers and arguments rather than as sentences.
#
# This is the file that would silently stop testing anything if the suite
# compared English: every one of these lines is a stable identifier that other
# tools, and translations, depend on.

suite = "diagnostics"

[[case]]
id = "diagnostics.undeclared-name"
requirement = "A name that was never declared is reported by name, so the reader does not have to find it."
script = """
zzz;
quit (0);"""
exit_status = 0
output = []
diagnostics = [
  "!error.name_undeclared{name=zzz}!",
]

[[case]]
id = "diagnostics.stay-off-standard-output"
requirement = "Diagnostics go to standard error and never to standard output, so a pipeline reading a shell's output is not fed them."
script = """
zzz;
quit (0);"""
exit_status = 0
output = []

[[case]]
id = "diagnostics.function-call-as-a-statement"
requirement = """
Ada has no expression statement, and neither does this: a call that yields a
value is an expression. Written on its own it computed something and discarded
it, which is more often a forgotten assignment than an intention. A user's
function did exactly that, silently; a predefined one reached the lowering and
was reported as a call this build cannot run, which named a limitation that
does not exist.
"""
script = """
function F (N : Integer) return Integer is begin return N; end F;
F (2);
quit (0);"""
exit_status = 0
output = []
diagnostics = [
  "!error.function_as_statement{name=F}!",
]

[[case]]
id = "diagnostics.value-called-as-a-statement"
requirement = "A name that yields a value without being callable at all is the older complaint, and still the right one."
script = """
X : Integer := 1;
X;
quit (0);"""
exit_status = 0
output = []
diagnostics = [
  "!error.not_callable{name=X}!",
]

[[case]]
id = "diagnostics.bare-name-short-of-arguments"
requirement = """
A subprogram named without the arguments it requires is short of them wherever
the name stands. The statement form, `source;`, said so; the expression form,
`S : String := Env_Value;`, answered with the result type and left the omission
to be discovered by the lowering.
"""
script = """
S : String := Env_Value;
quit (0);"""
exit_status = 0
output = []
diagnostics = [
  "!error.wrong_argument_count{name=Env_Value,expected=1,found=0}!",
]

[[case]]
id = "diagnostics.redeclaring-a-name-the-shell-provides"
requirement = """
A name the shell puts in scope is refused as what it is. Nothing declared it, so
there is no position to report: saying "already declared, on line 1" named a
line that had nothing to do with the collision and, in a one-line submission,
was the line being complained about. The message for this case existed and was
reached only for a subprogram named after a predefined subprogram -- never for a
variable, a type name or a command.
"""
script = """
Status : Integer := 1;
quit (0);"""
exit_status = 0
output = []
diagnostics = [
  "!error.name_is_predefined{name=Status}!",
]

[[case]]
id = "diagnostics.redeclaring-a-command"
requirement = "A command is in scope the same way and is refused the same way."
script = """
pwd : Integer := 1;
quit (0);"""
exit_status = 0
output = []
diagnostics = [
  "!error.name_is_predefined{name=pwd}!",
]

[[case]]
id = "diagnostics.a-real-redeclaration-points-at-the-first-one"
requirement = """
Where there is a first declaration to point at, it is still pointed at: this did
not become one message for two situations. Written on one line because a name
declared by an earlier submission may be redeclared by a later one -- that is
what makes a session a session -- so a collision needs both in the same one.

The message no longer carries the place. It used to say "on line {line}" and be
handed a *byte offset*, which looked like a line and was one only by accident;
where the first declaration is now travels as a related location, and the
engine gives it a line from the buffer it was analysed in.
"""
script = "Total : Integer := 1; Total : Integer := 2; quit (0);"
exit_status = 2
output = []
diagnostics = [
  "!error.name_already_declared{name=Total}!",
]

[[case]]
id = "limits.a-recursion-with-no-end-runs-out-of-frames"
requirement = """
Every limit this build has is documented, and a documented limit with no case
is a claim nothing checks. The machine carries 256 frames, so a recursion that
never returns ends as `Storage_Error` -- named, where the program stands, and
with the session still standing afterwards. What it must not do is grow until
the host kills the process.
"""
script = "function Down (N : Integer) return Integer is begin return Down (N + 1); end Down;\nX : Integer := Down (1);\nput_line (\"the session is still here\");\nquit (0);"
exit_status = 0
output = ["the session is still here"]
diagnostics = [
  "!error.program_raised_detail{exception=Storage_Error,detail=!error.machine.too_many_calls!}!",
]

[[case]]
id = "limits.and-nested-handlers-run-out-too"
requirement = """
A handler is a guard the machine writes down on entering a block and takes back
on leaving it, and it carries 256 of them. Two blocks per call and two hundred
calls reach that before the frames run out, which is what this checks: the
limit that fires is the one the program actually exceeded.
"""
script = "procedure Deep (N : Integer) is begin begin begin if N > 0 then Deep (N - 1); end if; exception when Constraint_Error => null; end; exception when Constraint_Error => null; end; end Deep;\nDeep (200);\nput_line (\"still here\");\nquit (0);"
exit_status = 0
output = ["still here"]
diagnostics = [
  "!error.program_raised_detail{exception=Storage_Error,detail=!error.machine.too_many_handlers!}!",
]

[[case]]
id = "limits.and-a-sixteenth-task-is-one-too-many"
requirement = """
Fifteen tasks at once, each with a fixed region of the machine's store, is what
the ROADMAP promises. The sixteenth is refused where it is elaborated rather
than quietly not started -- a task object that holds no strand would be a name
for something that never runs, and a rendezvous with it would wait forever.
"""
script = "task type Waiter; task body Waiter is begin delay 0.30; end Waiter;\nA1 : Waiter; A2 : Waiter; A3 : Waiter; A4 : Waiter; A5 : Waiter; A6 : Waiter; A7 : Waiter; A8 : Waiter; A9 : Waiter; A10 : Waiter; A11 : Waiter; A12 : Waiter; A13 : Waiter; A14 : Waiter; A15 : Waiter; A16 : Waiter;\nquit (0);"
exit_status = 0
diagnostics = [
  "!error.program_raised_detail{exception=Storage_Error,detail=!error.machine.too_many_tasks!}!",
]

[[case]]
id = "limits.and-an-array-longer-than-the-frame-is-refused"
requirement = """
An array is a run of slots in a frame whose size is decided when the program is
built, and 4096 elements is what one may hold. The refusal names the type and
the limit, and it comes from the analyser rather than from the run: a length
known before the program runs is checked before it runs.
"""
script = "type Big is array (1 .. 5000) of Integer;\nquit (0);"
exit_status = 0
diagnostics = [
  "!error.array_too_long{name=Big,limit=4096}!",
]

[[case]]
id = "diagnostics.a-diagnostic-about-a-file-says-where"
requirement = """
A diagnostic carries a file and a position, and until now nothing printed
either: a script with a mistake on line forty said what was wrong and left the
reader to find it. A file read into another says its own name and its own line,
which the scripting cases assert against the data -- here the path is the
machine's own and only the shape can be pinned. It is written the way every compiler writes one --
path, line, column -- because that is what a person and an editor both already
read.

The line itself follows, with a caret under what the diagnostic is about --
measured in terminal cells, so a line holding an accented or a wide character
still carries a caret that points at the right place.

Only where there is a position to give. A file that could not be read at all,
and a program that raised, have none: what raised is a run rather than a place,
and a position in front of it would point at the first byte of a file that is
not where anything went wrong.
"""
arguments = ["{root}/conformance/fixtures/modules/misspelt.adash"]

# A script the analyser refuses exits 2, which is what makes this a run whose
# diagnostic is worth reading.
exit_status = 2
output = []
diagnostics = [
  "!line.diagnostic_at{path={root}/conformance/fixtures/modules/misspelt.adash,line=6,column=11,text=!error.name_undeclared{name=Nowhere_At_All}!}!",
  "put_line (Nowhere_At_All);",
  "          ^~~~~~~~~~~~~~",
]

[[case]]
id = "diagnostics.and-says-where-the-first-one-is"
requirement = """
"X is already declared" is only actionable if the reader is told where the
other one is. The place travels as a related location -- a span the scope chain
knows and a line the engine works out -- and is printed under the diagnostic in
the same form, so a reader can go straight to it.

Where the two declarations are in *different* files, which reading a module in
makes possible, each names its own.
"""
arguments = ["{root}/conformance/fixtures/modules/twice.adash"]
exit_status = 2
diagnostics = [
  "!line.diagnostic_at{path={root}/conformance/fixtures/modules/twice.adash,line=6,column=1,text=!error.name_already_declared{name=Total}!}!",
  "Total : Integer := 2;",
  "^~~~~",
  "!line.diagnostic_at{path={root}/conformance/fixtures/modules/twice.adash,line=4,column=1,text=!note.declared_here!}!",
]

[[case]]
id = "diagnostics.and-an-ambiguity-shows-what-it-could-have-meant"
requirement = """
An ambiguity is the diagnostic a reader can do least with on its own: what they
have to decide is which of the things called that they meant, and they cannot
decide it without seeing them. Every declaration the name could denote is named
under the complaint, innermost first, up to the four a diagnostic carries.
"""
arguments = ["{root}/conformance/fixtures/modules/ambiguous.adash"]
exit_status = 2
diagnostics = [
  "!line.diagnostic_at{path={root}/conformance/fixtures/modules/ambiguous.adash,line=9,column=11,text=!error.ambiguous_call{name=F,count=2}!}!",
  "put_line (F'Image);",
  "          ^",
  "!line.diagnostic_at{path={root}/conformance/fixtures/modules/ambiguous.adash,line=7,column=10,text=!note.declared_here!}!",
  "!line.diagnostic_at{path={root}/conformance/fixtures/modules/ambiguous.adash,line=5,column=10,text=!note.declared_here!}!",
]

[[case]]
id = "diagnostics.and-a-part-given-twice-points-at-the-first"
requirement = """
The same shape wherever a complaint is about a pair: the second is where the
diagnostic stands and the first is named under it. An aggregate that gives a
component twice is one, and a case choice covering a value an earlier one
covered is another.
"""
arguments = ["{root}/conformance/fixtures/modules/twice-given.adash"]
exit_status = 2
diagnostics = [
  "!line.diagnostic_at{path={root}/conformance/fixtures/modules/twice-given.adash,line=6,column=23,text=!error.part_given_twice{name=X}!}!",
  "P : Point := (X => 1, X => 2, Y => 3);",
  "                      ^~~~~~",
  "!line.diagnostic_at{path={root}/conformance/fixtures/modules/twice-given.adash,line=6,column=15,text=!note.first_here!}!",
]

[[case]]
id = "diagnostics.a-place-in-a-file-a-windows-editor-wrote"
requirement = """
A position counts lines, and a line that ends CR LF must count as one line and
not as one line plus a stray character. The mistake is on line five of
`crlf-faulty.adash`, at column eleven, and the quoted line under the diagnostic
must come back without the carriage return that ended it: a terminal given one
returns the cursor to the start of the line, which would draw the caret over
the quote instead of under it.
"""
arguments = ["{root}/conformance/fixtures/crlf-faulty.adash"]
exit_status = 2
output = []
diagnostics = [
  "!line.diagnostic_at{path={root}/conformance/fixtures/crlf-faulty.adash,line=5,column=11,text=!error.name_undeclared{name=Missing}!}!",
  "put_line (Missing);",
  "          ^~~~~~~",
]

[[case]]
id = "diagnostics.a-procedure-where-a-value-was-wanted"
requirement = """
A procedure yields nothing, so a program that writes one where a value belongs
has made a mistake -- and for as long as this language existed it was told so
only when the procedure stood alone. Written inside an operator it was told
nothing at all: the analyser noted the operand's type as unknown, the rule that
keeps one unknown type from producing a complaint per operator it flows through
kept quiet, the submission was refused, and the shell exited 2 having printed
nothing. An exit status with no reason beside it is the worst answer a shell can
give.

Said about the name, because that is what a user has to change, and at the name
rather than at the operator.
"""
script = "X : String := \"a\" & New_Line;"
exit_status = 2
output = []
diagnostics = ["!error.procedure_has_no_value{name=New_Line}!"]

[[case]]
id = "diagnostics.a-procedure-called-where-a-value-was-wanted"
requirement = """
The same mistake in its other form, where the procedure is given arguments. The
answer is the same and names the same thing.

A statement is where a procedure belongs, and `put_line ("x");` is not this: a
call as a statement is analysed knowing that a callee yielding nothing is what
it wants, which is why the check reads the context rather than the call.
"""
script = "X : Integer := 1 + Put_Line (\"x\");"
exit_status = 2
output = []
diagnostics = ["!error.procedure_has_no_value{name=Put_Line}!"]

[[case]]
id = "diagnostics.a-procedure-alone-says-the-same-thing"
requirement = """
And standing by itself, which used to reach the lowering and come back as a
construct this build could not lower, naming an empty type. What is wrong with
the program is the same thing in all three places, so it is said the same way.
"""
script = "X : String := New_Line;"
exit_status = 2
output = []
diagnostics = ["!error.procedure_has_no_value{name=New_Line}!"]

[[case]]
id = "lexical.a-character-that-belongs-to-no-token"
requirement = """
A character the language has no use for is named where it stands, once.

These are the diagnostics a user meets by mistyping, and until now none of them
had a case: they were reachable, documented, translated, and never once produced
by anything that runs.

The tail is asserted rather than trimmed, and the tail is now empty: a
submission the scanner complained about is not parsed, because whatever the
parser makes of tokens it was already told are wrong is not something a reader
can act on. This case used to expect four complaints for one stray character --
the parser tried the line as an expression, as a statement, and as the end of
one -- and the three after the first named the byte *following* the mistake,
which is not where the mistake is.
"""
script = "put_line (\"a\" # \"b\");"
exit_status = 2
output = []
diagnostics = ["!error.lexical.stray_character{character=#}!"]

[[case]]
id = "lexical.a-character-literal-that-is-not-one-character"
requirement = """
`'ab'` is not a character literal, and saying so where it is written is better
than reading it as a quote and then complaining about everything after it.
"""
script = "X : Character := 'ab';\nquit (0);"
exit_status = 0
output = []
diagnostics = ["!error.lexical.unterminated_character!"]

[[case]]
id = "lexical.a-number-with-letters-in-it"
requirement = """
`12ab` is not a number and is not two tokens: a lexer that stopped at `12` would
hand the parser an identifier `ab` and a puzzle. It is named whole, as it was
written.
"""
script = "X : Integer := 12ab;\nquit (0);"
exit_status = 0
output = []
diagnostics = ["!error.lexical.malformed_number{text=12ab}!"]

[[case]]
id = "lexical.an-identifier-ada-would-not-accept"
requirement = """
A trailing underscore and a doubled one are both identifiers Ada rejects, and
this language is Ada: accepting them here would take a program a real compiler
refuses, which is the one thing this shell must not do.
"""
script = "X_ : Integer := 1;\nY__Z : Integer := 2;\nquit (0);"
exit_status = 0
output = []
diagnostics = [
  "!error.lexical.malformed_identifier{text=X_}!",
  "!error.lexical.malformed_identifier{text=Y__Z}!",
]

[[case]]
id = "lexical.a-doubled-quote-inside-an-interpolated-literal"
requirement = """
Ada 2022 forbids a doubled quote inside an interpolated literal outright -- the
escape is what puts a quote in one -- so accepting it would take a program a
real compiler rejects.

Refused, and then read as the quote it was meant to be, so that the literal
still ends at its closing quote. Abandoning it there left the rest of the line
to be scanned as code, and the closing quote opened a literal of its own: one
mistyped byte came back as an unterminated string, a missing bracket and a
missing semicolon, none of which the user had written.
"""
script = "put_line (f\"a \"\" b\");"
exit_status = 2
output = []
diagnostics = ["!error.lexical.quote_in_interpolation!"]

[[case]]
id = "lexical.a-literal-that-is-never-closed"
requirement = """
A literal ends at the end of its line, as Ada's does, and one that has not been
closed by then is said so where it began.

Its own case because it used to be produced only as the *second* complaint
about something else -- an unescaped brace, a doubled quote, an escape this
language does not define -- and when those learned to carry on scanning the
literal, the one diagnostic that is really about an unclosed literal stopped
being produced by anything at all.
"""
script = "put_line (\"a);\nquit (0);"
exit_status = 0
output = []
diagnostics = ["!error.lexical.unterminated_string!"]

[[case]]
id = "lexical.a-brace-that-closes-nothing"
requirement = """
A `}` in an interpolated literal that closes nothing would read as the end of an
expression that never began. It is named, and then taken as the character it
looks like, so the literal ends where its closing quote is and the line is not
re-read as something the user did not write.

Nothing runs: the line prints nothing, because a submission the scanner
complained about is one whose text is not the program its author meant.
"""
script = "put_line (f\"closes } nothing\");"
exit_status = 2
output = []
diagnostics = ["!error.lexical.brace_unescaped!"]

[[case]]
id = "syntax.and-and-or-without-brackets"
requirement = """
`a and b or c` means different things in different languages, so Ada makes you
say which you meant. Refusing it is not pedantry: the two readings differ, and a
shell that picked one would be a shell whose conditions mean something other
than they look like.
"""
script = "if true and false or true then null; end if;\nquit (0);"
exit_status = 0
output = []
diagnostics = [
  "!error.syntax.mixed_logical{first=and,second=or}!",
  "!error.syntax.unexpected{found=true,expected=then}!",
]

[[case]]
id = "subprograms.a-function-must-return-something"
requirement = """
A bare `return` in a function is a function that promised a value and did not
produce one.
"""
script = "function F return Integer is begin return; end F;\nquit (0);"
exit_status = 0
output = []
diagnostics = ["!error.return_without_value!"]

[[case]]
id = "types.a-name-that-is-not-a-record-has-no-components"
requirement = """
Asking an array for a component by name is a mistake the shape of the value
settles, and the diagnostic names both the component asked for and what was
found instead.
"""
script = "type A is array (1 .. 2) of Integer; X : A; put_line (X.A'Image);\nquit (0);"
exit_status = 0
output = []
diagnostics = ["!error.not_a_record{name=A,found=A}!"]


[[case]]
id = "history.a-script-has-no-history-to-ask-about"
requirement = """
A script is not a session: nothing it runs was typed, so there is no log to list
and nothing to forget. Both commands say so rather than reporting an empty
history, which would be a different thing -- a session that recorded nothing is
not a session that cannot record.
"""
arguments = ["{root}/conformance/fixtures/asks-for-history.adash"]
exit_status = 0
output = []
diagnostics = [
  "!error.no_history_here!",
  "!error.no_history_here!",
]

[[case]]
id = "commands.a-program-this-host-will-not-run"
requirement = """
A path that names a directory, or a file without the bit that makes it a
program, is refused with the name that was asked for. The host decides, and it
does not say which of the two it was -- so neither does this.

Two hosts: what Windows makes of a directory here is its own business and is not
this case's claim.
"""
script = "run (\"{store}\");"
exit_status = 0
output = []
diagnostics = ["!error.command_denied{command={store}}!"]
platforms = ["linux", "macos"]

[[case]]
id = "lexical.one-character-is-one-complaint-even-outside-ascii"
requirement = """
A character the language has no use for costs one complaint, whatever it is
made of. Outside ASCII a character is two, three or four bytes, and stepping a
byte at a time said the same thing three times about one invisible character
somebody had pasted.

It is named by number when it cannot be shown. `U+00A0 does not begin anything
the language recognises` is something a reader can search for; the character
itself renders as a space or as nothing at all, and the sentence then reads as
if a word were missing from it.

The script below holds a real non-breaking space between `1` and `+`. It is
invisible in an editor, which is the whole point of the case: a person changing
this file must not tidy it away.
"""
script = "X : Integer := 1 + 2;"
exit_status = 2
output = []
diagnostics = ["!error.lexical.stray_character{character=U+00A0}!"]

[[case]]
id = "scripts.a-mark-in-the-middle-of-a-script-is-still-refused"
requirement = """
The other half of the case below: a byte-order mark is skipped where a file
begins and nowhere else. In the middle of a program it is a zero-width space
somebody pasted, and a program with an invisible character in it is refused
rather than run with the character quietly dropped.
"""
arguments = ["{root}/conformance/fixtures/has-a-mark-inside.adash"]
exit_status = 2
output = []
diagnostics = [
  "!line.diagnostic_at{path={root}/conformance/fixtures/has-a-mark-inside.adash,line=2,column=1,text=!error.lexical.stray_character{character=U+FEFF}!}!",
  "﻿put_line (\"two\");",
  "^",
]

[[case]]
id = "scripts.a-script-that-starts-with-a-byte-order-mark-runs"
requirement = """
A byte-order mark at the start of a script is skipped rather than read as a
character. It is what a Windows editor writes when it saves as UTF-8, so it
arrives on files nobody edited by hand, and it is not something the author
typed: the script was refused for a stray character invisible in every editor
that produced it, at column 1 of a line that looked perfectly ordinary. GNAT
compiles a source that begins with one without remark, and this language is
Ada.

Only at the very start. A mark in the middle of a program is a zero-width space
somebody pasted, which is a real mistake and is still refused.
"""
arguments = ["{root}/conformance/fixtures/starts-with-a-bom.adash"]
exit_status = 0
output = ["a script that starts with a byte-order mark runs"]
diagnostics = []

[[case]]
id = "scripts.a-script-that-is-not-utf-8-is-refused"
requirement = """
A script this shell cannot read as UTF-8 is refused with the offset of the byte
that settled it, rather than run with the text guessed at. A file written in
Latin-1 is the ordinary way to meet this -- one accented character, one byte
that no UTF-8 sequence begins with -- and guessing would run a program whose
strings are not what its author typed.
"""
arguments = ["{root}/conformance/fixtures/not-utf8.adash"]
exit_status = 2
output = []
diagnostics = ["!error.source_invalid_encoding{source={root}/conformance/fixtures/not-utf8.adash,offset=16}!"]

[[case]]
id = "files.a-file-that-cannot-be-written-says-so"
requirement = """
A write the host refuses is reported with the path, and the script carries on to
be told so -- `write_file` is a command, and a command that fails is a status
rather than an end.

The directory is made unwritable by the mask rather than by a permission command,
because this shell has no permission command: `umask ("777")` takes every bit
away from what is created next, which is what the mask is for and is the only
way a script can arrange this for itself. Restored afterwards, or every file the
rest of this case wrote would be unreadable too.

POSIX only: Windows has no creation mask, and no way for a script to make a
directory it cannot write.
"""
script = "cd (\"{store}\"); umask (\"777\"); make_directory (\"locked\"); umask (\"22\"); write_file (\"text\", \"locked/f.txt\");"
exit_status = 0
output = []
diagnostics = ["!error.file_write_failed{path=locked/f.txt}!"]
platforms = ["linux", "macos"]

[[case]]
id = "types.an-array-with-no-elements-is-refused"
requirement = """
`array (5 .. 1)` names a type with nothing in it. Ada allows an empty range and
this shell does not: a shell array exists to be walked, and one that cannot be
is a mistake somebody made writing the bounds down rather than a thing they
wanted.
"""
script = "type A is array (5 .. 1) of Integer;"
exit_status = 2
output = []
diagnostics = ["!error.array_is_empty{name=A}!"]

[[case]]
id = "subprograms.nesting-has-a-floor-and-it-is-said"
requirement = """
Subprograms nest twenty deep and no further, and the twenty-first is refused by
name rather than left to run out of stack somewhere in the analyser or the
lowering -- both of which recurse once per level, so what a user would otherwise
see is the shell dying without a word.

The number is `Adash.Language.Max_Nesting`. This case carries twenty-one so that
a change to the limit is a change to this case as well.

One complaint, naming the subprogram that is one too deep. The program is
well formed Ada apart from its depth, which is the only thing this case is
about: an earlier version of it left every level without its `begin`, and the
twenty-two syntax complaints that came back were read as the cost of the limit
rather than as the cost of the mistake in the case.
"""
script = "procedure P0 is procedure P1 is procedure P2 is procedure P3 is procedure P4 is procedure P5 is procedure P6 is procedure P7 is procedure P8 is procedure P9 is procedure P10 is procedure P11 is procedure P12 is procedure P13 is procedure P14 is procedure P15 is procedure P16 is procedure P17 is procedure P18 is procedure P19 is procedure P20 is begin null; end P20; begin null; end P19; begin null; end P18; begin null; end P17; begin null; end P16; begin null; end P15; begin null; end P14; begin null; end P13; begin null; end P12; begin null; end P11; begin null; end P10; begin null; end P9; begin null; end P8; begin null; end P7; begin null; end P6; begin null; end P5; begin null; end P4; begin null; end P3; begin null; end P2; begin null; end P1; begin null; end P0;"
exit_status = 2
output = []
diagnostics = [
  "!error.nested_subprogram{name=P19}!",
]

[[case]]
id = "files.a-file-over-the-read-limit-is-refused-whole"
requirement = """
`read.limit` is what stops a script reading a file that does not fit in memory,
and a file over it is refused whole rather than truncated: half a configuration
file is worse than none, because it parses.

The file is built by doubling a string sixteen times rather than shipped as a
fixture -- two megabytes in a repository to prove a bound is two megabytes
somebody clones for ever -- and the limit is lowered to one megabyte so that the
case costs a moment rather than a minute.
"""
script = "cd (\"{store}\"); settings (\"read.limit\", \"1\");\nX : String := \"aaaaaaaaaaaaaaaa\"; for I in 1 .. 17 loop X := X & X; end loop; write_file (X, \"big.txt\"); Y : String := Read_File (\"big.txt\"); put_line (Trim (Y'Length'Image));"
exit_status = 0
output = [
  "!line.setting{key=read.limit,value=1,summary=!setting.read-limit!}!",
  "0",
]
diagnostics = ["!error.file_too_large{path=big.txt}!"]

[[case]]
id = "lexical.a-bracket-is-named-for-what-it-opens"
requirement = """
Ada 2022 writes an aggregate `[1, 2, 3]` and this language writes the
parenthesised form. A reader who typed the other one is not making a stray
mark, and being told the bracket begins nothing leaves them to work out which
of the two forms the language wants.
"""
script = "A : array (1 .. 3) of Integer := [1, 2, 3];"
exit_status = 2
output = []
diagnostics = [
  "!error.lexical.bracket_aggregate{character=[}!",
  "!error.lexical.bracket_aggregate{character=]}!",
]

[[case]]
id = "syntax.a-repaired-parse-does-not-run"
requirement = """
`put_line ("a") put_line ("b")` is Ada without the semicolon between the two
calls. The parser says so, and it used to say so *after* printing both lines
and reporting success -- the recovery that lets a reader see more than one
mistake per submission also let the submission run, because a repaired parse
left no error node and an error node is what stops one.

Every other way a parse can go wrong already refuses the whole submission. This
one does too now: nothing runs, and the status says the submission was not
understood.
"""
script = "put_line (\"a\") put_line (\"b\");"
exit_status = 2
output = []
diagnostics = [
  "!error.syntax.unexpected{found=put_line,expected=;}!",
]

[[case]]
id = "diagnostics.a-refused-declaration-is-still-a-name"
requirement = """
One mistake, one complaint, and the name the reader wrote goes on meaning
something for the rest of the submission.

`type R is record A : Nope; end record;` names a type nothing declares. That is
reported. The declaration is then refused -- and the name was left undeclared
too, so `V : R;` came back with `R is not declared` about a name the reader can
see they wrote, once for every use. A refused type is now declared under a type
nobody knows, which is the truth about it, and nothing downstream asks it
anything.

One submission, which is what this is about. Nothing carries: a submission the
analyser refused leaves the session as it found it, so by the next submission
the name really is gone and `R is not declared` is then the truth.

`abort V` is the other half. A name declared under a type that did not resolve
is not a task, and saying so answers a question the reader did not ask.
"""
script = "type R is record A : Nope; end record; V : R; W : R; X : Nope; abort X; X (1); use X; raise X;"
exit_status = 2
output = []
diagnostics = [
  "!error.name_undeclared{name=Nope}!",
  "!error.name_undeclared{name=Nope}!",
]

[[case]]
id = "diagnostics.a-name-that-is-fine-is-still-judged"
requirement = """
The silence above is earned by a declaration that already failed, and by
nothing else. A name whose declaration is sound answers for what it is, at
every place that asks: a call, a `use`, a raise, a handler's choice, an abort.

A procedure and a package have no type of their own, so a test for "its type
did not resolve" that forgot the difference would silence all of these. One
did, and `abort P` on a procedure went through analysis and raised
Program_Error where the program ran instead.
"""
script = "N : Integer := 1; N (1);\nN : Integer := 1; use N;\nN : Integer := 1; raise N;\nprocedure P is begin null; end P; abort P;\npackage Q is M : Integer := 1; end Q; raise Q;"
exit_status = 2
output = []
diagnostics = [
  "!error.not_callable{name=N}!",
  "!error.not_a_package{name=N}!",
  "!error.not_an_exception{name=N}!",
  "!error.not_a_task{name=P}!",
  "!error.not_an_exception{name=Q}!",
]

[[case]]
id = "commands.nothing-where-a-name-is-needed-is-its-own-mistake"
requirement = """
`cd ("")` reported `no such directory: ` and `run ("")` reported `command not
found: ` -- sentences that stop where the name should be, and send a reader
looking for something they never wrote. `settings ("", "1")` did the same, and
`unset ("")` reported success for work it had not done.

The mistake is the empty text, and it is the same mistake in each of them: a
command that needs a name was given nothing. Said once, by name, before the
command goes looking. `run` covers its whole family, so `start` and `run_with`
say it too, each under its own name.

The commands that write -- `write_file`, `make_directory`, `remove_file`,
`rename`, `copy_file` -- said `nothing can be written at ` and now say what the
rest say. A `pipe` stage with no program is refused where it is added, because
by the time the pipeline runs there is nothing left to point at.

A failing command does not stop the sequence, so the session's own status is
nought: what each of these sets is `Status`, which is what a script tests.
"""
script = "cd (\"\");\nrun (\"\");\nsettings (\"\", \"1\");\nunset (\"\");\nsource (\"\");\nstart (\"\");\npipe (\"\");\nwrite_file (\"text\", \"\");\nmake_directory (\"\");\nremove_file (\"\");\nrename (\"\", \"\");"
exit_status = 0
output = []
diagnostics = [
  "!error.command.name_is_empty{name=cd}!",
  "!error.command.name_is_empty{name=run}!",
  "!error.command.name_is_empty{name=settings}!",
  "!error.command.name_is_empty{name=unset}!",
  "!error.command.name_is_empty{name=source}!",
  "!error.command.name_is_empty{name=start}!",
  "!error.command.name_is_empty{name=pipe}!",
  "!error.command.name_is_empty{name=write_file}!",
  "!error.command.name_is_empty{name=make_directory}!",
  "!error.command.name_is_empty{name=remove_file}!",
  "!error.command.name_is_empty{name=rename}!",
]
