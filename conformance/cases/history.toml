# What a session remembers, and what it deliberately does not.

[[case]]
id = "history.a-line-typed-with-a-space-is-not-remembered"
requirement = """
A history file is durable, plain, and rarely thought about, so a user needs a
way to keep one line out of it that works at the moment they think of it --
before typing the line, not after it is already on disk. The mark is a leading
space, as in other shells, because it is the one thing that can be typed in
front of a command without changing what the command means.

It is a mark, not a refusal: the line below still runs, and its output is here.
What is missing is the entry.
"""
script = "put_line (\"before\");\n put_line (\"marked\");\nput_line (\"after\");\nhistory;\nquit (0);"
exit_status = 0
output = [
  "before",
  "marked",
  "after",
  "!line.history_entry{number=1,line=put_line (\"before\");}!",
  "!line.history_entry{number=2,line=put_line (\"after\");}!",
  "!line.history_entry{number=3,line=history;}!",
]
diagnostics = []

[[case]]
id = "history.the-mark-is-read-at-the-submission"
requirement = """
An entry is a submission, however many lines it took, so the mark is the first
character of the whole thing rather than of each line in it. Ada is written
indented, and a continuation line that begins with a space is what a reader
would write anyway; if that decided the question, every multi-line construct
would be forgotten and no user could tell why.
"""
script = "if True then\n   put_line (\"in\");\nend if;\nhistory;\nquit (0);"
exit_status = 0
output = [
  "in",
  "!line.history_entry{number=1,line=if True then",
  "   put_line (\"in\");",
  "end if;}!",
  "!line.history_entry{number=2,line=history;}!",
]
diagnostics = []

[[case]]
id = "history.a-marked-construct-is-forgotten-whole"
requirement = """
The other half of the same rule. A construct marked on its first line leaves no
entry at all -- not the first line, not the rest of it. Half a construct in the
history would be both a record of what was typed and something nobody can recall
into shape.
"""
script = " if True then\n   put_line (\"in\");\nend if;\nhistory;\nquit (0);"
exit_status = 0
output = [
  "in",
  "!line.history_entry{number=1,line=history;}!",
]
diagnostics = []

[[case]]
id = "history.forget-takes-back-a-line-already-recorded"
requirement = """
The mark has to be typed before the line. A user who did not think of it in
time needs the other half: a line already in the history, taken out of the
session and out of the file.

`forget` takes itself with it. A history whose last entry is the command that
emptied it has kept a record of the act, which is most of what the user was
trying not to leave behind, so the count reports the lines they asked about and
not the command they used.
"""
script = "put_line (\"before\");\nput_line (\"secret\");\nforget;\nhistory;\nquit (0);"
exit_status = 0
output = [
  "before",
  "secret",
  "!line.forgotten{count=1}!",
  "!line.history_entry{number=1,line=put_line (\"before\");}!",
  "!line.history_entry{number=2,line=history;}!",
]
diagnostics = []

[[case]]
id = "history.forget-takes-as-many-as-it-is-given"
requirement = """
A count, because a secret is rarely one line: the command that read the file,
the one that used what it read. More than the log holds forgets what it holds
and says so -- a user asking to forget twenty of two meant the two.
"""
script = "put_line (\"a\");\nput_line (\"b\");\nforget (20);\nhistory;\nquit (0);"
exit_status = 0
output = [
  "a",
  "b",
  "!line.forgotten{count=2}!",
  "!line.history_entry{number=1,line=history;}!",
]
diagnostics = []

[[case]]
id = "history.forget-refuses-a-count-that-is-not-positive"
requirement = """
`history (0)` lists everything, because a count that means nothing there is
best read as "all of it" and costs a screen. `forget (0)` reading the same way
would cost the history. A command that destroys more than it was asked to must
not be reachable by a typing mistake, so a count below one is refused where it
stands and the log is untouched -- which is why the refused lines are still in
it below.
"""
script = "put_line (\"a\");\nforget (0);\nhistory;\nquit (0);"
exit_status = 0
output = [
  "a",
  "!line.history_entry{number=1,line=put_line (\"a\");}!",
  "!line.history_entry{number=2,line=forget (0);}!",
  "!line.history_entry{number=3,line=history;}!",
]
diagnostics = [
  "!error.command.wrong_arguments{name=forget}!",
]

[[case]]
id = "history.forget-takes-a-line-by-its-text"
requirement = """
The other way of saying which entry: a user who can see the line names it,
rather than counting backwards to it. Every copy of it goes, because the one
from earlier is the same line as the one from just now.

The `forget` line itself goes with them, and here that matters more than it
does for a count: the line that names a secret contains it. What is reported is
what the user asked to be rid of, not the asking.

One command rather than two. The parameter takes whatever it is given and the
command reads a number as "how many of the most recent" and a string as "this
line" -- two commands for that would be two things to learn and one of them
would be learned wrong.
"""
script = "put_line (\"one\");\nput_line (\"secret\");\nput_line (\"one\");\nforget (\"put_line (\"\"secret\"\");\");\nhistory;\nquit (0);"
exit_status = 0
output = [
  "one",
  "secret",
  "one",
  "!line.forgotten{count=1}!",
  "!line.history_entry{number=1,line=put_line (\"one\");}!",
  "!line.history_entry{number=2,line=put_line (\"one\");}!",
  "!line.history_entry{number=3,line=history;}!",
]
diagnostics = []

[[case]]
id = "history.forget-by-text-says-when-it-found-nothing"
requirement = """
A line that is not there is not an error to forget -- a user tidying up should
not have to know whether they already did -- and the count says what happened
rather than leaving them to check.
"""
script = "put_line (\"a\");\nforget (\"never typed this;\");\nhistory;\nquit (0);"
exit_status = 0
output = [
  "a",
  "!line.forgotten{count=0}!",
  "!line.history_entry{number=1,line=put_line (\"a\");}!",
  "!line.history_entry{number=2,line=history;}!",
]
diagnostics = []
